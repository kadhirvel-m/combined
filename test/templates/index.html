<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>N‑Up Print Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <header class="topbar">
    <h1>N‑Up Print Preview</h1>
    <div class="spacer"></div>
    <a class="gh" href="#" onclick="alert('Local demo'); return false;">Local Demo</a>
  </header>

  <main class="grid">
    <section class="left">
      <form id="uploadForm" class="card" enctype="multipart/form-data">
        <h2>1) Upload PDF</h2>
        <input type="file" name="file" accept="application/pdf" required />
        <button type="submit">Upload</button>
        <p id="fileState" class="muted"></p>
      </form>

      <div class="card">
        <h2>2) Layout</h2>
        <div class="row">
          <label>N‑up</label>
          <select id="nUp">
            <option value="1">1 per sheet</option>
            <option value="2" selected>2 per sheet</option>
            <option value="4">4 per sheet</option>
            <option value="6">6 per sheet</option>
            <option value="9">9 per sheet</option>
          </select>
        </div>
        <div class="row">
          <label>Page Size</label>
          <select id="pageSize">
            <option value="A4" selected>A4</option>
            <option value="Letter">Letter</option>
          </select>
        </div>
        <div class="row">
          <label>Orientation</label>
          <select id="orientation">
            <option value="portrait" selected>Portrait</option>
            <option value="landscape">Landscape</option>
          </select>
        </div>
        <div class="row">
          <label>Margin (pt)</label>
          <input id="margin" type="number" min="0" value="18" />
        </div>
        <div class="row">
          <label>Gap (pt)</label>
          <input id="gap" type="number" min="0" value="6" />
        </div>
        <div class="row">
          <label>Preview sheet</label>
          <input id="sheetIndex" type="number" min="0" value="0" />
        </div>
        <button id="refreshBtn" class="secondary" disabled>Refresh Preview</button>
      </div>

      <div class="card">
        <h2>3) Export</h2>
        <button id="exportBtn" disabled>Export N‑up PDF</button>
        <p id="exportState" class="muted"></p>
      </div>
    </section>

    <section class="right">
      <div class="previewWrap">
        <div class="previewHead">
          <h3>Preview</h3>
          <div class="zoomCtl">
            <button id="zoomOut">−</button>
            <span id="zoomVal">100%</span>
            <button id="zoomIn">+</button>
          </div>
        </div>
        <div class="previewPane">
          <img id="previewImg" alt="Preview will appear here" />
        </div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
