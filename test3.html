<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PaperX — Automotive/Chemistry Mega Menu</title>
    <meta name="description"
        content="Exact-style mega menu with left category rail and right featured-brands carousel. PaperX colorway (#1E1E2F, #4C2A59, #9E4B8A)." />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        indigoDark: '#1E1E2F',
                        deepPurple: '#4C2A59',
                        magenta: '#9E4B8A',
                        paper: '#FFFFFF',
                        stoneTint: '#F6F7FB',
                        edge: '#E7E9F2'
                    },
                    boxShadow: {
                        ring: '0 1px 2px rgb(0 0 0 / 0.06), 0 6px 16px rgb(0 0 0 / 0.08)'
                    },
                    borderRadius: { '4xl': '2rem' }
                }
            }
        }
    </script>
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:wght@400;600;700" rel="stylesheet" />
    <style>
        .material-symbols-rounded {
            font-variation-settings: 'FILL' 0, 'wght' 600, 'GRAD' 0, 'opsz' 24
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none
        }

        .no-scrollbar {
            scrollbar-width: none;
            -ms-overflow-style: none
        }
    </style>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body class="min-h-screen bg-gradient-to-b from-[#E8F0EA] via-white to-[#EEF0FA] text-indigoDark antialiased">

    <!-- Top bar -->
    <header x-data="megaNav()"
        class="sticky top-0 z-50 border-b border-edge/70 bg-white/80 backdrop-blur supports-[backdrop-filter]:bg-white/60">
        <div class="mx-auto max-w-[1180px] px-4 md:px-6">
            <div class="flex h-16 items-center justify-between gap-4">
                <!-- Brand -->
                <a href="#" class="flex items-center gap-2">
                    <span
                        class="inline-grid h-9 w-9 place-items-center rounded-xl bg-deepPurple/10 text-deepPurple shadow-ring">PX</span>
                    <span class="text-xl font-extrabold tracking-tight">PaperX</span>
                </a>

                <!-- Desktop Nav -->
                <nav class="hidden md:flex items-center gap-2">
                    <div class="relative" @mouseenter="open('projects')" @mouseleave="close('projects')">
                        <button @click="toggle('projects')" :aria-expanded="isOpen('projects')"
                            class="group inline-flex items-center gap-1 rounded-full px-3 py-2 text-sm font-medium text-indigoDark/90 hover:bg-stoneTint focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-magenta">
                            projects
                            <span class="material-symbols-rounded text-base transition-transform"
                                :class="{ 'rotate-180' : isOpen('projects') }">expand_more</span>
                        </button>

                        <!-- MEGAMENU PANEL -->
                        <div x-cloak x-show="isOpen('projects')" x-transition:enter="transition ease-out duration-150"
                            x-transition:enter-start="opacity-0 -translate-y-1"
                            x-transition:enter-end="opacity-100 translate-y-0"
                            x-transition:leave="transition ease-in duration-100" x-transition:leave-start="opacity-100"
                            x-transition:leave-end="opacity-0" @click.outside="close('projects')"
                            class="absolute left-1/2 mt-3 w-[1200px] max-w-[95vw] -translate-x-1/2">
                            <!-- Width increased from 1040px to 1200px (capped at 95vw) so all brand cards (5 x 10rem + gaps) fit without horizontal scrolling -->
                            <div class="rounded-3xl border border-edge bg-white shadow-2xl">
                                <div class="grid grid-cols-[320px,1fr] gap-0">
                                    <!-- LEFT CATEGORY RAIL -->
                                    <aside class="border-r border-edge/80 p-4">
                                        <ul class="space-y-2">
                                            <template x-for="(c, i) in categories" :key="c.id">
                                                <li>
                                                    <button @click="select(i)" @mouseenter="select(i)"
                                                        @focus="select(i)" :aria-current="i===current? 'true':'false'"
                                                        class="group flex w-full items-center justify-between gap-3 rounded-xl border border-transparent px-3 py-3 text-left transition hover:bg-stoneTint focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-magenta"
                                                        :class="i===current ? 'bg-white shadow-sm border-edge' : ''">
                                                        <span>
                                                            <span
                                                                class="block text-[13px] font-bold tracking-wide text-deepPurple uppercase">
                                                                <span x-text="c.title"></span> </span>
                                                            <span class="mt-0.5 block text-[12px] text-indigoDark/70"
                                                                x-text="c.subtitle"></span>
                                                        </span>
                                                        <span
                                                            class="material-symbols-rounded text-magenta group-hover:translate-x-0.5 transition">chevron_right</span>
                                                    </button>
                                                </li>
                                            </template>
                                        </ul>
                                    </aside>

                                    <!-- RIGHT FEATURED BRANDS -->
                                    <section class="p-5">
                                        <div class="flex items-baseline justify-between">
                                            <h3
                                                class="text-[13px] font-bold tracking-[0.12em] text-indigoDark/80 uppercase">
                                                Featured Brands</h3>
                                            <!-- carousel arrows -->
                                            <div class="hidden sm:flex items-center gap-2">
                                                <button @click="scrollBrands(-1)"
                                                    class="inline-flex h-8 w-8 items-center justify-center rounded-full border border-edge bg-white text-indigoDark hover:bg-stoneTint"><span
                                                        class="material-symbols-rounded">chevron_left</span></button>
                                                <button @click="scrollBrands( 1)"
                                                    class="inline-flex h-8 w-8 items-center justify-center rounded-full border border-edge bg-white text-indigoDark hover:bg-stoneTint"><span
                                                        class="material-symbols-rounded">chevron_right</span></button>
                                            </div>
                                        </div>

                                        <!-- strip -->
                                        <div class="mt-3 flex items-stretch gap-3">
                                            <!-- Expect ~5 brand cards (w-40 + gap-3) to fit in single row at 1200px width -->
                                            <div class="relative w-full">
                                                <div class="no-scrollbar flex snap-x snap-mandatory gap-3 overflow-x-auto pb-2"
                                                    x-ref="brands">
                                                    <!-- Image heights enlarged: desktop image h-48 within card h-64 -->
                                                    <template x-for="b in categories[current].brands" :key="b.name">
                                                        <a :href="b.href"
                                                            class="group relative flex h-64 w-40 shrink-0 snap-start flex-col overflow-hidden rounded-xl border border-edge bg-white shadow-ring">
                                                            <template x-if="b.img">
                                                                <img :src="b.img" :alt="b.name + ' image'"
                                                                    class="h-48 w-full object-cover" />
                                                            </template>
                                                            <template x-if="!b.img">
                                                                <div
                                                                    class="h-48 w-full bg-stoneTint flex items-center justify-center text-xs text-indigoDark/60">
                                                                    No Image</div>
                                                            </template>
                                                            <div class="flex flex-1 flex-col px-2 py-2">
                                                                <div class="text-[10px] font-semibold uppercase tracking-wider text-magenta"
                                                                    x-text="b.tag"></div>
                                                                <div class="mt-0.5 text-sm font-bold leading-snug text-indigoDark"
                                                                    x-text="b.name"></div>
                                                            </div>
                                                        </a>
                                                    </template>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- CTA -->
                                        <div class="mt-4 flex items-center">
                                            <span class="mr-2 h-6 w-1 rounded-full bg-magenta"></span>
                                            <a :href="categories[current].cta.href"
                                                class="inline-flex items-center gap-1 text-[13px] font-bold uppercase tracking-wide text-magenta hover:text-deepPurple">
                                                <span x-text="categories[current].cta.label"></span>
                                                <span class="material-symbols-rounded text-base">chevron_right</span>
                                            </a>
                                        </div>
                                    </section>
                                </div>
                            </div>
                        </div>
                    </div>

                    <a href="#"
                        class="rounded-full px-3 py-2 text-sm font-medium text-indigoDark/90 hover:bg-stoneTint">Contact</a>
                    <a href="#"
                        class="rounded-full px-3 py-2 text-sm font-medium text-indigoDark/90 hover:bg-stoneTint">Blog</a>
                    <a href="#"
                        class="rounded-full px-3 py-2 text-sm font-medium text-indigoDark/90 hover:bg-stoneTint">Help</a>
                </nav>

                <!-- Right actions -->
                <div class="hidden md:flex items-center gap-2">
                    <a href="#"
                        class="rounded-full px-3 py-2 text-sm font-semibold text-indigoDark/90 hover:bg-stoneTint">Login</a>
                    <a href="#"
                        class="inline-flex items-center justify-center rounded-full bg-magenta px-4 py-2 text-sm font-semibold text-white shadow-ring hover:bg-deepPurple">Get
                        Started</a>
                </div>

                <!-- Mobile hamburger -->
                <button @click="mobileOpen=true"
                    class="md:hidden inline-flex h-9 w-9 items-center justify-center rounded-lg border border-edge bg-white text-indigoDark shadow-ring"><span
                        class="material-symbols-rounded">menu</span></button>
            </div>
        </div>

        <!-- Mobile sheet -->
        <div x-cloak x-show="mobileOpen" x-transition.opacity class="fixed inset-0 z-50 md:hidden">
            <div class="absolute inset-0 bg-black/40" @click="mobileOpen=false"></div>
            <div class="ml-auto flex h-full w-[92%] max-w-sm flex-col rounded-l-2xl bg-white shadow-2xl">
                <div class="flex items-center justify-between p-4">
                    <div class="flex items-center gap-2 font-extrabold"><span
                            class="inline-grid h-9 w-9 place-items-center rounded-xl bg-deepPurple/10 text-deepPurple">PX</span>
                        PaperX</div>
                    <button @click="mobileOpen=false" class="rounded-lg border border-edge p-2"><span
                            class="material-symbols-rounded">close</span></button>
                </div>

                <div class="border-y border-edge p-2 overflow-y-auto no-scrollbar">
                    <details class="group" open>
                        <summary
                            class="flex cursor-pointer list-none items-center justify-between rounded-lg px-2 py-2 text-sm font-semibold hover:bg-stoneTint">
                            projects <span
                                class="material-symbols-rounded transition-transform group-open:rotate-180">expand_more</span>
                        </summary>
                        <div class="mt-2 rounded-2xl border border-edge p-3">
                            <ul class="space-y-2">
                                <template x-for="(c, i) in categories" :key="c.id">
                                    <li>
                                        <button @click="select(i)" @mouseenter="select(i)" @focus="select(i)"
                                            class="flex w-full items-center justify-between rounded-xl px-3 py-3 text-left hover:bg-stoneTint">
                                            <span>
                                                <span class="block text-[13px] font-bold uppercase text-deepPurple"
                                                    x-text="c.title"></span>
                                                <span class="block text-[12px] text-indigoDark/70"
                                                    x-text="c.subtitle"></span>
                                            </span>
                                            <span class="material-symbols-rounded text-magenta">chevron_right</span>
                                        </button>
                                    </li>
                                </template>
                            </ul>

                            <div class="mt-3">
                                <div class="text-[11px] font-bold uppercase tracking-wider text-indigoDark/70">Featured
                                    Brands</div>
                                <div class="mt-2 flex gap-2 overflow-x-auto no-scrollbar">
                                    <template x-for="b in categories[current].brands" :key="b.name">
                                        <a :href="b.href"
                                            class="flex h-60 w-36 shrink-0 flex-col overflow-hidden rounded-xl border border-edge bg-white">
                                            <template x-if="b.img">
                                                <img :src="b.img" :alt="b.name + ' image'"
                                                    class="h-40 w-full object-cover" />
                                            </template>
                                            <template x-if="!b.img">
                                                <div
                                                    class="h-40 w-full bg-stoneTint flex items-center justify-center text-[10px] text-indigoDark/60">
                                                    No Image</div>
                                            </template>
                                            <div class="flex flex-1 flex-col px-2 py-2">
                                                <div class="text-[10px] font-semibold uppercase tracking-wider text-magenta"
                                                    x-text="b.tag"></div>
                                                <div class="mt-0.5 text-sm font-bold leading-snug text-indigoDark"
                                                    x-text="b.name"></div>
                                            </div>
                                        </a>
                                    </template>
                                </div>

                                <a :href="categories[current].cta.href"
                                    class="mt-3 inline-flex items-center gap-1 text-[13px] font-bold uppercase tracking-wide text-magenta"><span
                                        x-text="categories[current].cta.label"></span><span
                                        class="material-symbols-rounded text-base">chevron_right</span></a>
                            </div>
                        </div>
                    </details>
                    <a href="#"
                        class="mt-2 block rounded-lg px-2 py-2 text-sm font-medium hover:bg-stoneTint">Contact</a>
                    <a href="#" class="block rounded-lg px-2 py-2 text-sm font-medium hover:bg-stoneTint">Blog</a>
                    <a href="#" class="block rounded-lg px-2 py-2 text-sm font-medium hover:bg-stoneTint">Help</a>
                </div>

                <div class="p-4 flex items-center gap-2">
                    <a href="#"
                        class="flex-1 rounded-full border border-edge px-3 py-2 text-center text-sm font-semibold">Login</a>
                    <a href="#"
                        class="flex-1 rounded-full bg-magenta px-3 py-2 text-center text-sm font-semibold text-white">Get
                        Started</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Demo hero area to mimic screenshot context -->
    <main class="mx-auto max-w-[1180px] px-4 md:px-6">
        <section class="py-10">
            <div
                class="rounded-4xl border border-edge bg-[url('https://images.unsplash.com/photo-1542367597-8849eb96290c?q=80&w=2070&auto=format&fit=crop')] bg-cover bg-center p-6 shadow-ring">
                <div class="rounded-3xl border border-white/25 bg-white/80 p-6 text-center backdrop-blur">
                    <p class="text-sm text-indigoDark/80">Hover or click <span class="font-semibold">projects</span> to
                        open the mega menu.</p>
                </div>
                <!-- partner strip like the mockup bottom -->
                <div
                    class="mt-6 flex flex-wrap items-center justify-center gap-8 rounded-2xl bg-black/70 px-6 py-4 text-white">
                    <span class="text-sm opacity-80">Boogie Detailing</span>
                    <span class="text-sm opacity-80">SOAX</span>
                    <span class="text-sm opacity-80">ClearWash</span>
                    <span class="text-sm opacity-80">TrueVue</span>
                </div>
            </div>
        </section>
    </main>

    <script>
        function megaNav() {
            return {
                active: null,
                mobileOpen: false,
                current: 0,
                categories: [
                    {
                        id: 'chem',
                        title: 'Chemistry',
                        subtitle: 'Core Platform Navigation',
                        cta: { label: 'Go to Chemistry Hub', href: '#' },
                        // Updated per request: five items with images
                        brands: [
                            { name: 'Postings', tag: 'Module', img: 'paper/assets/img/nav/nav1.png', href: '#' },
                            { name: 'Create a Project', tag: 'Action', img: 'paper/assets/img/nav/nav2.png', href: '#' },
                            { name: 'Incoming Requests', tag: 'Queue', img: 'paper/assets/img/nav/nav3.png', href: '#' },
                            { name: 'My Applications', tag: 'Dashboard', img: 'paper/assets/img/nav/nav4.png', href: '#' },
                            { name: 'Test Portal', tag: 'Lab', img: 'paper/assets/img/nav/nav5.png', href: '#' },
                        ]
                    },
                    {
                        id: 'equip', title: 'Equipment', subtitle: 'Delivering Exceptional Performance', cta: { label: 'See all Equipment', href: '#' }, brands: [
                            { name: 'FoamMaster', tag: 'System', href: '#' },
                            { name: 'ClearWash', tag: 'System', href: '#' },
                            { name: 'TrueVue', tag: 'System', href: '#' },
                            { name: 'HydroJet', tag: 'System', href: '#' },
                        ]
                    },
                    {
                        id: 'digital', title: 'Digital Tech', subtitle: 'Embracing the Future', cta: { label: 'See all Digital tools', href: '#' }, brands: [
                            { name: 'Pulse IOT', tag: 'Platform', href: '#' },
                            { name: 'WashOS', tag: 'Software', href: '#' },
                            { name: 'VisionAI', tag: 'Analytics', href: '#' },
                        ]
                    },
                    {
                        id: 'service', title: 'Service', subtitle: 'For Our Direct‑to‑Market Regions', cta: { label: 'See all Services', href: '#' }, brands: [
                            { name: 'Pro Install', tag: 'Service', href: '#' },
                            { name: 'Field Support', tag: 'Service', href: '#' },
                            { name: 'Training', tag: 'Academy', href: '#' },
                        ]
                    },
                ],
                isOpen(key) { return this.active === key },
                open(key) { this.active = key },
                close(key) { if (this.active === key) this.active = null },
                toggle(key) { this.active = this.active === key ? null : key },
                select(index) { this.current = index },
                scrollBrands(dir) { this.$refs.brands?.scrollBy({ left: dir * 260, behavior: 'smooth' }); }
            }
        }
    </script>
</body>

</html>
