<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardio-Viz Pro: Cardiovascular Hemodynamics</title>

    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
        rel="stylesheet" />

    <style>
        :root {
            --bg: #181818;
            /* Lighten background for contrast */
            --panel: rgba(10, 20, 30, 0.85);
            --border: #1f3a4d;
            --accent: #00f2ff;
            --blood-ox: #ff3333;
            --blood-deox: #3388ff;
            --text: #cceeff;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--text);
        }

        /* LAYOUT */
        #viewport {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* UI OVERLAY */
        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            p-20;
        }

        /* HEADER */
        .header {
            padding: 24px;
            pointer-events: auto;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0) 100%);
        }

        .brand {
            font-family: 'Share Tech Mono', monospace;
            font-size: 24px;
            color: var(--accent);
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
        }

        .sub-brand {
            font-size: 12px;
            opacity: 0.7;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0;
        }

        /* CONTROLS PANEL */
        .controls {
            pointer-events: auto;
            background: var(--panel);
            border: 1px solid var(--border);
            backdrop-filter: blur(12px);
            width: 300px;
            padding: 20px;
            margin: 24px;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .control-group {
            margin-bottom: 20px;
        }

        .label {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* BPM SLIDER */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: #1a3a4a;
            border-radius: 2px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--accent);
            margin-top: -6px;
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent);
        }

        /* ECG MONITOR */
        .ecg-monitor {
            background: #000;
            border: 1px solid #333;
            height: 80px;
            width: 100%;
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        #ecg-canvas {
            width: 100%;
            height: 100%;
        }

        /* LEGEND */
        .legend-item {
            display: flex;
            align-items: center;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 5px currentColor;
        }

        /* ANATOMY LABEL (Tooltip) */
        #anatomy-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--accent);
            padding: 8px 16px;
            border-radius: 20px;
            font-family: 'Share Tech Mono', monospace;
            color: #fff;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            white-space: nowrap;
        }

        #anatomy-label::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: var(--accent) transparent transparent transparent;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>

    <div id="anatomy-label">Left Ventricle</div>

    <div class="ui-container">
        <div class="header">
            <div>
                <div class="brand">CARDIO-VIZ PRO</div>
                <div class="sub-brand">Human Hemodynamics Simulator</div>
            </div>
        </div>

        <div style="flex:1;"></div>

        <div class="controls" style="position: absolute; left: 0; bottom: 0;">
            <div class="control-group">
                <div class="label">ECG Monitor (Lead II)</div>
                <div class="ecg-monitor">
                    <canvas id="ecg-canvas"></canvas>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:24px; font-weight:bold; color:var(--accent);" id="bpm-display">60</span>
                    <span style="font-size:12px; color:#666;">BPM</span>
                </div>
            </div>

            <div class="control-group">
                <div class="label">Heart Rate Control</div>
                <input type="range" id="bpm-slider" min="40" max="140" value="60">
            </div>

            <div class="control-group">
                <div class="label">Flow Visualization</div>
                <div class="legend-item">
                    <div class="dot" style="background:var(--blood-ox);"></div> Oxygenated (Arterial)
                </div>
                <div class="legend-item">
                    <div class="dot" style="background:var(--blood-deox);"></div> Deoxygenated (Venous)
                </div>
            </div>
        </div>
    </div>

    <div id="viewport"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- CONFIG ---
        const config = {
            bpm: 60,
            beatDuration: 1.0, // seconds per beat
            colors: {
                tissue: 0xc0392b, // Brighter tissue
                tissueHighlight: 0xe74c3c, // Brighter highlight
                vein: 0x3498db, // Brighter vein
                artery: 0xf1c40f, // Bright yellow for heat effect
                bg: 0x181818 // Match CSS background
            }
        };

        // --- SCENE ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(config.colors.bg);
        scene.fog = new THREE.FogExp2(config.colors.bg, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 2, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.getElementById('viewport').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.enablePan = false;
        controls.minDistance = 5;
        controls.maxDistance = 20;

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); // Increase ambient light
        scene.add(ambientLight);

        const spotLight = new THREE.SpotLight(0xffffff, 3); // Increase spot light
        spotLight.position.set(5, 10, 5);
        spotLight.angle = 0.5;
        spotLight.penumbra = 0.5;
        scene.add(spotLight);

        const rimLight = new THREE.DirectionalLight(0x00f2ff, 1);
        rimLight.position.set(-5, 0, -5);
        scene.add(rimLight);

        const bottomLight = new THREE.PointLight(0xff0000, 0.5);
        bottomLight.position.set(0, -5, 0);
        scene.add(bottomLight);

        // --- HEART MESH GENERATION ---
        const heartGroup = new THREE.Group();
        scene.add(heartGroup);

        // Materials
        const tissueMaterial = new THREE.MeshPhysicalMaterial({
            color: config.colors.tissue,
            roughness: 0.45,
            metalness: 0.05,
            clearcoat: 0.7,
            clearcoatRoughness: 0.25,
            sheen: 0.7,
            sheenColor: 0xffb3b3,
            transmission: 0.5, // Simulate subsurface scattering
            thickness: 0.6,
            ior: 1.4,
            specularIntensity: 0.7,
            specularColor: 0xffe0e0
        });

        const veinMaterial = new THREE.MeshPhysicalMaterial({
            color: config.colors.vein,
            roughness: 0.2, metalness: 0.3, clearcoat: 1.0, transparent: false, opacity: 1.0,
            emissive: config.colors.vein, emissiveIntensity: 0.3 // Add glow
        });

        // 1. Main Chambers (Ventricles)
        // We use a Sphere geometry and deform vertices to look like a heart
        const ventricleGeo = new THREE.SphereGeometry(2, 64, 64);
        const posAttribute = ventricleGeo.attributes.position;
        const vertex = new THREE.Vector3();

        for (let i = 0; i < posAttribute.count; i++) {
            vertex.fromBufferAttribute(posAttribute, i);

            // Heart Shaping Math (more anatomical)
            const x = vertex.x;
            const y = vertex.y;
            const z = vertex.z;

            // Taper bottom (Apex)
            let taper = 1.0;
            if (y < 0) taper = 1.0 - (y * -0.35);

            // Bulge top and sides
            vertex.x *= (1.0 + Math.abs(y) * 0.18 + Math.abs(z) * 0.08);
            vertex.z *= (1.0 + Math.abs(y) * 0.12);

            // Asymmetry (Left ventricle is larger)
            if (x > 0) vertex.x *= 1.18;

            // Flatten back slightly
            if (z < 0) vertex.z *= 0.7;

            // Pointy tip at bottom
            if (y < -1.5) {
                vertex.x *= 0.5;
                vertex.z *= 0.5;
            }

            // Add a slight twist for realism
            vertex.x += Math.sin(y * 1.5) * 0.12;
            vertex.z += Math.cos(x * 1.5) * 0.08;

            // Add surface bumpiness for organic look
            vertex.x += Math.sin(x * 3 + y * 2) * 0.04;
            vertex.y += Math.sin(z * 2 + x * 2) * 0.03;

            posAttribute.setXYZ(i, vertex.x, vertex.y, vertex.z);
        }
        ventricleGeo.computeVertexNormals();
        const ventricles = new THREE.Mesh(ventricleGeo, tissueMaterial);
        ventricles.userData = { name: "Ventricles (Pumping Chambers)" };
        heartGroup.add(ventricles);

        // 2. Atria (Top Chambers)
        const atriaGeo = new THREE.SphereGeometry(1.3, 32, 32);
        const atria = new THREE.Mesh(atriaGeo, tissueMaterial);
        atria.scale.set(1.3, 0.9, 1.1);
        atria.position.set(0, 2.1, -0.3);
        atria.userData = { name: "Atria (Receiving Chambers)" };
        heartGroup.add(atria);

        // --- VESSEL GENERATION (TUBES) ---

        function createVessel(pathPoints, radius, material, name) {
            const path = new THREE.CatmullRomCurve3(pathPoints);
            const geometry = new THREE.TubeGeometry(path, 20, radius, 16, false);
            const mesh = new THREE.Mesh(geometry, material);
            mesh.userData = { name: name, curve: path }; // Store curve for blood flow
            heartGroup.add(mesh);
            return mesh;
        }

        // Aorta (Arch) - Carries Oxygenated Blood to Body/Brain
        const aortaPoints = [
            new THREE.Vector3(0.5, 1.5, 0),    // Origin at LV
            new THREE.Vector3(0.2, 3.5, 0),    // Ascending
            new THREE.Vector3(-1.0, 4.0, 0),   // Arch top
            new THREE.Vector3(-1.5, 2.5, -0.5) // Descending
        ];
        const aorta = createVessel(aortaPoints, 0.45, new THREE.MeshPhysicalMaterial({
            color: config.colors.artery,
            roughness: 0.2, metalness: 0.3, clearcoat: 1.0,
            emissive: config.colors.artery, emissiveIntensity: 0.4 // Heat effect
        }), "Aorta (To Body & Brain)");

        // Superior Vena Cava - Deoxygenated from Body
        const svcPoints = [
            new THREE.Vector3(-1.2, 4.0, 0.5),
            new THREE.Vector3(-1.2, 2.0, 0.2)
        ];
        const svc = createVessel(svcPoints, 0.4, veinMaterial, "Superior Vena Cava");

        // Pulmonary Artery - To Lungs
        const paPoints = [
            new THREE.Vector3(-0.3, 2.0, 0.8),
            new THREE.Vector3(1.5, 3.0, 0.5)
        ];
        const pa = createVessel(paPoints, 0.35, veinMaterial, "Pulmonary Artery (To Lungs)");

        // Carotid Arteries (To Brain)
        const carotidPoints1 = [new THREE.Vector3(-0.5, 4.0, 0), new THREE.Vector3(-0.5, 6.0, 0)];
        const carotid1 = createVessel(carotidPoints1, 0.15, tissueMaterial, "Carotid Artery (To Brain)");

        const carotidPoints2 = [new THREE.Vector3(-1.0, 4.0, 0), new THREE.Vector3(-1.5, 5.5, 0)];
        const carotid2 = createVessel(carotidPoints2, 0.15, tissueMaterial, "Subclavian Artery");


        // --- BLOOD FLOW PARTICLE SYSTEM ---

        const bloodParticles = [];
        const particleGeo = new THREE.SphereGeometry(0.06, 8, 8);
        const oxMat = new THREE.MeshBasicMaterial({ color: 0xff3333 });
        const deoxMat = new THREE.MeshBasicMaterial({ color: 0x3388ff });

        function createFlow(vesselMesh, count, type) {
            const curve = vesselMesh.userData.curve;
            const mat = type === 'ox' ? oxMat : deoxMat;

            for (let i = 0; i < count; i++) {
                const mesh = new THREE.Mesh(particleGeo, mat);
                scene.add(mesh);
                bloodParticles.push({
                    mesh: mesh,
                    curve: curve,
                    t: Math.random(), // position along curve (0-1)
                    speed: 0.3 + Math.random() * 0.2 // Base speed
                });
            }
        }

        createFlow(aorta, 30, 'ox'); // Red cells in Aorta
        createFlow(svc, 20, 'deox'); // Blue cells in Vena Cava
        createFlow(pa, 20, 'deox');  // Blue cells in Pulmonary Artery
        createFlow(carotid1, 10, 'ox'); // Red to brain

        // --- INTERACTION (RAYCASTER) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const labelDiv = document.getElementById('anatomy-label');

        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // Move Label
            const x = event.clientX;
            const y = event.clientY;

            // Raycast
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(heartGroup.children);

            if (intersects.length > 0) {
                const name = intersects[0].object.userData.name;
                if (name) {
                    labelDiv.innerText = name;
                    labelDiv.style.opacity = 1;
                    labelDiv.style.top = (y - 40) + 'px';
                    labelDiv.style.left = x + 'px';
                    document.body.style.cursor = 'pointer';
                    return;
                }
            }
            labelDiv.style.opacity = 0;
            document.body.style.cursor = 'default';
        });

        // --- ECG CANVAS ---
        const ecgCanvas = document.getElementById('ecg-canvas');
        const ctx = ecgCanvas.getContext('2d');
        ecgCanvas.width = 300;
        ecgCanvas.height = 80;

        let ecgTime = 0;
        const ecgHistory = [];

        function updateECG() {
            // Draw background
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, ecgCanvas.width, ecgCanvas.height);

            // Grid
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let x = 0; x < ecgCanvas.width; x += 20) { ctx.moveTo(x, 0); ctx.lineTo(x, 80); }
            for (let y = 0; y < ecgCanvas.height; y += 20) { ctx.moveTo(0, y); ctx.lineTo(300, y); }
            ctx.stroke();

            // Calculate signal (P-QRS-T wave simulation)
            const t = (ecgTime % config.beatDuration) / config.beatDuration; // 0 to 1 loop
            let signal = 40; // baseline

            // P wave (Atrial contraction)
            if (t > 0.1 && t < 0.2) signal -= Math.sin((t - 0.1) * 31.4) * 5;
            // QRS Complex (Ventricular contraction)
            else if (t > 0.3 && t < 0.35) signal -= Math.sin((t - 0.3) * 62.8) * 30; // Spike
            // T wave (Repolarization)
            else if (t > 0.5 && t < 0.7) signal -= Math.sin((t - 0.5) * 15.7) * 8;

            ecgHistory.push(signal);
            if (ecgHistory.length > ecgCanvas.width) ecgHistory.shift();

            // Draw Line
            ctx.strokeStyle = '#00f2ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < ecgHistory.length; i++) {
                ctx.lineTo(i, ecgHistory[i]);
            }
            ctx.stroke();
        }

        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // 1. Heartbeat Animation (Scale)
            // Beat based on BPM
            const bps = config.bpm / 60;
            config.beatDuration = 1 / bps;

            // Normalized time within one beat (0 to 1)
            const t = (time % config.beatDuration) / config.beatDuration;

            // Contraction logic (Systole)
            // Rapid contraction at t=0.3 (QRS)
            let contraction = 0;
            if (t > 0.3 && t < 0.5) {
                const peak = Math.sin((t - 0.3) * Math.PI * 10); // rapid spike
                contraction = peak * 0.1;
            }

            // Apply scale
            const scale = 1.0 + (contraction * 0.5); // Atria expand when Ventricles contract slightly
            const vScale = 1.0 - contraction; // Ventricles shrink

            ventricles.scale.set(vScale, vScale, vScale);
            atria.scale.set(1.4 * (1 + contraction * 0.5), 0.8 * (1 + contraction * 0.5), 1); // Inverse rhythm

            // 2. Blood Flow
            bloodParticles.forEach(p => {
                // Move particle
                // Speed increases during Systole (contraction)
                let currentSpeed = p.speed * bps;
                if (t > 0.3 && t < 0.5) currentSpeed *= 3; // Surge!

                p.t += currentSpeed * delta;
                if (p.t > 1) p.t = 0;

                const pos = p.curve.getPointAt(p.t);

                // Add some random jitter so they aren't in a single line
                // We use the tangent to jitter perpendicular? Simple jitter is fine for this view
                p.mesh.position.set(
                    pos.x + (Math.random() - 0.5) * 0.1,
                    pos.y + (Math.random() - 0.5) * 0.1,
                    pos.z + (Math.random() - 0.5) * 0.1
                );
            });

            // 3. ECG
            ecgTime += delta;
            updateECG();

            controls.update();
            renderer.render(scene, camera);
        }

        // --- UI HANDLERS ---
        const bpmSlider = document.getElementById('bpm-slider');
        const bpmDisplay = document.getElementById('bpm-display');

        bpmSlider.addEventListener('input', (e) => {
            config.bpm = parseInt(e.target.value);
            bpmDisplay.innerText = config.bpm;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

    </script>
</body>

</html>
