<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Note — Marketplace</title>
    <link rel="icon" type="image/x-icon" href="../../assets/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,0,0"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { container: { center: true, padding: '1rem' }, extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] }, colors: { brand: { 900: '#1E1E2F', 700: '#4C2A59', 500: '#9E4B8A' }, brandlt: { 50: '#FAF5FB', 100: '#F3E7F2', 200: '#E7D0E4', 300: '#D9B4D3', 400: '#C88DBA', 500: '#9E4B8A', 700: '#4C2A59', 900: '#1E1E2F' } } } } };
    </script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(12px);
        }

        .dark .glass {
            background: rgba(30, 30, 47, 0.55);
        }

        body {
            font-family: Inter, ui-sans-serif, system-ui, sans-serif
        }
    </style>
    <script>(() => { const s = localStorage.getItem('px_theme'); const m = matchMedia('(prefers-color-scheme: dark)').matches; const d = s ? s === 'dark' : m; if (d) document.documentElement.classList.add('dark'); })();</script>
    <!-- Load config first so API_BASE resolves before auth.js -->
    <script src="../../config.js"></script>
    <script src="../../auth.js" defer></script>
</head>

<body class="min-h-screen font-sans antialiased text-neutral-900 dark:text-white bg-hero-light dark:bg-hero-dark">
    <header
        class="sticky top-0 z-40 bg-white/70 dark:bg-brand-900/60 backdrop-blur border-b border-black/5 dark:border-white/10">
        <div class="container flex items-center justify-between py-3">
            <a href="../../index.html" class="flex items-center gap-3" aria-label="Paper X Home">
                <img src="../../assets/img/logo-light.svg" alt="Paper X" class="h-9 w-auto dark:hidden">
                <img src="../../assets/img/logo-dark.svg" alt="Paper X" class="h-9 w-auto hidden dark:block">
            </a>
            <nav class="hidden md:flex items-center gap-6 text-sm text-neutral-700 dark:text-white/85">
                <a class="hover:text-brandlt-900 dark:hover:text-white" href="./notes_marketplace.html">Marketplace</a>
                <a class="hover:text-brandlt-900 dark:hover:text-white font-medium" href="./upload_note.html">Upload</a>
                <a class="hover:text-brandlt-900 dark:hover:text-white" href="../../collage/clg_info.html">Colleges</a>
                <a class="hover:text-brandlt-900 dark:hover:text-white" href="../../help.html">Help</a>
            </nav>
            <div class="hidden md:flex items-center gap-2">
                <button data-theme-toggle
                    class="inline-flex items-center gap-2 rounded-full px-3 py-1.5 text-sm ring-1 ring-black/10 dark:ring-white/15 hover:bg-black/5 dark:hover:bg-white/5">
                    <span class="material-symbols-rounded text-base">dark_mode</span>
                </button>
            </div>
            <div class="md:hidden flex items-center gap-2">
                <button data-theme-toggle
                    class="inline-flex items-center justify-center size-10 rounded-full ring-1 ring-black/10 dark:ring-white/15 hover:bg-black/5 dark:hover:bg-white/5">
                    <span class="material-symbols-rounded">dark_mode</span>
                </button>
            </div>
        </div>
    </header>
    <main class="container max-w-4xl py-10">
        <div class="mb-6">
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">Upload Note</h1>
            <p class="text-sm text-neutral-600 dark:text-white/60 mt-1">Share high‑quality material with the community.
            </p>
        </div>
        <form id="uploadForm"
            class="space-y-6 glass p-6 rounded-2xl shadow-card ring-1 ring-black/5 dark:ring-white/10">
            <form id="uploadForm"
                class="space-y-6 bg-white/70 dark:bg-white/5 p-6 rounded-xl border border-black/5 dark:border-white/10 backdrop-blur">
                <div class="grid md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-sm font-medium">Title *</label>
                        <input name="title" required
                            class="w-full rounded-md border px-3 py-2 text-sm bg-white/90 dark:bg-white/10"
                            placeholder="e.g. Data Structures Unit 1" />
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-medium">Subject</label>
                        <input name="subject"
                            class="w-full rounded-md border px-3 py-2 text-sm bg-white/90 dark:bg-white/10" />
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-medium">Unit</label>
                        <input name="unit"
                            class="w-full rounded-md border px-3 py-2 text-sm bg-white/90 dark:bg-white/10" />
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-medium">Exam Type</label>
                        <input name="exam_type"
                            class="w-full rounded-md border px-3 py-2 text-sm bg-white/90 dark:bg-white/10"
                            placeholder="Midterm / Finals / Gate" />
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-medium">Categories (comma separated)</label>
                        <input name="categories"
                            class="w-full rounded-md border px-3 py-2 text-sm bg-white/90 dark:bg-white/10"
                            placeholder="DSA, Trees" />
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-medium">Price (₹) — 0 for free</label>
                        <input name="price_cents" type="number" min="0" value="0"
                            class="w-full rounded-md border px-3 py-2 text-sm bg-white/90 dark:bg-white/10" />
                    </div>
                    <!-- Academic linkage selectors -->
                    <div class="space-y-2">
                        <label class="text-sm font-medium">College</label>
                        <select name="college_id" id="collegeSel"
                            class="w-full rounded-md border px-3 py-2 text-sm bg-white/90 dark:bg-white/10">
                            <option value="">-- Select College --</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-medium">Degree</label>
                        <select name="degree_id" id="degreeSel"
                            class="w-full rounded-md border px-3 py-2 text-sm bg-white/90 dark:bg-white/10" disabled>
                            <option value="">-- Select Degree --</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-medium">Department</label>
                        <select name="department_id" id="deptSel"
                            class="w-full rounded-md border px-3 py-2 text-sm bg-white/90 dark:bg-white/10" disabled>
                            <option value="">-- Select Department --</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-medium">Batch</label>
                        <select name="batch_id" id="batchSel"
                            class="w-full rounded-md border px-3 py-2 text-sm bg-white/90 dark:bg-white/10" disabled>
                            <option value="">-- Select Batch --</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-medium">Semester</label>
                        <select name="semester" id="semSel"
                            class="w-full rounded-md border px-3 py-2 text-sm bg-white/90 dark:bg-white/10" disabled>
                            <option value="">-- Semester --</option>
                        </select>
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-medium">Description</label>
                    <textarea name="description" rows="4"
                        class="w-full rounded-md border px-3 py-2 text-sm bg-white/90 dark:bg-white/10"></textarea>
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-medium">Upload File (PDF / MD / Image)</label>
                    <input name="file" type="file" required class="block w-full text-sm" />
                </div>
                <div class="flex items-center gap-4">
                    <button class="bg-brand-500 hover:bg-brand-600 text-white font-medium px-5 py-2 rounded-md text-sm"
                        type="submit">Upload</button>
                    <p id="status" class="text-sm text-gray-600"></p>
                </div>
            </form>
    </main>
    <div id="toastHost" class="fixed inset-0 pointer-events-none flex flex-col items-end gap-2 p-4 z-50"></div>
    <script>
        function resolveApiBase(retries = 10) {
            const b = (window.__API_BASE || window.API_BASE || '').replace(/\/$/, '');
            if (b) return b; if (retries <= 0) return ''; return new Promise(r => setTimeout(() => r(resolveApiBase(retries - 1)), 100));
        }
        let apiBase;
        function getToken() {
            const keys = ['px_token', 'sb-access-token', 'supabase.auth.token'];
            for (const k of keys) { try { const v = localStorage.getItem(k); if (v) return v; } catch (_) { } }
            return '';
        }
        function showToast(msg, type = 'info', opts = {}) {
            const host = document.getElementById('toastHost');
            if (!host) return;
            const el = document.createElement('div');
            el.className = `pointer-events-auto select-none text-sm rounded-lg shadow-lg px-4 py-3 flex items-center gap-2 border backdrop-blur-sm ${type === 'success' ? 'bg-emerald-500/90 text-white border-emerald-400/50' : 'type' === 'error' ? 'bg-rose-600/90 text-white border-rose-400/50' : 'bg-black/80 text-white border-white/10'}`;
            el.innerHTML = `<span class="material-symbols-rounded text-base">${type === 'success' ? 'check_circle' : (type === 'error' ? 'error' : 'info')}</span><span>${msg}</span>`;
            host.appendChild(el);
            const ttl = opts.ttl || 3000;
            setTimeout(() => { el.classList.add('opacity-0', 'translate-y-1'); setTimeout(() => el.remove(), 320); }, ttl);
            return el;
        }
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!apiBase) apiBase = await resolveApiBase();
            const form = e.target; const fd = new FormData(form);
            const priceRupees = parseInt(fd.get('price_cents') || '0', 10); fd.set('price_cents', String(priceRupees * 100));
            const st = document.getElementById('status'); st.textContent = 'Uploading...';
            try {
                let resp; const token = getToken();
                const url = `${apiBase}/api/marketplace/notes?token=${encodeURIComponent(token)}`;
                const headers = token ? { 'Authorization': 'Bearer ' + token } : {};
                try { resp = await fetch(url, { method: 'POST', headers, body: fd }); }
                catch (netErr) { throw new Error('Network error'); }
                let data = {}; try { data = await resp.json(); } catch (_) { }
                if (!resp.ok) throw new Error(data.detail || 'Upload failed');
                st.textContent = '';
                showToast('Note uploaded successfully!', 'success', { ttl: 1800 });
                setTimeout(() => { window.location.href = './notes_marketplace.html'; }, 1600);
            } catch (err) { st.textContent = 'Error: ' + (err && err.message || err); }
        });
        document.addEventListener('click', e => { const t = e.target.closest('[data-theme-toggle]'); if (!t) return; const root = document.documentElement; const next = root.classList.contains('dark') ? 'light' : 'dark'; root.classList.toggle('dark', next === 'dark'); localStorage.setItem('px_theme', next); document.querySelectorAll('[data-theme-toggle] .material-symbols-rounded').forEach(ic => ic.textContent = next === 'dark' ? 'light_mode' : 'dark_mode'); });

        // --- Academic cascade logic ---
        const collegeSel = document.getElementById('collegeSel');
        const degreeSel = document.getElementById('degreeSel');
        const deptSel = document.getElementById('deptSel');
        const batchSel = document.getElementById('batchSel');
        const semSel = document.getElementById('semSel');
        function clearSelect(sel, placeholder, disable = true) { sel.innerHTML = `<option value=''>${placeholder}</option>`; sel.disabled = disable; }
        async function fetchJSON(url) { try { const r = await fetch(url); if (!r.ok) return null; return await r.json(); } catch { return null; } }
        async function loadColleges() {
            if (!apiBase) apiBase = await resolveApiBase();
            clearSelect(collegeSel, '-- Select College --', false);
            const data = await fetchJSON(`${apiBase}/api/colleges`);
            if (Array.isArray(data)) {
                data.forEach(c => { const opt = document.createElement('option'); opt.value = c.id; opt.textContent = c.name; collegeSel.appendChild(opt); });
            }
        }
        async function loadDegrees(collegeId) {
            clearSelect(degreeSel, '-- Select Degree --'); clearSelect(deptSel, '-- Select Department --'); clearSelect(batchSel, '-- Select Batch --'); semSel.disabled = true;
            if (!collegeId) return;
            degreeSel.disabled = false;
            const data = await fetchJSON(`${apiBase}/api/colleges/${collegeId}/degrees`);
            if (Array.isArray(data)) data.forEach(d => { const opt = document.createElement('option'); opt.value = d.id || d; opt.textContent = d.name || d; degreeSel.appendChild(opt); });
        }
        async function loadDepartments(collegeId) {
            clearSelect(deptSel, '-- Select Department --'); clearSelect(batchSel, '-- Select Batch --'); semSel.disabled = true;
            if (!collegeId) return; deptSel.disabled = false;
            const data = await fetchJSON(`${apiBase}/api/colleges/${collegeId}/departments/full`);
            if (Array.isArray(data)) data.forEach(d => { const opt = document.createElement('option'); opt.value = d.id || d.name || d; opt.textContent = d.name || d; deptSel.appendChild(opt); });
        }
        async function loadBatches(collegeId, deptName) {
            clearSelect(batchSel, '-- Select Batch --'); semSel.disabled = true;
            if (!collegeId || !deptName) return; batchSel.disabled = false;
            const data = await fetchJSON(`${apiBase}/api/colleges/${collegeId}/departments/${encodeURIComponent(deptName)}/batches/full`);
            if (Array.isArray(data)) data.forEach(b => {
                const opt = document.createElement('option');
                const fromY = b.from_year ?? b.from ?? b.fromYear;
                const toY = b.to_year ?? b.to ?? b.toYear;
                let label = '';
                if (Number.isInteger(fromY) && Number.isInteger(toY)) {
                    label = `${fromY}-${toY}`;
                } else if (Number.isInteger(fromY)) {
                    label = String(fromY);
                } else if (typeof b.range === 'string') {
                    label = b.range;
                } else if (typeof b.name === 'string') {
                    label = b.name;
                } else {
                    label = 'Batch';
                }
                opt.value = b.id || b.batch_id || `${fromY || ''}-${toY || ''}`;
                opt.textContent = label;
                batchSel.appendChild(opt);
            });
        }
        function enableSemester() { semSel.disabled = false; }
        function populateSemesters() {
            semSel.innerHTML = '<option value="">-- Semester --</option>';
            for (let i = 1; i <= 8; i++) { const opt = document.createElement('option'); opt.value = String(i); opt.textContent = String(i); semSel.appendChild(opt); }
        }
        populateSemesters();
        collegeSel.addEventListener('change', e => { const v = e.target.value; loadDegrees(v); loadDepartments(v); });
        degreeSel.addEventListener('change', () => { }); // reserved; some flows might depend on degree first
        deptSel.addEventListener('change', e => { const collegeId = collegeSel.value; const dept = deptSel.options[deptSel.selectedIndex]?.textContent; loadBatches(collegeId, dept); });
        batchSel.addEventListener('change', () => enableSemester());
        loadColleges();
    </script>
</body>

</html>
