<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paper X — Select Audience</title>
    <link rel="icon" type="image/x-icon" href="assets/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,0,0"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/tailwind.css" />
    <script>(function () { const s = localStorage.getItem('px_theme'); const p = matchMedia('(prefers-color-scheme: dark)').matches; const m = s ? s : (p ? 'dark' : 'light'); if (m === 'dark') document.documentElement.classList.add('dark'); })();</script>
    <script src="./config.js"></script>
    <script src="./auth.js" defer></script>

    <style>
        .material-symbols-rounded { vertical-align: -5px; }

        body {
            background:
                radial-gradient(1000px 560px at 50% -12%, rgba(158, 75, 138, .18), transparent 62%),
                radial-gradient(900px 520px at 10% 20%, rgba(76, 42, 89, .12), transparent 62%),
                linear-gradient(180deg, #ffffff, #fbf8fc 45%, #f7f2f9 100%);
        }

        .dark body {
            background:
                radial-gradient(900px 520px at 50% -15%, rgba(158, 75, 138, .28), transparent 65%),
                radial-gradient(900px 520px at 0% 0%, rgba(76, 42, 89, .22), transparent 62%),
                linear-gradient(180deg, #1e1e2f 0%, #201934 55%, #141321 100%);
        }

        .glass {
            background: linear-gradient(180deg, rgba(255, 255, 255, .84), rgba(255, 255, 255, .68));
            backdrop-filter: blur(26px);
        }

        .dark .glass {
            background: linear-gradient(180deg, rgba(30, 30, 47, .78), rgba(30, 30, 47, .58));
        }

        .shadowCard { box-shadow: 0 22px 70px -40px rgba(30, 30, 47, 0.60); }

        .skeleton {
            background: linear-gradient(90deg, rgba(0, 0, 0, .06)25%, rgba(0, 0, 0, .12)37%, rgba(0, 0, 0, .06)63%);
            background-size: 900px 100%;
        }

        .dark .skeleton {
            background: linear-gradient(90deg, rgba(255, 255, 255, .06)25%, rgba(255, 255, 255, .12)37%, rgba(255, 255, 255, .06)63%);
            background-size: 900px 100%;
        }
    </style>
</head>

<body class="min-h-screen font-sans antialiased text-neutral-900 dark:text-white">
    <header
        class="sticky top-0 z-30 bg-white/80 dark:bg-brand-900/70 backdrop-blur border-b border-black/5 dark:border-white/10">
        <div class="container mx-auto flex items-center justify-between py-3 px-4">
            <a href="./index.html" class="flex items-center gap-3" aria-label="Paper X Home">
                <img src="assets/img/logo-light.svg" class="h-9 w-auto dark:hidden" alt="Paper X">
                <img src="assets/img/logo-dark.svg" class="h-9 w-auto hidden dark:block" alt="Paper X">
            </a>
            <div class="flex items-center gap-3">
                <a href="./teacher_profile.html"
                    class="text-sm px-3 py-1.5 rounded-full ring-1 ring-black/10 dark:ring-white/15 hover:bg-black/5 dark:hover:bg-white/10">Back
                    to profile</a>
                <button id="themeToggle"
                    class="inline-flex items-center justify-center size-10 rounded-full ring-1 ring-black/10 dark:ring-white/15 hover:bg-black/5 dark:hover:bg-white/5"
                    aria-label="Toggle theme"><span class="material-symbols-rounded">dark_mode</span></button>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-10">
        <div class="max-w-3xl mx-auto space-y-6">
            <section class="glass rounded-3xl p-6 md:p-8 ring-1 ring-black/5 dark:ring-white/10 shadowCard">
                <div class="flex items-start gap-3">
                    <div
                        class="size-12 rounded-2xl bg-gradient-to-br from-brand-500/25 to-brand-700/20 grid place-items-center text-brand-700 dark:text-fuchsia-100">
                        <span class="material-symbols-rounded text-2xl">hub</span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <h1 class="text-2xl md:text-3xl font-bold tracking-tight">Select audience</h1>
                        <p class="text-sm text-neutral-600 dark:text-white/70">Choose a class, or set this test <span
                                class="font-semibold">Open to all</span>. You’ll create questions on the next page.</p>
                    </div>
                </div>
                <div id="alert"
                    class="hidden mt-4 text-sm text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-900/30 px-4 py-3 rounded-xl ring-1 ring-red-100 dark:ring-red-800">
                </div>
            </section>

            <section class="glass rounded-3xl p-5 md:p-6 ring-1 ring-black/5 dark:ring-white/10 shadowCard">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="font-semibold">Pick a class</h2>
                    <button id="refreshClasses" type="button"
                        class="text-xs px-2 py-1 rounded-md ring-1 ring-black/5 dark:ring-white/15 hover:bg-black/5 dark:hover:bg-white/10">Refresh</button>
                </div>

                <div id="classesList" class="space-y-3 text-sm"></div>

                <div class="mt-5 flex items-center justify-between gap-3">
                    <div class="text-xs text-neutral-500 dark:text-white/60" id="selectedLabel">Selected: Open to all</div>
                    <button id="continueBtn" type="button"
                        class="px-4 py-2 rounded-xl bg-brand-600 text-white text-sm hover:bg-brand-700">Continue</button>
                </div>
            </section>
        </div>
    </main>

    <script>
        const $ = (s, r = document) => r.querySelector(s);
        const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

        $('#themeToggle')?.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('px_theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        });

        function showAlert(msg) {
            const alertBox = $('#alert');
            if (!alertBox) return;
            alertBox.textContent = msg;
            alertBox.classList.remove('hidden');
            setTimeout(() => alertBox.classList.add('hidden'), 3500);
        }

        function getToken() {
            const keys = ['px_token', 'teacherToken', 'userToken', 'sb-access-token', 'supabase.auth.token'];
            for (const k of keys) {
                try { const v = localStorage.getItem(k); if (v) return v; } catch { }
            }
            return '';
        }

        let API_BASE = '';
        async function resolveApi() {
            if (API_BASE) return API_BASE;
            const b = (window.__API_BASE || window.API_BASE || '').replace(/\/$/, '');
            if (b) { API_BASE = b; return b; }
            await new Promise(r => setTimeout(r, 60));
            return resolveApi();
        }

        const classesList = $('#classesList');
        const selectedLabel = $('#selectedLabel');

        let classes = [];
        let selectedMode = 'open'; // 'open' | 'class'
        let selectedClassId = null;

        function classMeta(c) {
            const parts = [];
            if (c.section) parts.push(`Sec ${c.section}`);
            if (c.batch_range) parts.push(c.batch_range);
            if (c.semester) parts.push(`Sem ${c.semester}`);
            return parts.join(' • ');
        }

        function setSelection(mode, classId) {
            selectedMode = mode;
            selectedClassId = classId || null;

            if (selectedMode === 'open') {
                selectedLabel.textContent = 'Selected: Open to all (any signed-in user)';
            } else {
                const c = classes.find(x => String(x.id) === String(selectedClassId));
                selectedLabel.textContent = `Selected: ${c?.subject || 'Class'}`;
            }

            renderClasses();
        }

        function renderClasses() {
            if (!classesList) return;

            const openCard = `
                <button id="openToAllBtn" type="button"
                    class="w-full text-left p-4 rounded-2xl ring-1 ${selectedMode === 'open' ? 'ring-brand-500/60 bg-brand-500/10' : 'ring-black/5 dark:ring-white/10 bg-white/70 dark:bg-white/5'} hover:ring-brand-500/50 transition">
                    <div class="flex items-start gap-3">
                        <div class="size-10 rounded-2xl bg-gradient-to-br from-brand-500/25 to-brand-700/20 grid place-items-center text-brand-700 dark:text-fuchsia-100">
                            <span class="material-symbols-rounded">public</span>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="font-semibold text-sm">Open to all</div>
                            <div class="text-xs text-neutral-500 dark:text-white/60">Any signed-in user can take this test.</div>
                        </div>
                        <div class="pt-1"><span class="material-symbols-rounded text-base">arrow_forward</span></div>
                    </div>
                </button>`;

            const clsCards = classes.map(c => {
                const meta = classMeta(c);
                const active = (selectedMode === 'class' && String(selectedClassId) === String(c.id));
                return `
                    <button data-class-id="${String(c.id)}" type="button"
                        class="w-full text-left p-4 rounded-2xl ring-1 ${active ? 'ring-brand-500/60 bg-brand-500/10' : 'ring-black/5 dark:ring-white/10 bg-white/70 dark:bg-white/5'} hover:ring-brand-500/50 transition">
                        <div class="flex items-start gap-3">
                            <div class="size-10 rounded-2xl bg-gradient-to-br from-brand-500/25 to-brand-700/20 grid place-items-center text-brand-700 dark:text-fuchsia-100">
                                <span class="material-symbols-rounded">school</span>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="font-semibold text-sm line-clamp-1">${c.subject || 'Class'}</div>
                                <div class="text-xs text-neutral-500 dark:text-white/60 line-clamp-2">${meta || '—'}</div>
                            </div>
                            <div class="pt-1"><span class="material-symbols-rounded text-base">arrow_forward</span></div>
                        </div>
                    </button>`;
            }).join('');

            if (!classes.length) {
                classesList.innerHTML = openCard + '<div class="mt-3 text-sm text-neutral-500 dark:text-white/60">No classes found for this teacher account.</div>';
            } else {
                classesList.innerHTML = `<div class="space-y-3">${openCard}${clsCards}</div>`;
            }

            $('#openToAllBtn')?.addEventListener('click', () => setSelection('open', null));
            $$('button[data-class-id]', classesList).forEach(btn => {
                btn.addEventListener('click', () => setSelection('class', btn.getAttribute('data-class-id')));
            });
        }

        async function loadClasses() {
            if (!classesList) return;
            classesList.innerHTML = '<div class="grid grid-cols-1 gap-3"><div class="h-20 rounded-2xl skeleton"></div><div class="h-20 rounded-2xl skeleton"></div><div class="h-20 rounded-2xl skeleton"></div></div>';

            const token = getToken();
            if (!token) {
                showAlert('Please sign in as teacher.');
                classes = [];
                renderClasses();
                return;
            }

            try {
                const base = await resolveApi();
                const res = await fetch(`${base}/api/teacher/profile/me?strict=1`, { headers: { Authorization: 'Bearer ' + token } });
                if (res.status === 401) { showAlert('Session expired. Please sign in.'); return; }
                if (!res.ok) throw new Error('Failed');
                const data = await res.json();
                classes = Array.isArray(data.classes) ? data.classes : [];
                renderClasses();
            } catch (e) {
                console.error(e);
                showAlert('Could not load classes.');
                classes = [];
                renderClasses();
            }
        }

        $('#refreshClasses')?.addEventListener('click', loadClasses);
        $('#continueBtn')?.addEventListener('click', () => {
            const scope = {
                mode: selectedMode,
                class: selectedMode === 'class' ? (classes.find(x => String(x.id) === String(selectedClassId)) || null) : null,
            };
            try { sessionStorage.setItem('px:testCreatorScope', JSON.stringify(scope)); } catch { }
            location.href = './teacher_test_creator.html';
        });

        document.addEventListener('DOMContentLoaded', () => {
            setSelection('open', null);
            loadClasses();
        });
    </script>
</body>

</html>
