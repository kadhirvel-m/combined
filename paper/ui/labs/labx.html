<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabX — Explorable Explanation Generator | Paper X</title>
    <link rel="icon" type="image/x-icon" href="../assets/img/favicon.svg">

    <!-- Inter + Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,0,0"
        rel="stylesheet">

    <!-- Tailwind CSS bundle -->
    <link rel="stylesheet" href="../assets/css/tailwind.css" />

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                container: { center: true, padding: '1rem' },
                extend: {
                    fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
                    colors: {
                        brand: { 900: '#1E1E2F', 700: '#4C2A59', 500: '#9E4B8A' },
                        brandlt: {
                            50: '#FAF5FB',
                            100: '#F3E7F2',
                            200: '#E7D0E4',
                            300: '#D9B4D3',
                            400: '#C88DBA',
                            500: '#9E4B8A',
                            700: '#4C2A59',
                            900: '#1E1E2F'
                        }
                    },
                    boxShadow: {
                        glow: '0 8px 30px rgba(158,75,138,0.35)',
                        soft: '0 10px 30px rgba(0,0,0,0.25)',
                        card: '0 24px 60px rgba(30,30,47,0.35)'
                    },
                    backgroundImage: {
                        'hero-dark': 'radial-gradient(900px 520px at 50% -15%, rgba(158,75,138,0.35), transparent 65%), linear-gradient(180deg,#1E1E2F 0%,#201934 55%,#141321 100%)',
                        'hero-light': 'radial-gradient(1000px 560px at 50% -18%, rgba(158,75,138,0.18), transparent 62%), linear-gradient(180deg,#FFFFFF 0%,#FBF8FC 55%,#F7F2F9 100%)'
                    }
                }
            }
        }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --bg-app: #F7F2F9;
            --bg-card: #FFFFFF;
            --text-head: #1E1E2F;
            --text-body: #2F2F3A;
            --text-sub: #5A5A6B;
            --border: #E5DFEC;
            --primary: #9E4B8A;
        }

        .dark {
            --bg-app: #1E1E2F;
            --bg-card: #201934;
            --text-head: #F3E7F2;
            --text-body: #E8E3EE;
            --text-sub: #C9BED5;
            --border: #3A3247;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        .lab-shell {
            min-height: 100vh;
            background-image: linear-gradient(180deg, #FFFFFF 0%, #FBF8FC 45%, #F7F2F9 100%);
        }

        .dark .lab-shell {
            background-image: linear-gradient(180deg, #1E1E2F 0%, #201934 55%, #141321 100%);
        }

        /* Glassmorphism card */
        .glass-card {
            border-radius: 1rem;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.9), rgba(243, 231, 242, 0.95));
            box-shadow: 0 18px 40px -18px rgba(30, 30, 47, 0.35);
            border: 1px solid rgba(158, 75, 138, 0.16);
            backdrop-filter: blur(12px);
        }

        .dark .glass-card {
            background: linear-gradient(145deg, rgba(30, 30, 47, 0.96), rgba(30, 30, 47, 0.86));
            border-color: rgba(200, 141, 186, 0.35);
            box-shadow: 0 22px 60px -20px rgba(0, 0, 0, 0.8);
        }

        /* Input styling */
        .topic-input {
            width: 100%;
            padding: 1rem 1.25rem;
            border-radius: 0.75rem;
            border: 2px solid var(--border);
            background: var(--bg-card);
            color: var(--text-head);
            font-size: 1.1rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        .topic-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(158, 75, 138, 0.2);
        }

        .topic-input::placeholder {
            color: var(--text-sub);
        }

        /* Generate button */
        .generate-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            border-radius: 9999px;
            background: linear-gradient(135deg, #9E4B8A, #B06AB3);
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 8px 26px rgba(158, 75, 138, 0.5);
        }

        .generate-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(158, 75, 138, 0.6);
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Preview iframe container */
        .preview-container {
            position: relative;
            width: 100%;
            border-radius: 0.75rem;
            overflow: hidden;
            border: 1px solid var(--border);
            background: #fff;
        }

        .preview-container iframe {
            width: 100%;
            height: 600px;
            border: none;
        }

        /* Action buttons */
        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            border-radius: 9999px;
            font-weight: 500;
            font-size: 0.9rem;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-head);
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Status area */
        .status-text {
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        /* Examples chips */
        .example-chip {
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            background: rgba(158, 75, 138, 0.1);
            color: var(--primary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .example-chip:hover {
            background: rgba(158, 75, 138, 0.2);
            border-color: var(--primary);
        }

        /* Raw HTML display */
        .html-preview {
            background: #1E1E2F;
            color: #E8E3EE;
            padding: 1rem;
            border-radius: 0.5rem;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.8rem;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>

    <!-- Persist theme before paint -->
    <script>
            (function () {
                try {
                    const s = localStorage.getItem('px_theme');
                    const prefers = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    const useDark = s ? s === 'dark' : prefers;
                    if (useDark) document.documentElement.classList.add('dark');
                } catch (_) { }
            })();
    </script>
    <script src="../config.js"></script>
</head>

<body class="min-h-screen font-sans antialiased text-neutral-900 dark:text-white bg-hero-light dark:bg-hero-dark">

    <!-- ============== NAVBAR (Paper X) ============== -->
    <header
        class="sticky top-0 z-50 bg-white/80 dark:bg-brand-900/70 backdrop-blur supports-[backdrop-filter]:saturate-150 border-b border-black/5 dark:border-white/10">
        <div class="container flex items-center justify-between py-3.5">
            <a href="../index.html" class="flex items-center gap-3 shrink-0" aria-label="Paper X Home">
                <img src="../assets/img/logo-light.svg" class="h-9 w-auto dark:hidden" alt="Paper X" />
                <img src="../assets/img/logo-dark.svg" class="h-9 w-auto hidden dark:block" alt="Paper X" />
            </a>
            <nav class="hidden md:flex items-center gap-6 text-sm text-neutral-700 dark:text-white/85">
                <a href="../index.html" class="hover:text-brandlt-900 dark:hover:text-white">Home</a>
                <a href="../about.html" class="hover:text-brandlt-900 dark:hover:text-white">About</a>
                <a href="../academicas.html" class="hover:text-brandlt-900 dark:hover:text-white">Academics</a>
                <a href="../contact.html" class="hover:text-brandlt-900 dark:hover:text-white">Support</a>
            </nav>
            <div class="hidden md:flex items-center gap-2">
                <button id="themeToggle"
                    class="inline-flex items-center gap-2 rounded-full px-3 py-2 text-sm ring-1 ring-black/10 dark:ring-white/15 hover:bg-black/5 dark:hover:bg-white/5"
                    aria-label="Toggle theme">
                    <span class="material-symbols-rounded">dark_mode</span>
                    <span class="hidden lg:block">Theme</span>
                </button>
                <a href="../login.html"
                    class="px-3 py-2 text-sm text-neutral-700 dark:text-white/80 hover:text-brandlt-900 dark:hover:text-white rounded-full">Log
                    in</a>
                <a href="../signup.html"
                    class="inline-flex items-center justify-center rounded-full bg-brand-500 text-white text-sm font-semibold px-4 py-2.5 hover:shadow-glow transition">Sign
                    up</a>
            </div>
            <div class="md:hidden flex items-center gap-2">
                <button type="button" id="themeToggleMobile" aria-label="Toggle theme"
                    class="inline-flex items-center justify-center size-10 rounded-full ring-1 ring-black/10 dark:ring-white/15 hover:bg-black/5 dark:hover:bg-white/5 transition">
                    <span class="material-symbols-rounded">dark_mode</span>
                </button>
            </div>
        </div>
    </header>

    <main class="lab-shell pb-16">

        <!-- Hero Section -->
        <section class="pt-12 pb-8">
            <div class="container max-w-4xl mx-auto px-4 text-center">
                <div
                    class="inline-flex items-center gap-2 rounded-full bg-brandlt-100 dark:bg-brand-500/20 px-4 py-1.5 text-sm font-medium text-brand-700 dark:text-brandlt-300 mb-6">
                    <span class="material-symbols-rounded text-lg">science</span>
                    Explorable Explanations
                </div>
                <h1 class="text-4xl md:text-5xl font-bold tracking-tight text-brand-900 dark:text-white mb-4">
                    LabX Generator
                </h1>
                <p class="text-lg text-neutral-600 dark:text-white/70 max-w-2xl mx-auto mb-8">
                    Transform any topic into an interactive, self-contained HTML deep-dive. Powered by AI, styled with
                    PaperX aesthetics.
                </p>
            </div>
        </section>

        <!-- Input Section -->
        <section class="pb-8">
            <div class="container max-w-3xl mx-auto px-4">
                <div class="glass-card p-8">
                    <label for="topicInput"
                        class="block text-sm font-semibold text-brand-700 dark:text-brandlt-300 mb-3">
                        Enter a Topic
                    </label>
                    <input type="text" id="topicInput" class="topic-input mb-6"
                        placeholder="e.g., Binary Search, Photosynthesis, Blockchain, CPU Registers..." maxlength="500"
                        aria-label="Topic to generate explorable explanation for" />

                    <div class="flex flex-wrap gap-2 mb-6">
                        <span class="text-sm text-neutral-500 dark:text-white/50 mr-2">Try:</span>
                        <button class="example-chip" onclick="setTopic('Binary Search')">Binary Search</button>
                        <button class="example-chip" onclick="setTopic('Osmosis')">Osmosis</button>
                        <button class="example-chip" onclick="setTopic('PageRank Algorithm')">PageRank</button>
                        <button class="example-chip" onclick="setTopic('Neural Networks')">Neural Networks</button>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-4 items-center">
                        <button id="generateBtn" class="generate-btn w-full sm:w-auto" onclick="generateExplanation()">
                            <span class="material-symbols-rounded">auto_awesome</span>
                            <span id="btnText">Generate Explanation</span>
                            <div id="btnSpinner" class="spinner hidden"></div>
                        </button>
                        <p id="statusText" class="status-text"></p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Results Section -->
        <section id="resultsSection" class="hidden pb-8">
            <div class="container max-w-5xl mx-auto px-4">
                <div class="glass-card p-6">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                        <h2 class="text-xl font-bold text-brand-900 dark:text-white">
                            <span class="material-symbols-rounded text-brand-500 mr-2 align-middle">check_circle</span>
                            Generated: <span id="generatedTopic" class="text-brand-500"></span>
                        </h2>
                        <div class="flex flex-wrap gap-2">
                            <button class="action-btn" onclick="downloadHTML()">
                                <span class="material-symbols-rounded text-lg">download</span>
                                Download HTML
                            </button>
                            <button class="action-btn" onclick="openInNewTab()">
                                <span class="material-symbols-rounded text-lg">open_in_new</span>
                                Open in Tab
                            </button>
                            <button class="action-btn" onclick="copyHTML()">
                                <span class="material-symbols-rounded text-lg">content_copy</span>
                                Copy
                            </button>
                            <button class="action-btn" onclick="toggleRawView()">
                                <span class="material-symbols-rounded text-lg">code</span>
                                <span id="rawToggleText">View Code</span>
                            </button>
                        </div>
                    </div>

                    <!-- Preview iframe -->
                    <div id="previewContainer" class="preview-container">
                        <iframe id="previewFrame" sandbox="allow-scripts allow-same-origin"
                            title="Generated Explorable Explanation"></iframe>
                    </div>

                    <!-- Raw HTML view (hidden by default) -->
                    <div id="rawContainer" class="hidden mt-4">
                        <div class="html-preview" id="rawHTML"></div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script>
        // =====================================
        // State
        // =====================================
        let generatedHTML = '';
        let currentTopic = '';
        let isGenerating = false;
        let showingRaw = false;

        // =====================================
        // DOM Elements
        // =====================================
        const topicInput = document.getElementById('topicInput');
        const generateBtn = document.getElementById('generateBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const statusText = document.getElementById('statusText');
        const resultsSection = document.getElementById('resultsSection');
        const generatedTopicEl = document.getElementById('generatedTopic');
        const previewFrame = document.getElementById('previewFrame');
        const previewContainer = document.getElementById('previewContainer');
        const rawContainer = document.getElementById('rawContainer');
        const rawHTML = document.getElementById('rawHTML');
        const rawToggleText = document.getElementById('rawToggleText');

        // =====================================
        // API Configuration
        // =====================================
        const API_BASE = typeof APP_CONFIG !== 'undefined'
            ? APP_CONFIG.API_BASE_URL
            : 'http://127.0.0.1:8000';

        // =====================================
        // Functions
        // =====================================

        function setTopic(topic) {
            topicInput.value = topic;
            topicInput.focus();
        }

        function setLoading(loading) {
            isGenerating = loading;
            generateBtn.disabled = loading;

            if (loading) {
                btnText.textContent = 'Generating...';
                btnSpinner.classList.remove('hidden');
                statusText.textContent = 'This may take 30-60 seconds...';
            } else {
                btnText.textContent = 'Generate Explanation';
                btnSpinner.classList.add('hidden');
            }
        }

        function setStatus(message, isError = false) {
            statusText.textContent = message;
            statusText.style.color = isError ? '#dc2626' : 'var(--text-sub)';
        }

        async function generateExplanation() {
            const topic = topicInput.value.trim();

            if (!topic) {
                setStatus('Please enter a topic', true);
                topicInput.focus();
                return;
            }

            if (isGenerating) return;

            setLoading(true);
            resultsSection.classList.add('hidden');
            setStatus('Connecting to Gemini AI...');

            try {
                const response = await fetch(`${API_BASE}/api/labx/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ topic })
                });

                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    throw new Error(error.detail || `HTTP ${response.status}`);
                }

                const data = await response.json();

                if (data.success && data.html) {
                    generatedHTML = data.html;
                    currentTopic = data.topic;
                    displayResult();
                    setStatus('Generation complete!');
                } else {
                    throw new Error('Invalid response from server');
                }

            } catch (error) {
                console.error('Generation error:', error);
                setStatus(`Error: ${error.message}`, true);
            } finally {
                setLoading(false);
            }
        }

        function displayResult() {
            generatedTopicEl.textContent = currentTopic;

            // Write HTML to iframe
            const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            doc.open();
            doc.write(generatedHTML);
            doc.close();

            // Update raw view
            rawHTML.textContent = generatedHTML;

            // Show results with animation
            resultsSection.classList.remove('hidden');
            gsap.from(resultsSection, {
                opacity: 0,
                y: 30,
                duration: 0.5,
                ease: 'power2.out'
            });

            // Scroll to results
            resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function downloadHTML() {
            if (!generatedHTML) return;

            const blob = new Blob([generatedHTML], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${currentTopic.toLowerCase().replace(/\s+/g, '-')}-explorable.html`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            setStatus('Downloaded!');
        }

        function openInNewTab() {
            if (!generatedHTML) return;

            const blob = new Blob([generatedHTML], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
        }

        async function copyHTML() {
            if (!generatedHTML) return;

            try {
                await navigator.clipboard.writeText(generatedHTML);
                setStatus('Copied to clipboard!');
            } catch (err) {
                setStatus('Failed to copy', true);
            }
        }

        function toggleRawView() {
            showingRaw = !showingRaw;

            if (showingRaw) {
                previewContainer.classList.add('hidden');
                rawContainer.classList.remove('hidden');
                rawToggleText.textContent = 'View Preview';
            } else {
                previewContainer.classList.remove('hidden');
                rawContainer.classList.add('hidden');
                rawToggleText.textContent = 'View Code';
            }
        }

        // =====================================
        // Theme Toggle
        // =====================================
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.toggle('dark');
            localStorage.setItem('px_theme', isDark ? 'dark' : 'light');
        }

        document.getElementById('themeToggle')?.addEventListener('click', toggleTheme);
        document.getElementById('themeToggleMobile')?.addEventListener('click', toggleTheme);

        // =====================================
        // Keyboard shortcuts
        // =====================================
        topicInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !isGenerating) {
                generateExplanation();
            }
        });

        // =====================================
        // Init
        // =====================================
        console.log('LabX Generator initialized');
        console.log('API Base:', API_BASE);
    </script>
</body>

</html>
