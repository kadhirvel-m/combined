<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>College Navigator · Syllabus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { display: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#f0f7ff', 100: '#e0efff', 200: '#b9dbff', 300: '#8ac4ff', 400: '#59a9ff', 500: '#2b8cff', 600: '#116fe6', 700: '#0a57b4', 800: '#0b4890', 900: '#0d3a73' },
                        night: { 900: '#0a0c10', 800: '#0f131a', 700: '#141a22', 600: '#1a2230' }
                    },
                    boxShadow: {
                        glow: '0 0 0 1px rgba(59,130,246,.2), 0 8px 40px rgba(59,130,246,.15)',
                        neon: '0 0 25px rgba(43,140,255,.35), 0 0 60px rgba(43,140,255,.25)'
                    },
                    backgroundImage: {
                        'grid-radial': 'radial-gradient(circle at 20% 10%, rgba(43,140,255,.25), transparent 35%), radial-gradient(circle at 80% 20%, rgba(168,85,247,.2), transparent 35%), radial-gradient(circle at 50% 80%, rgba(16,185,129,.2), transparent 35%)'
                    }
                }
            }
        };
    </script>
    <script src="../config.js"></script>
    <script src="helpers.js"></script>
    <style>
        .glass {
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .glass-dark {
            background: rgba(20, 24, 32, 0.55);
            border-color: rgba(255, 255, 255, 0.08);
        }
    </style>
</head>

<body
    class="font-display bg-white text-slate-900 dark:bg-night-900 dark:text-slate-200 selection:bg-brand-200 selection:text-slate-900">
    <div aria-hidden="true" class="fixed inset-0 -z-10 bg-grid-radial opacity-70 dark:opacity-50"></div>

    <header
        class="sticky top-0 z-40 backdrop-blur supports-[backdrop-filter]:bg-white/70 dark:supports-[backdrop-filter]:bg-night-900/60 border-b border-black/5 dark:border-white/5">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
            <div class="flex h-16 items-center justify-between">
                <a href="../index.html" class="flex items-center gap-3 group">
                    <div
                        class="h-9 w-9 rounded-xl bg-gradient-to-br from-brand-400 via-brand-500 to-indigo-500 shadow-neon grid place-items-center text-white font-bold tracking-tight">
                        PX</div>
                    <div>
                        <p class="text-lg font-semibold leading-tight group-hover:text-brand-600">Pa[p]er X</p>
                        <p class="text-xs text-slate-500 dark:text-slate-400 -mt-1">Agentic AI for Indian syllabi</p>
                    </div>
                </a>
                <a id="backLink" href="subjects.html"
                    class="inline-flex items-center gap-2 rounded-xl border border-slate-200/60 dark:border-white/10 px-3 py-1.5 text-sm hover:border-brand-400/60 transition"
                    title="Back to subjects">
                    <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd"
                            d="M12.707 15.707a1 1 0 01-1.414 0L5.586 10l5.707-5.707a1 1 0 011.414 1.414L8.414 10l4.293 4.293a1 1 0 010 1.414z"
                            clip-rule="evenodd"></path>
                    </svg>
                    Back
                </a>
            </div>
        </div>
    </header>

    <main class="relative">
        <section class="mx-auto max-w-5xl px-4 sm:px-6 lg:px-8 pt-10 pb-20">
            <div class="flex flex-col gap-6">
                <div class="flex flex-col gap-2">
                    <nav id="breadcrumbs"
                        class="flex flex-wrap items-center gap-2 text-sm text-slate-500 dark:text-slate-400"
                        aria-label="breadcrumb"></nav>
                    <div>
                        <h1 id="pageTitle" class="text-3xl sm:text-4xl font-bold leading-tight">Subject syllabus</h1>
                        <p id="pageSubtitle" class="mt-2 text-slate-600 dark:text-slate-300">Loading syllabus…</p>
                    </div>
                </div>
            </div>

            <div id="contextPanel"
                class="mt-8 rounded-2xl border border-slate-200/60 dark:border-white/10 bg-white/80 dark:bg-night-800/70 shadow p-6">
            </div>

            <div class="mt-6 flex justify-end">
                <button id="addUnitBtn" type="button"
                    class="inline-flex items-center gap-2 rounded-xl border border-slate-200/60 dark:border-white/10 bg-white/70 dark:bg-night-800/70 px-4 py-2 text-sm font-medium text-slate-700 dark:text-slate-100 hover:border-brand-400/60 hover:shadow-glow transition disabled:opacity-60 disabled:cursor-not-allowed"
                    disabled>
                    <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd"
                            d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"
                            clip-rule="evenodd"></path>
                    </svg>
                    Add unit
                </button>
            </div>

            <div id="results" class="mt-10 space-y-6"></div>
        </section>
    </main>

    <div id="unitModal" class="fixed inset-0 z-50 hidden flex items-center justify-center px-4 py-12 sm:px-6 lg:px-8"
        role="dialog" aria-modal="true" aria-labelledby="unitModalTitle">
        <div id="unitModalBackdrop" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm"></div>
        <div
            class="relative w-full max-w-2xl rounded-2xl border border-slate-200/60 dark:border-white/10 bg-white/90 dark:bg-night-900/90 shadow-xl">
            <div
                class="flex items-start justify-between gap-4 border-b border-slate-200/60 dark:border-white/10 px-6 py-5">
                <div>
                    <h2 id="unitModalTitle" class="text-xl font-semibold text-slate-900 dark:text-slate-100">Add a new
                        unit</h2>
                    <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">Provide the unit title and list of topics
                        covered.</p>
                </div>
                <button id="unitModalClose" type="button"
                    class="rounded-lg border border-transparent p-2 text-slate-500 hover:text-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-400/60">
                    <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd"
                            d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                            clip-rule="evenodd"></path>
                    </svg>
                </button>
            </div>
            <form id="unitForm" class="space-y-5 px-6 py-6">
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-200">
                    Unit title
                    <input id="unitTitle" name="unit_title" type="text" required maxlength="256"
                        class="mt-2 w-full rounded-xl border border-slate-200/60 dark:border-white/10 bg-white/80 dark:bg-night-800/70 px-3 py-2 text-sm text-slate-900 dark:text-slate-100 focus:border-brand-400 focus:outline-none focus:ring-2 focus:ring-brand-300/60"
                        placeholder="e.g. Introduction to Algorithms" />
                </label>
                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <span class="text-sm font-medium text-slate-700 dark:text-slate-200">Topics</span>
                        <button id="addTopicRow" type="button"
                            class="inline-flex items-center gap-2 rounded-lg border border-slate-200/60 dark:border-white/10 bg-white/70 dark:bg-night-800/70 px-3 py-1.5 text-xs font-medium text-slate-700 dark:text-slate-100 hover:border-brand-400/60 transition">
                            <svg class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                <path fill-rule="evenodd"
                                    d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"
                                    clip-rule="evenodd"></path>
                            </svg>
                            Add topic
                        </button>
                    </div>
                    <div id="topicsContainer" class="space-y-3"></div>
                </div>
                <p id="unitModalMessage" class="hidden text-sm text-red-500"></p>
                <div class="flex items-center justify-end gap-3">
                    <button id="unitModalCancel" type="button"
                        class="rounded-xl border border-slate-200/60 dark:border-white/10 px-4 py-2 text-sm text-slate-600 dark:text-slate-300 hover:border-brand-400/60 transition">Cancel</button>
                    <button id="unitSubmitBtn" type="submit"
                        class="rounded-xl bg-gradient-to-r from-brand-500 to-indigo-500 px-4 py-2 text-sm font-semibold text-white shadow-neon hover:opacity-95 transition">Save
                        unit</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const params = Collage.parseQuery();
        const courseId = params.courseId;
        const courseCode = params.courseCode ? decodeURIComponent(params.courseCode) : '';
        const courseTitle = params.courseTitle ? decodeURIComponent(params.courseTitle) : '';
        const semesterParam = params.semester ? Number(params.semester) : null;
        const batchRange = params.batchRange ? decodeURIComponent(params.batchRange) : '';
        const collegeName = params.collegeName ? decodeURIComponent(params.collegeName) : '';
        const degreeName = params.degreeName ? decodeURIComponent(params.degreeName) : '';
        const departmentName = params.departmentName ? decodeURIComponent(params.departmentName) : '';

        const results = document.getElementById('results');
        const titleEl = document.getElementById('pageTitle');
        const subtitleEl = document.getElementById('pageSubtitle');
        const breadcrumbsEl = document.getElementById('breadcrumbs');
        const contextPanel = document.getElementById('contextPanel');
        const backLink = document.getElementById('backLink');
        const addUnitBtn = document.getElementById('addUnitBtn');

        const unitModal = document.getElementById('unitModal');
        const unitModalBackdrop = document.getElementById('unitModalBackdrop');
        const unitModalTitle = document.getElementById('unitModalTitle');
        const unitModalMessage = document.getElementById('unitModalMessage');
        const unitModalCancel = document.getElementById('unitModalCancel');
        const unitModalClose = document.getElementById('unitModalClose');
        const unitSubmitBtn = document.getElementById('unitSubmitBtn');
        const unitForm = document.getElementById('unitForm');
        const unitTitleInput = document.getElementById('unitTitle');
        const topicsContainer = document.getElementById('topicsContainer');
        const addTopicRowButton = document.getElementById('addTopicRow');

        let syllabusCourse = null;
        let unitModalMode = 'add';
        let editingUnitId = null;

        if (backLink && params.batchId) {
            backLink.href = `subjects.html?collegeId=${encodeURIComponent(params.collegeId || '')}&collegeName=${encodeURIComponent(collegeName || '')}&degreeId=${encodeURIComponent(params.degreeId || '')}&degreeName=${encodeURIComponent(degreeName || '')}&departmentName=${encodeURIComponent(departmentName || '')}&batchId=${encodeURIComponent(params.batchId || '')}&batchRange=${encodeURIComponent(batchRange || '')}`;
        }

        function makeBreadcrumb(items) {
            if (!Array.isArray(items)) return '';
            return items.map((item, idx) => {
                if (!item) return '';
                if (item.href && idx !== items.length - 1) {
                    return `<a href="${item.href}" class="hover:text-brand-600">${Collage.escapeHtml(item.label || item.text || '')}</a>`;
                }
                return `<span class="text-slate-700 dark:text-slate-200">${Collage.escapeHtml(item.label || item.text || '')}</span>`;
            }).filter(Boolean).join('<span class="text-slate-400 dark:text-slate-500">/</span>');
        }

        function showLoader() {
            results.innerHTML = `
                <div class="flex justify-center py-16">
                    <div class="h-12 w-12 animate-spin rounded-full border-2 border-brand-400 border-t-transparent"></div>
                </div>`;
        }

        function showError(message) {
            results.innerHTML = `
                <div class="rounded-2xl border border-red-500/40 bg-red-50/90 dark:bg-red-500/10 dark:border-red-400/30 p-6 shadow">
                    <h2 class="text-lg font-semibold text-red-700 dark:text-red-200">Unable to load syllabus</h2>
                    <p class="mt-2 text-sm text-red-600/80 dark:text-red-200/80">${Collage.escapeHtml(message || 'Please check the subject link and try again.')}</p>
                </div>`;
        }

        function showEmpty() {
            results.innerHTML = `
                <div class="rounded-2xl border border-slate-200/60 dark:border-white/10 bg-white/80 dark:bg-night-800/70 p-6 shadow">
                    <h2 class="text-lg font-semibold">No units recorded</h2>
                    <p class="mt-2 text-sm text-slate-600 dark:text-slate-300">Use the “Add unit” button to record units and topics for this course.</p>
                </div>`;
        }

        function renderContext({ title, code, semester, batch }) {
            const chips = [
                code ? `<span class="inline-flex items-center gap-2 rounded-full border border-white/20 bg-white/40 px-3 py-1 text-xs text-slate-700 dark:text-slate-200"><svg class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M12 3h3a1 1 0 011 1v3h-1V5h-2v10h2v-2h1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1V4a1 1 0 011-1zM4 4a1 1 0 00-1 1v3a1 1 0 001 1h2a1 1 0 011 1v1.382l-1.447.724A1 1 0 005 12v2a1 1 0 102 0v-.618l1.447-.724A1 1 0 009 9V6a2 2 0 00-2-2H4z"/></svg>${Collage.escapeHtml(code)}</span>` : '',
                semester ? `<span class="inline-flex items-center gap-2 rounded-full border border-white/20 bg-white/40 px-3 py-1 text-xs text-slate-700 dark:text-slate-200"><svg class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M6 2a2 2 0 0 0-2 2v1H3a1 1 0 0 0 0 2h1v7a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7h1a1 1 0 1 0 0-2h-1V4a2 2 0 0 0-2-2H6Zm2 8a1 1 0 1 1 0-2 1 1 0 0 1 0 2Zm4 0a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"/></svg>Semester ${semester}</span>` : '',
                batch ? `<span class="inline-flex items-center gap-2 rounded-full border border-white/20 bg-white/40 px-3 py-1 text-xs text-slate-700 dark:text-slate-200"><svg class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 00-1-1H6zm8 4H6v2h8V6z" clip-rule="evenodd"/></svg>${Collage.escapeHtml(batch)}</span>` : ''
            ].filter(Boolean).join('');

            const trail = [collegeName, degreeName, departmentName]
                .filter(Boolean)
                .map(piece => Collage.escapeHtml(piece))
                .join(' • ');

            contextPanel.innerHTML = `
                <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
                    <div class="flex flex-wrap gap-3">${chips || '<span class="text-sm text-slate-600 dark:text-slate-400">No additional metadata available.</span>'}</div>
                    <div class="text-sm text-slate-600 dark:text-slate-300">${trail || ''}</div>
                </div>`;
        }

        function attachUnitEditHandlers() {
            const editButtons = results.querySelectorAll('[data-unit-edit]');
            editButtons.forEach((button) => {
                button.addEventListener('click', (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    const unitId = button.getAttribute('data-unit-edit');
                    const unit = (syllabusCourse?.units || []).find((item) => String(item.id) === String(unitId));
                    if (unit) {
                        openUnitModal('edit', unit);
                    }
                });
            });
        }

        function renderUnits(units) {
            if (!Array.isArray(units) || !units.length) {
                showEmpty();
                return;
            }
            const accentPalette = [
                'from-brand-400 via-brand-500 to-indigo-500',
                'from-emerald-400 via-teal-400 to-emerald-600',
                'from-fuchsia-400 via-pink-500 to-rose-500',
                'from-cyan-400 via-sky-500 to-blue-500',
                'from-amber-400 via-orange-500 to-amber-600'
            ];
            results.innerHTML = units.map((unit, index) => {
                const topics = Array.isArray(unit.topics) ? unit.topics : [];
                const accentColor = accentPalette[index % accentPalette.length];
                const orderIndex = Number(unit.order_in_course ?? index) + 1;
                const topicsMarkup = topics.length
                    ? `<ol class="mt-4 space-y-2 pl-5 text-sm text-slate-700 dark:text-slate-200 list-decimal">${topics.map((topic) => `<li>${Collage.escapeHtml(topic.topic || '')}</li>`).join('')}</ol>`
                    : '<p class="mt-4 text-sm text-slate-500 dark:text-slate-400">No topics recorded.</p>';

                return `
            <article class="group relative overflow-hidden rounded-2xl border border-slate-200/60 dark:border-white/10 bg-white/80 dark:bg-night-800/70 p-6 shadow transition hover:border-brand-400/60">
              <div class="absolute inset-x-6 top-4 h-24 rounded-xl bg-gradient-to-r ${accentColor} opacity-20 blur-2xl"></div>
              <button type="button" data-unit-edit="${unit.id}" aria-label="Edit unit ${Collage.escapeHtml(unit.unit_title || '')}"
                class="absolute top-4 right-4 z-20 inline-flex items-center justify-center rounded-full border border-white/20 bg-white/70 dark:bg-night-800/70 p-2 text-slate-500 hover:text-brand-500 hover:border-brand-400/60 transition">
                <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                  <path d="M17.414 2.586a2 2 0 00-2.828 0L6.414 10.758a2 2 0 00-.516.878l-.8 2.798a1 1 0 001.226 1.226l2.798-.8a2 2 0 00.878-.516l8.172-8.172a2 2 0 000-2.828l-.758-.758zm-3.535 1.414L15 5.536 13.536 7 12 5.464l1.879-1.879zM11.293 6.172L3.707 13.758l-.353 1.237 1.237-.353 7.586-7.586L11.293 6.172z" />
                </svg>
              </button>
              <div class="relative inline-flex items-center gap-2 rounded-full border border-white/20 bg-white/40 px-3 py-1 text-xs text-slate-700 dark:text-slate-200">
                <span class="font-semibold">Unit ${orderIndex}</span>
                ${topics.length ? `<span class="flex items-center gap-1 text-slate-500 dark:text-slate-300"><svg class="h-3 w-3" viewBox="0 0 20 20" fill="currentColor"><path d="M6 2a2 2 0 00-2 2v1H3a1 1 0 000 2h1v8a2 2 0 002 2h7a2 2 0 002-2v-1h2a1 1 0 001-1V9.414a1 1 0 00-.293-.707l-2.414-2.414A1 1 0 0015.586 6H14V4a2 2 0 00-2-2H6z"/></svg>${topics.length} topic${topics.length === 1 ? '' : 's'}</span>` : ''}
              </div>
              <h2 class="relative mt-4 text-xl font-semibold text-slate-900 dark:text-white">${Collage.escapeHtml(unit.unit_title || 'Untitled unit')}</h2>
              ${topicsMarkup}
            </article>`;
            }).join('');
            attachUnitEditHandlers();
        }

        function setAddUnitAvailability() {
            if (!addUnitBtn) return;
            if (courseId) {
                addUnitBtn.disabled = false;
            } else {
                addUnitBtn.disabled = true;
            }
        }

        function addTopicRow(value = '') {
            if (!topicsContainer) return;
            const row = document.createElement('div');
            row.className = 'flex items-start gap-3';
            row.dataset.topicRow = 'true';

            const textarea = document.createElement('textarea');
            textarea.className = 'flex-1 rounded-xl border border-slate-200/60 dark:border-white/10 bg-white/80 dark:bg-night-800/70 px-3 py-2 text-sm text-slate-900 dark:text-slate-100 focus:border-brand-400 focus:outline-none focus:ring-2 focus:ring-brand-300/60';
            textarea.rows = 2;
            textarea.placeholder = 'Enter topic';
            textarea.value = value;
            row.appendChild(textarea);

            const removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'mt-1 inline-flex items-center justify-center rounded-lg border border-slate-200/60 dark:border-white/10 bg-white/70 dark:bg-night-800/70 p-2 text-slate-500 hover:text-red-500 hover:border-red-300/60 transition';
            removeBtn.innerHTML = '<svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M6.293 6.293a1 1 0 011.414 0L10 8.586l2.293-2.293a1 1 0 111.414 1.414L11.414 10l2.293 2.293a1 1 0 01-1.414 1.414L10 11.414l-2.293 2.293a1 1 0 01-1.414-1.414L8.586 10 6.293 7.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>';
            removeBtn.addEventListener('click', () => {
                row.remove();
                if (!topicsContainer.querySelector('[data-topic-row]')) {
                    addTopicRow();
                }
            });
            row.appendChild(removeBtn);

            topicsContainer.appendChild(row);
        }

        function resetUnitModal() {
            unitForm?.reset();
            topicsContainer.innerHTML = '';
            unitModalMessage.textContent = '';
            unitModalMessage.classList.add('hidden');
            unitModalMode = 'add';
            editingUnitId = null;
            addTopicRow();
        }

        function openUnitModal(mode = 'add', unit = null) {
            if (!unitModal || !unitTitleInput) return;
            resetUnitModal();
            unitModalMode = mode;

            if (mode === 'edit' && unit) {
                editingUnitId = unit.id;
                unitTitleInput.value = unit.unit_title || '';
                topicsContainer.innerHTML = '';
                const topicList = Array.isArray(unit.topics) ? unit.topics : [];
                if (topicList.length) {
                    topicList.forEach((topic) => addTopicRow(topic.topic || ''));
                } else {
                    addTopicRow();
                }
                unitModalTitle.textContent = 'Edit unit';
                unitSubmitBtn.textContent = 'Save changes';
            } else {
                unitModalTitle.textContent = 'Add a new unit';
                unitSubmitBtn.textContent = 'Save unit';
            }

            unitModal.classList.remove('hidden');
            document.body.classList.add('overflow-hidden');
            setTimeout(() => unitTitleInput.focus(), 80);
        }

        function closeUnitModal() {
            unitModal?.classList.add('hidden');
            document.body.classList.remove('overflow-hidden');
            resetUnitModal();
        }

        function setUnitModalLoading(isLoading) {
            if (!unitSubmitBtn) return;
            unitSubmitBtn.disabled = isLoading;
            unitSubmitBtn.textContent = isLoading
                ? 'Saving…'
                : (unitModalMode === 'edit' ? 'Save changes' : 'Save unit');
        }

        async function handleUnitSubmit(event) {
            event.preventDefault();
            if (!courseId) {
                unitModalMessage.textContent = 'Missing course context. Please reload the page and try again.';
                unitModalMessage.classList.remove('hidden');
                return;
            }

            const title = unitTitleInput.value.trim();
            if (!title) {
                unitModalMessage.textContent = 'Enter a unit title.';
                unitModalMessage.classList.remove('hidden');
                unitTitleInput.focus();
                return;
            }

            const topicInputs = topicsContainer.querySelectorAll('textarea');
            const topics = [];
            topicInputs.forEach((input) => {
                const value = input.value.trim();
                if (value) {
                    topics.push({ topic: value });
                }
            });

            unitModalMessage.classList.add('hidden');
            setUnitModalLoading(true);

            const payload = {
                unit_title: title,
                topics,
            };

            try {
                if (unitModalMode === 'edit' && editingUnitId) {
                    await Collage.fetchJson(`/api/syllabus/units/${editingUnitId}`, {
                        method: 'PUT',
                        body: payload,
                        skipAuth: true,
                    });
                } else {
                    await Collage.fetchJson(`/api/syllabus/courses/${courseId}/units`, {
                        method: 'POST',
                        body: payload,
                        skipAuth: true,
                    });
                }
                closeUnitModal();
                await loadSyllabus();
            } catch (error) {
                let message = error?.message ?? 'Unable to save unit. Please try again.';
                if (typeof message !== 'string') {
                    try {
                        message = JSON.stringify(message);
                    } catch (_) {
                        message = 'Unable to save unit. Please try again.';
                    }
                }
                if (message === '[object Object]') {
                    message = 'Unexpected response from server. Please try again.';
                }
                unitModalMessage.textContent = message;
                unitModalMessage.classList.remove('hidden');
                console.error(error);
            } finally {
                setUnitModalLoading(false);
            }
        }

        addUnitBtn?.addEventListener('click', () => openUnitModal('add'));
        addTopicRowButton?.addEventListener('click', () => addTopicRow());
        unitModalCancel?.addEventListener('click', closeUnitModal);
        unitModalClose?.addEventListener('click', closeUnitModal);
        unitModalBackdrop?.addEventListener('click', closeUnitModal);
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && unitModal && !unitModal.classList.contains('hidden')) {
                closeUnitModal();
            }
        });
        unitForm?.addEventListener('submit', handleUnitSubmit);

        async function loadSyllabus(showSpinner = true) {
            if (!courseId) {
                showError('Missing courseId in URL.');
                setAddUnitAvailability();
                return;
            }
            if (showSpinner) {
                showLoader();
            }
            try {
                const data = await Collage.fetchJson(`/api/syllabus/courses/${courseId}`, { skipAuth: true });
                syllabusCourse = data;
                const title = data?.title || courseTitle || 'Subject syllabus';
                const code = data?.course_code || courseCode;
                const semester = data?.semester || semesterParam;
                const batch = batchRange || data?.batch_id || '';

                titleEl.textContent = title;
                if (semester && batch) {
                    subtitleEl.textContent = `Semester ${semester} · Batch ${batch}`;
                } else if (semester) {
                    subtitleEl.textContent = `Semester ${semester}`;
                } else if (batch) {
                    subtitleEl.textContent = `Batch ${batch}`;
                } else {
                    subtitleEl.textContent = '';
                }
                breadcrumbsEl.innerHTML = makeBreadcrumb([
                    { label: 'Colleges', href: 'clg_info.html' },
                    collegeName ? { label: collegeName, href: `degrees.html?collegeId=${encodeURIComponent(params.collegeId || '')}&collegeName=${encodeURIComponent(collegeName)}` } : null,
                    degreeName ? { label: degreeName, href: `departments.html?collegeId=${encodeURIComponent(params.collegeId || '')}&collegeName=${encodeURIComponent(collegeName || '')}&degreeId=${encodeURIComponent(params.degreeId || '')}&degreeName=${encodeURIComponent(degreeName)}` } : null,
                    departmentName ? { label: departmentName, href: `batches.html?collegeId=${encodeURIComponent(params.collegeId || '')}&collegeName=${encodeURIComponent(collegeName || '')}&degreeId=${encodeURIComponent(params.degreeId || '')}&degreeName=${encodeURIComponent(degreeName || '')}&departmentName=${encodeURIComponent(departmentName)}` } : null,
                    batch ? { label: batch, href: `subjects.html?collegeId=${encodeURIComponent(params.collegeId || '')}&collegeName=${encodeURIComponent(collegeName || '')}&degreeId=${encodeURIComponent(params.degreeId || '')}&degreeName=${encodeURIComponent(degreeName || '')}&departmentName=${encodeURIComponent(departmentName || '')}&batchId=${encodeURIComponent(params.batchId || '')}&batchRange=${encodeURIComponent(batch)}` } : null,
                    { label: title }
                ]);

                renderContext({ title, code, semester, batch });
                setAddUnitAvailability();

                const units = Array.isArray(data?.units) ? data.units : [];
                syllabusCourse.units = units;
                renderUnits(units);
            } catch (err) {
                console.error(err);
                showError(err.message || 'Unexpected error');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            setAddUnitAvailability();
            loadSyllabus();
        });
    </script>
</body>

</html>
