<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>College Navigator · Syllabus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { display: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#f0f7ff', 100: '#e0efff', 200: '#b9dbff', 300: '#8ac4ff', 400: '#59a9ff', 500: '#2b8cff', 600: '#116fe6', 700: '#0a57b4', 800: '#0b4890', 900: '#0d3a73' },
                        night: { 900: '#0a0c10', 800: '#0f131a', 700: '#141a22', 600: '#1a2230' }
                    },
                    boxShadow: {
                        glow: '0 0 0 1px rgba(59,130,246,.2), 0 8px 40px rgba(59,130,246,.15)',
                        neon: '0 0 25px rgba(43,140,255,.35), 0 0 60px rgba(43,140,255,.25)'
                    },
                    backgroundImage: {
                        'grid-radial': 'radial-gradient(circle at 20% 10%, rgba(43,140,255,.25), transparent 35%), radial-gradient(circle at 80% 20%, rgba(168,85,247,.2), transparent 35%), radial-gradient(circle at 50% 80%, rgba(16,185,129,.2), transparent 35%)'
                    }
                }
            }
        };
    </script>
    <script src="../config.js"></script>
    <script src="helpers.js"></script>
    <style>
        .glass {
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .glass-dark {
            background: rgba(20, 24, 32, 0.55);
            border-color: rgba(255, 255, 255, 0.08);
        }
    </style>
</head>

<body
    class="font-display bg-white text-slate-900 dark:bg-night-900 dark:text-slate-200 selection:bg-brand-200 selection:text-slate-900">
    <div aria-hidden="true" class="fixed inset-0 -z-10 bg-grid-radial opacity-70 dark:opacity-50"></div>

    <header
        class="sticky top-0 z-40 backdrop-blur supports-[backdrop-filter]:bg-white/70 dark:supports-[backdrop-filter]:bg-night-900/60 border-b border-black/5 dark:border-white/5">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
            <div class="flex h-16 items-center justify-between">
                <a href="../index.html" class="flex items-center gap-3 group">
                    <div
                        class="h-9 w-9 rounded-xl bg-gradient-to-br from-brand-400 via-brand-500 to-indigo-500 shadow-neon grid place-items-center text-white font-bold tracking-tight">
                        PX</div>
                    <div>
                        <p class="text-lg font-semibold leading-tight group-hover:text-brand-600">Pa[p]er X</p>
                        <p class="text-xs text-slate-500 dark:text-slate-400 -mt-1">Agentic AI for Indian syllabi</p>
                    </div>
                </a>
                <a id="backLink" href="subjects.html"
                    class="inline-flex items-center gap-2 rounded-xl border border-slate-200/60 dark:border-white/10 px-3 py-1.5 text-sm hover:border-brand-400/60 transition"
                    title="Back to subjects">
                    <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd"
                            d="M12.707 15.707a1 1 0 01-1.414 0L5.586 10l5.707-5.707a1 1 0 011.414 1.414L8.414 10l4.293 4.293a1 1 0 010 1.414z"
                            clip-rule="evenodd"></path>
                    </svg>
                    Back
                </a>
            </div>
        </div>
    </header>

    <main class="relative">
        <section class="mx-auto max-w-5xl px-4 sm:px-6 lg:px-8 pt-10 pb-20">
            <div class="flex flex-col gap-6">
                <div
                    class="inline-flex items-center gap-2 rounded-full border border-white/20 bg-white/70 dark:bg-night-800/60 px-3 py-1 text-xs text-slate-700 dark:text-slate-300 backdrop-blur">
                    <span class="h-2 w-2 rounded-full bg-brand-500"></span>
                    Course syllabus
                </div>
                <div class="flex flex-col gap-2">
                    <nav id="breadcrumbs"
                        class="flex flex-wrap items-center gap-2 text-sm text-slate-500 dark:text-slate-400"
                        aria-label="breadcrumb"></nav>
                    <div>
                        <h1 id="pageTitle" class="text-3xl sm:text-4xl font-bold leading-tight">Subject syllabus</h1>
                        <p id="pageSubtitle" class="mt-2 text-slate-600 dark:text-slate-300">Loading syllabus…</p>
                    </div>
                </div>
            </div>

            <div id="contextPanel"
                class="mt-8 rounded-2xl border border-slate-200/60 dark:border-white/10 bg-white/80 dark:bg-night-800/70 shadow p-6">
            </div>

            <div id="results" class="mt-10 space-y-6"></div>
        </section>
    </main>

    <script>
        const params = Collage.parseQuery();
        const courseId = params.courseId;
        const courseCode = params.courseCode ? decodeURIComponent(params.courseCode) : '';
        const courseTitle = params.courseTitle ? decodeURIComponent(params.courseTitle) : '';
        const semesterParam = params.semester ? Number(params.semester) : null;
        const batchRange = params.batchRange ? decodeURIComponent(params.batchRange) : '';
        const collegeName = params.collegeName ? decodeURIComponent(params.collegeName) : '';
        const degreeName = params.degreeName ? decodeURIComponent(params.degreeName) : '';
        const departmentName = params.departmentName ? decodeURIComponent(params.departmentName) : '';

        const results = document.getElementById('results');
        const titleEl = document.getElementById('pageTitle');
        const subtitleEl = document.getElementById('pageSubtitle');
        const breadcrumbsEl = document.getElementById('breadcrumbs');
        const contextPanel = document.getElementById('contextPanel');
        const backLink = document.getElementById('backLink');

        if (backLink && params.batchId) {
            backLink.href = `subjects.html?collegeId=${encodeURIComponent(params.collegeId || '')}&collegeName=${encodeURIComponent(collegeName || '')}&degreeId=${encodeURIComponent(params.degreeId || '')}&degreeName=${encodeURIComponent(degreeName || '')}&departmentName=${encodeURIComponent(departmentName || '')}&batchId=${encodeURIComponent(params.batchId || '')}&batchRange=${encodeURIComponent(batchRange || '')}`;
        }

        function makeBreadcrumb(items) {
            if (!Array.isArray(items)) return '';
            return items.map((item, idx) => {
                if (!item) return '';
                if (item.href && idx !== items.length - 1) {
                    return `<a href="${item.href}" class="hover:text-brand-600">${Collage.escapeHtml(item.label || item.text || '')}</a>`;
                }
                return `<span class="text-slate-700 dark:text-slate-200">${Collage.escapeHtml(item.label || item.text || '')}</span>`;
            }).filter(Boolean).join('<span class="text-slate-400 dark:text-slate-500">/</span>');
        }

        function showLoader() {
            results.innerHTML = `
                <div class="flex justify-center py-16">
                    <div class="h-12 w-12 animate-spin rounded-full border-2 border-brand-400 border-t-transparent"></div>
                </div>`;
        }

        function showError(message) {
            results.innerHTML = `
                <div class="rounded-2xl border border-red-500/40 bg-red-50/90 dark:bg-red-500/10 dark:border-red-400/30 p-6 shadow">
                    <h2 class="text-lg font-semibold text-red-700 dark:text-red-200">Unable to load syllabus</h2>
                    <p class="mt-2 text-sm text-red-600/80 dark:text-red-200/80">${Collage.escapeHtml(message || 'Please check the subject link and try again.')}</p>
                </div>`;
        }

        function showEmpty() {
            results.innerHTML = `
                <div class="rounded-2xl border border-slate-200/60 dark:border-white/10 bg-white/80 dark:bg-night-800/70 p-6 shadow">
                    <h2 class="text-lg font-semibold">No units recorded</h2>
                    <p class="mt-2 text-sm text-slate-600 dark:text-slate-300">Add units and topics for this course to complete the syllabus.</p>
                </div>`;
        }

        function renderContext({ title, code, semester, batch }) {
            const chips = [
                code ? `<span class="inline-flex items-center gap-2 rounded-full border border-white/20 bg-white/40 px-3 py-1 text-xs text-slate-700 dark:text-slate-200"><svg class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M12 3h3a1 1 0 011 1v3h-1V5h-2v10h2v-2h1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1V4a1 1 0 011-1zM4 4a1 1 0 00-1 1v3a1 1 0 001 1h2a1 1 0 011 1v1.382l-1.447.724A1 1 0 005 12v2a1 1 0 102 0v-.618l1.447-.724A1 1 0 009 9V6a2 2 0 00-2-2H4z"/></svg>${Collage.escapeHtml(code)}</span>` : '',
                semester ? `<span class="inline-flex items-center gap-2 rounded-full border border-white/20 bg-white/40 px-3 py-1 text-xs text-slate-700 dark:text-slate-200"><svg class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M6 2a2 2 0 0 0-2 2v1H3a1 1 0 0 0 0 2h1v7a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7h1a1 1 0 1 0 0-2h-1V4a2 2 0 0 0-2-2H6Zm2 8a1 1 0 1 1 0-2 1 1 0 0 1 0 2Zm4 0a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"/></svg>Semester ${semester}</span>` : '',
                batch ? `<span class="inline-flex items-center gap-2 rounded-full border border-white/20 bg-white/40 px-3 py-1 text-xs text-slate-700 dark:text-slate-200"><svg class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 00-1-1H6zm8 4H6v2h8V6z" clip-rule="evenodd"/></svg>${Collage.escapeHtml(batch)}</span>` : ''
            ].filter(Boolean).join('');

            const trail = [collegeName, degreeName, departmentName]
                .filter(Boolean)
                .map(piece => Collage.escapeHtml(piece))
                .join(' • ');

            contextPanel.innerHTML = `
                <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
                    <div class="flex flex-wrap gap-3">${chips || '<span class="text-sm text-slate-600 dark:text-slate-400">No additional metadata available.</span>'}</div>
                      <div class="text-sm text-slate-600 dark:text-slate-300">${trail || ''}</div>
                </div>`;
        }

        async function loadSyllabus() {
            if (!courseId) {
                showError('Missing courseId in URL.');
                return;
            }
            showLoader();
            try {
                const data = await Collage.fetchJson(`/api/syllabus/courses/${courseId}`, { skipAuth: true });
                const title = data?.title || courseTitle || 'Subject syllabus';
                const code = data?.course_code || courseCode;
                const semester = data?.semester || semesterParam;
                const batch = batchRange || data?.batch_id || '';

                titleEl.textContent = title;
                subtitleEl.textContent = semester ? `Semester ${semester} · Batch ${batch}` : batch ? `Batch ${batch}` : '';
                breadcrumbsEl.innerHTML = makeBreadcrumb([
                    { label: 'Colleges', href: 'clg_info.html' },
                    collegeName ? { label: collegeName, href: `degrees.html?collegeId=${encodeURIComponent(params.collegeId || '')}&collegeName=${encodeURIComponent(collegeName)}` } : null,
                    degreeName ? { label: degreeName, href: `departments.html?collegeId=${encodeURIComponent(params.collegeId || '')}&collegeName=${encodeURIComponent(collegeName || '')}&degreeId=${encodeURIComponent(params.degreeId || '')}&degreeName=${encodeURIComponent(degreeName)}` } : null,
                    departmentName ? { label: departmentName, href: `batches.html?collegeId=${encodeURIComponent(params.collegeId || '')}&collegeName=${encodeURIComponent(collegeName || '')}&degreeId=${encodeURIComponent(params.degreeId || '')}&degreeName=${encodeURIComponent(degreeName || '')}&departmentName=${encodeURIComponent(departmentName)}` } : null,
                    batch ? { label: batch, href: `subjects.html?collegeId=${encodeURIComponent(params.collegeId || '')}&collegeName=${encodeURIComponent(collegeName || '')}&degreeId=${encodeURIComponent(params.degreeId || '')}&degreeName=${encodeURIComponent(degreeName || '')}&departmentName=${encodeURIComponent(departmentName || '')}&batchId=${encodeURIComponent(params.batchId || '')}&batchRange=${encodeURIComponent(batch)}` } : null,
                    { label: title }
                ]);

                renderContext({ title, code, semester, batch });

                const units = Array.isArray(data?.units) ? data.units : [];
                if (!units.length) {
                    showEmpty();
                    return;
                }

                results.innerHTML = units.map((unit, index) => {
                    const topics = Array.isArray(unit.topics) ? unit.topics : [];
                    const accentColor = ['from-brand-400 via-brand-500 to-indigo-500', 'from-emerald-400 via-teal-400 to-emerald-600', 'from-fuchsia-400 via-pink-500 to-rose-500', 'from-cyan-400 via-sky-500 to-blue-500', 'from-amber-400 via-orange-500 to-amber-600'][index % 5];
                    const orderIndex = Number(unit.order_in_course ?? index) + 1;
                    const topicsMarkup = topics.length
                        ? `<ol class="mt-4 space-y-2 pl-5 text-sm text-slate-700 dark:text-slate-200 list-decimal">${topics.map(topic => `<li>${Collage.escapeHtml(topic.topic || '')}</li>`).join('')}</ol>`
                        : '<p class="mt-4 text-sm text-slate-500 dark:text-slate-400">No topics recorded.</p>';

                    return `
                        <article class="relative overflow-hidden rounded-2xl border border-slate-200/60 dark:border-white/10 bg-white/80 dark:bg-night-800/70 p-6 shadow transition hover:border-brand-400/60">
                            <div class="absolute inset-x-6 top-4 h-24 rounded-xl bg-gradient-to-r ${accentColor} opacity-20 blur-2xl"></div>
                            <div class="relative inline-flex items-center gap-2 rounded-full border border-white/20 bg-white/40 px-3 py-1 text-xs text-slate-700 dark:text-slate-200">
                                <span class="font-semibold">Unit ${orderIndex}</span>
                                ${topics.length ? `<span class="flex items-center gap-1 text-slate-500 dark:text-slate-300"><svg class="h-3 w-3" viewBox="0 0 20 20" fill="currentColor"><path d="M6 2a2 2 0 00-2 2v1H3a1 1 0 000 2h1v8a2 2 0 002 2h7a2 2 0 002-2v-1h2a1 1 0 001-1V9.414a1 1 0 00-.293-.707l-2.414-2.414A1 1 0 0015.586 6H14V4a2 2 0 00-2-2H6z"/></svg>${topics.length} topic${topics.length === 1 ? '' : 's'}</span>` : ''}
                            </div>
                            <h2 class="relative mt-4 text-xl font-semibold text-slate-900 dark:text-white">${Collage.escapeHtml(unit.unit_title || 'Untitled unit')}</h2>
                            ${topicsMarkup}
                        </article>`;
                }).join('');
            } catch (err) {
                console.error(err);
                showError(err.message || 'Unexpected error');
            }
        }

        document.addEventListener('DOMContentLoaded', loadSyllabus);
    </script>
</body>

</html>
