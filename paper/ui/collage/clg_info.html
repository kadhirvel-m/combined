<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>College Navigator · Colleges</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { display: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#f0f7ff', 100: '#e0efff', 200: '#b9dbff', 300: '#8ac4ff', 400: '#59a9ff', 500: '#2b8cff', 600: '#116fe6', 700: '#0a57b4', 800: '#0b4890', 900: '#0d3a73' },
                        night: { 900: '#0a0c10', 800: '#0f131a', 700: '#141a22', 600: '#1a2230' }
                    },
                    boxShadow: {
                        glow: '0 0 0 1px rgba(59,130,246,.2), 0 8px 40px rgba(59,130,246,.15)',
                        neon: '0 0 25px rgba(43,140,255,.35), 0 0 60px rgba(43,140,255,.25)'
                    },
                    backgroundImage: {
                        'grid-radial': 'radial-gradient(circle at 20% 10%, rgba(43,140,255,.25), transparent 35%), radial-gradient(circle at 80% 20%, rgba(168,85,247,.2), transparent 35%), radial-gradient(circle at 50% 80%, rgba(16,185,129,.2), transparent 35%)'
                    }
                }
            }
        };
    </script>
    <script src="../config.js"></script>
    <script src="helpers.js"></script>
    <style>
        .glass {
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .glass-dark {
            background: rgba(20, 24, 32, 0.55);
            border-color: rgba(255, 255, 255, 0.08);
        }
    </style>
</head>

<body
    class="font-display bg-white text-slate-900 dark:bg-night-900 dark:text-slate-200 selection:bg-brand-200 selection:text-slate-900">
    <div aria-hidden="true" class="fixed inset-0 -z-10 bg-grid-radial opacity-70 dark:opacity-50"></div>

    <header
        class="sticky top-0 z-40 backdrop-blur supports-[backdrop-filter]:bg-white/70 dark:supports-[backdrop-filter]:bg-night-900/60 border-b border-black/5 dark:border-white/5">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
            <div class="flex h-16 items-center justify-between">
                <a href="../index.html" class="flex items-center gap-3 group">
                    <div
                        class="h-9 w-9 rounded-xl bg-gradient-to-br from-brand-400 via-brand-500 to-indigo-500 shadow-neon grid place-items-center text-white font-bold tracking-tight">
                        PX</div>
                    <div>
                        <p class="text-lg font-semibold leading-tight group-hover:text-brand-600">Pa[p]er X</p>
                        <p class="text-xs text-slate-500 dark:text-slate-400 -mt-1">Agentic AI for Indian syllabi</p>
                    </div>
                </a>
                <a href="../login.html"
                    class="hidden sm:inline-flex items-center gap-2 rounded-xl border border-slate-200/60 dark:border-white/10 px-4 py-2 hover:border-brand-400/60 transition">Sign
                    in</a>
            </div>
        </div>
    </header>

    <main class="relative">
        <section class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8 pt-10 pb-20">
            <div class="flex flex-col gap-4">
                <div
                    class="inline-flex items-center gap-2 rounded-full border border-white/20 bg-white/70 dark:bg-night-800/60 px-3 py-1 text-xs text-slate-700 dark:text-slate-300 backdrop-blur">
                    <span class="h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    College Navigator
                </div>
                <div class="max-w-3xl">
                    <h1 class="text-3xl sm:text-4xl font-bold leading-tight">Choose a college</h1>
                </div>
            </div>

            <div class="mt-6 flex flex-wrap items-center justify-between gap-3">
                <p class="text-sm text-slate-600 dark:text-slate-300">Manage and curate the college directory shown to
                    learners.</p>
                <div class="flex items-center gap-3">
                    <button id="addCollegeBtn"
                        class="inline-flex items-center gap-2 rounded-xl border border-slate-200/60 dark:border-white/10 bg-white/70 dark:bg-night-800/70 px-4 py-2 text-sm font-medium text-slate-700 dark:text-slate-100 hover:border-brand-400/60 hover:shadow-glow transition"
                        type="button">
                        <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                            <path fill-rule="evenodd"
                                d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"
                                clip-rule="evenodd"></path>
                        </svg>
                        Add college
                    </button>
                </div>
            </div>

            <div id="results" class="mt-12 grid gap-6 sm:grid-cols-2 xl:grid-cols-3"></div>
        </section>
    </main>

    <div id="collegeModal" class="fixed inset-0 z-50 hidden flex items-center justify-center px-4 py-12 sm:px-6 lg:px-8"
        role="dialog" aria-modal="true" aria-labelledby="collegeModalTitle">
        <div id="collegeModalBackdrop" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm"></div>
        <div
            class="relative w-full max-w-lg rounded-2xl border border-slate-200/60 dark:border-white/10 bg-white/90 dark:bg-night-900/90 shadow-xl">
            <div
                class="flex items-start justify-between gap-4 border-b border-slate-200/60 dark:border-white/10 px-6 py-5">
                <div>
                    <h2 id="collegeModalTitle" class="text-xl font-semibold text-slate-900 dark:text-slate-100">Add a
                        new college</h2>
                    <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">Provide the official name as it should
                        appear throughout the navigator.</p>
                </div>
                <button id="collegeModalClose" type="button"
                    class="rounded-lg border border-transparent p-2 text-slate-500 hover:text-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-400/60">
                    <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd"
                            d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                            clip-rule="evenodd"></path>
                    </svg>
                </button>
            </div>
            <form id="collegeForm" class="space-y-5 px-6 py-6">
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-200">
                    College name
                    <input id="collegeName" name="name" type="text" required
                        class="mt-2 w-full rounded-xl border border-slate-200/60 dark:border-white/10 bg-white/80 dark:bg-night-800/70 px-3 py-2 text-sm text-slate-900 dark:text-slate-100 focus:border-brand-400 focus:outline-none focus:ring-2 focus:ring-brand-300/60"
                        placeholder="e.g. Mannakul Vinayagar Institute of Technology" />
                </label>
                <p id="collegeModalMessage" class="hidden text-sm text-red-500"></p>
                <div class="flex items-center justify-end gap-3">
                    <button id="collegeModalCancel" type="button"
                        class="rounded-xl border border-slate-200/60 dark:border-white/10 px-4 py-2 text-sm text-slate-600 dark:text-slate-300 hover:border-brand-400/60 transition">Cancel</button>
                    <button id="collegeSubmitBtn" type="submit"
                        class="rounded-xl bg-gradient-to-r from-brand-500 to-indigo-500 px-4 py-2 text-sm font-semibold text-white shadow-neon hover:opacity-95 transition">Save
                        college</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const results = document.getElementById('results');
        const addCollegeBtn = document.getElementById('addCollegeBtn');
        const collegeModal = document.getElementById('collegeModal');
        const collegeModalBackdrop = document.getElementById('collegeModalBackdrop');
        const collegeModalTitle = document.getElementById('collegeModalTitle');
        const collegeForm = document.getElementById('collegeForm');
        const collegeNameInput = document.getElementById('collegeName');
        const collegeModalMessage = document.getElementById('collegeModalMessage');
        const collegeModalCancel = document.getElementById('collegeModalCancel');
        const collegeSubmitBtn = document.getElementById('collegeSubmitBtn');
        const collegeModalClose = document.getElementById('collegeModalClose');
        let collegesCache = [];
        let modalMode = 'add';
        let editingCollegeId = null;

        function showLoader() {
            results.innerHTML = `
        <div class="col-span-full flex items-center justify-center py-16">
          <div class="h-12 w-12 animate-spin rounded-full border-2 border-brand-400 border-t-transparent"></div>
        </div>`;
        }

        function showError(message) {
            results.innerHTML = `
        <div class="col-span-full rounded-2xl border border-red-500/40 bg-red-50/90 dark:bg-red-500/10 dark:border-red-400/30 p-6 shadow">
          <h2 class="text-lg font-semibold text-red-700 dark:text-red-200">Unable to load colleges</h2>
          <p class="mt-2 text-sm text-red-600/80 dark:text-red-200/80">${Collage.escapeHtml(message || 'Please try again in a moment.')}</p>
        </div>`;
        }

        function showEmpty() {
            results.innerHTML = `
        <div class="col-span-full rounded-2xl border border-slate-200/60 dark:border-white/10 bg-white/70 dark:bg-night-800/70 p-6 shadow">
          <h2 class="text-lg font-semibold">No colleges yet</h2>
          <p class="mt-2 text-sm text-slate-600 dark:text-slate-300">Add a college from the admin tools or import academic data to get started.</p>
        </div>`;
        }

        function resetModal() {
            collegeForm.reset();
            collegeModalMessage.textContent = '';
            collegeModalMessage.classList.add('hidden');
            editingCollegeId = null;
        }

        function setModalLoading(isLoading) {
            collegeSubmitBtn.disabled = isLoading;
            collegeSubmitBtn.textContent = isLoading ? 'Saving…' : (modalMode === 'edit' ? 'Save changes' : 'Save college');
        }

        function closeCollegeModal() {
            collegeModal.classList.add('hidden');
            document.body.classList.remove('overflow-hidden');
            resetModal();
        }

        function openCollegeModal(mode, college) {
            modalMode = mode;
            resetModal();
            if (mode === 'edit' && college) {
                editingCollegeId = college.id;
                collegeNameInput.value = college.name || '';
            }
            collegeModalTitle.textContent = mode === 'edit' ? 'Edit college' : 'Add a new college';
            collegeSubmitBtn.textContent = mode === 'edit' ? 'Save changes' : 'Save college';
            collegeModal.classList.remove('hidden');
            document.body.classList.add('overflow-hidden');
            setTimeout(() => {
                collegeNameInput?.focus();
                if (mode === 'edit') {
                    collegeNameInput?.select();
                }
            }, 100);
        }

        function attachCollegeEditHandlers() {
            const editButtons = results.querySelectorAll('[data-college-edit]');
            editButtons.forEach(button => {
                button.addEventListener('click', (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    event.stopImmediatePropagation();
                    const id = button.getAttribute('data-college-edit');
                    const college = collegesCache.find(item => item.id === id);
                    if (college) {
                        openCollegeModal('edit', college);
                    }
                });
            });
        }

        async function handleCollegeSubmit(event) {
            event.preventDefault();
            const name = (collegeNameInput.value || '').trim();
            if (!name) {
                collegeModalMessage.textContent = 'Please enter the college name.';
                collegeModalMessage.classList.remove('hidden');
                collegeNameInput.focus();
                return;
            }
            collegeModalMessage.classList.add('hidden');
            setModalLoading(true);
            try {
                if (modalMode === 'edit' && editingCollegeId) {
                    await Collage.fetchJson(`/api/colleges/${editingCollegeId}`, {
                        method: 'PUT',
                        body: { name },
                        skipAuth: true
                    });
                } else {
                    await Collage.fetchJson('/api/colleges/simple', {
                        method: 'POST',
                        body: { name },
                        skipAuth: true
                    });
                }
                closeCollegeModal();
                await loadColleges();
            } catch (error) {
                let message = error?.message ?? 'Unable to save college. Please try again.';
                if (typeof message !== 'string') {
                    try {
                        message = JSON.stringify(message);
                    } catch (_) {
                        message = 'Unable to save college. Please try again.';
                    }
                }
                if (message === '[object Object]') {
                    message = 'Unexpected response from server. Please try again.';
                }
                collegeModalMessage.textContent = message;
                collegeModalMessage.classList.remove('hidden');
                console.error(error);
            } finally {
                setModalLoading(false);
            }
        }

        async function loadColleges() {
            showLoader();
            try {
                const colleges = await Collage.fetchJson('/api/colleges', { skipAuth: true });
                collegesCache = Array.isArray(colleges) ? colleges.slice() : [];
                if (!Array.isArray(colleges) || !colleges.length) {
                    showEmpty();
                    return;
                }
                results.innerHTML = colleges.map((college, index) => {
                    const accentColor = ['from-brand-400 via-brand-500 to-indigo-500', 'from-emerald-400 via-teal-400 to-emerald-600', 'from-fuchsia-400 via-pink-500 to-rose-500', 'from-cyan-400 via-sky-500 to-blue-500', 'from-amber-400 via-orange-500 to-amber-600'][index % 5];
                    const target = `degrees.html?collegeId=${encodeURIComponent(college.id)}&collegeName=${encodeURIComponent((college && college.name) || '')}`;
                    return `
                                                                        <article class="group relative overflow-hidden rounded-2xl border border-slate-200/60 dark:border-white/10 bg-white/70 dark:bg-night-800/70 p-6 shadow transition hover:border-brand-400/60 hover:shadow-glow">
              <div class="absolute inset-x-4 top-4 h-28 rounded-xl bg-gradient-to-r ${accentColor} opacity-20 blur-2xl"></div>
              <button type="button" data-college-edit="${college.id}" aria-label="Edit ${Collage.escapeHtml(college.name)}"
                                                        class="absolute top-4 right-4 z-20 inline-flex items-center justify-center rounded-full border border-white/20 bg-white/70 dark:bg-night-800/70 p-2 text-slate-500 hover:text-brand-500 hover:border-brand-400/60 transition">
                <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                  <path d="M17.414 2.586a2 2 0 00-2.828 0L6.414 10.758a2 2 0 00-.516.878l-.8 2.798a1 1 0 001.226 1.226l2.798-.8a2 2 0 00.878-.516l8.172-8.172a2 2 0 000-2.828l-.758-.758zm-3.535 1.414L15 5.536 13.536 7 12 5.464l1.879-1.879zM11.293 6.172L3.707 13.758l-.353 1.237 1.237-.353 7.586-7.586L11.293 6.172z" />
                </svg>
              </button>
              <div class="relative flex items-center justify-between text-xs text-slate-500 dark:text-slate-400">
                <span class="inline-flex items-center gap-2 rounded-full border border-white/40 bg-white/40 px-3 py-1 text-xs text-slate-700 dark:text-slate-200">
                  <span class="h-1.5 w-1.5 rounded-full bg-emerald-400"></span>
                  Active
                </span>
              </div>
                                            <h2 class="relative z-10 mt-6 text-xl font-semibold">
                                                <a href="${target}" class="relative inline-flex items-center gap-2 rounded-lg text-slate-900 dark:text-white group-hover:text-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-400/60 focus:ring-offset-2 focus:ring-offset-white dark:focus:ring-offset-night-900">
                                    ${Collage.escapeHtml(college.name)}
                                    <svg class="h-4 w-4 text-brand-500 opacity-0 group-hover:opacity-100 transition" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                                        <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l5 5a1 1 0 010 1.414l-5 5a1 1 0 01-1.414-1.414L13.586 11H4a1 1 0 110-2h9.586l-3.293-3.293a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                                    </svg>
                                </a>
                            </h2>
              <p class="relative mt-3 text-sm text-slate-600 dark:text-slate-300">Dive into its degrees, departments, batches, subjects, and full syllabus structure.</p>
                            <div class="relative mt-6 inline-flex items-center gap-2 text-sm text-brand-600 dark:text-brand-300">
                Explore hierarchy
                <svg class="h-4 w-4 transition group-hover:translate-x-1" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                  <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l5 5a1 1 0 010 1.414l-5 5a1 1 0 01-1.414-1.414L13.586 11H4a1 1 0 110-2h9.586l-3.293-3.293a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                </svg>
              </div>
                        </article>`;
                }).join('');
                attachCollegeEditHandlers();
            } catch (err) {
                console.error(err);
                showError(err.message || 'Unexpected error');
            }
        }

        function initCollegeManagement() {
            addCollegeBtn?.addEventListener('click', () => openCollegeModal('add'));
            collegeModalCancel?.addEventListener('click', closeCollegeModal);
            collegeModalClose?.addEventListener('click', closeCollegeModal);
            collegeModalBackdrop?.addEventListener('click', closeCollegeModal);
            collegeForm?.addEventListener('submit', handleCollegeSubmit);
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && !collegeModal.classList.contains('hidden')) {
                    closeCollegeModal();
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            initCollegeManagement();
            loadColleges();
        });
    </script>
</body>

</html>
