<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>College Navigator · Subjects</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { display: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#f0f7ff', 100: '#e0efff', 200: '#b9dbff', 300: '#8ac4ff', 400: '#59a9ff', 500: '#2b8cff', 600: '#116fe6', 700: '#0a57b4', 800: '#0b4890', 900: '#0d3a73' },
                        night: { 900: '#0a0c10', 800: '#0f131a', 700: '#141a22', 600: '#1a2230' }
                    },
                    boxShadow: {
                        glow: '0 0 0 1px rgba(59,130,246,.2), 0 8px 40px rgba(59,130,246,.15)',
                        neon: '0 0 25px rgba(43,140,255,.35), 0 0 60px rgba(43,140,255,.25)'
                    },
                    backgroundImage: {
                        'grid-radial': 'radial-gradient(circle at 20% 10%, rgba(43,140,255,.25), transparent 35%), radial-gradient(circle at 80% 20%, rgba(168,85,247,.2), transparent 35%), radial-gradient(circle at 50% 80%, rgba(16,185,129,.2), transparent 35%)'
                    }
                }
            }
        };
    </script>
    <script src="../config.js"></script>
    <script src="helpers.js"></script>
    <style>
        .glass {
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .glass-dark {
            background: rgba(20, 24, 32, 0.55);
            border-color: rgba(255, 255, 255, 0.08);
        }
    </style>
</head>

<body
    class="font-display bg-white text-slate-900 dark:bg-night-900 dark:text-slate-200 selection:bg-brand-200 selection:text-slate-900">
    <div aria-hidden="true" class="fixed inset-0 -z-10 bg-grid-radial opacity-70 dark:opacity-50"></div>

    <header
        class="sticky top-0 z-40 backdrop-blur supports-[backdrop-filter]:bg-white/70 dark:supports-[backdrop-filter]:bg-night-900/60 border-b border-black/5 dark:border-white/5">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
            <div class="flex h-16 items-center justify-between">
                <a href="../index.html" class="flex items-center gap-3 group">
                    <div
                        class="h-9 w-9 rounded-xl bg-gradient-to-br from-brand-400 via-brand-500 to-indigo-500 shadow-neon grid place-items-center text-white font-bold tracking-tight">
                        PX</div>
                    <div>
                        <p class="text-lg font-semibold leading-tight group-hover:text-brand-600">Pa[p]er X</p>
                        <p class="text-xs text-slate-500 dark:text-slate-400 -mt-1">Agentic AI for Indian syllabi</p>
                    </div>
                </a>
                <a id="backLink" href="batches.html"
                    class="inline-flex items-center gap-2 rounded-xl border border-slate-200/60 dark:border-white/10 px-3 py-1.5 text-sm hover:border-brand-400/60 transition"
                    title="Back to batches">
                    <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd"
                            d="M12.707 15.707a1 1 0 01-1.414 0L5.586 10l5.707-5.707a1 1 0 011.414 1.414L8.414 10l4.293 4.293a1 1 0 010 1.414z"
                            clip-rule="evenodd"></path>
                    </svg>
                    Back
                </a>
            </div>
        </div>
    </header>

    <main class="relative">
        <section class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8 pt-10 pb-20">
            <div class="flex flex-col gap-6">
                <div class="flex flex-col gap-2">
                    <nav id="breadcrumbs"
                        class="flex flex-wrap items-center gap-2 text-sm text-slate-500 dark:text-slate-400"
                        aria-label="breadcrumb"></nav>
                    <div>
                        <h1 id="pageTitle" class="text-3xl sm:text-4xl font-bold leading-tight">Subjects</h1>
                        <p id="pageSubtitle" class="mt-2 text-slate-600 dark:text-slate-300">Loading subjects…</p>
                    </div>
                </div>
            </div>

            <div class="mt-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
                <p id="batchDetails" class="text-sm text-slate-600 dark:text-slate-300"></p>
                <div class="flex items-center gap-3">
                    <label class="flex items-center gap-3 text-sm text-slate-600 dark:text-slate-300">
                        <span class="text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400">Filter by
                            semester</span>
                        <select id="semesterFilter"
                            class="rounded-xl border border-slate-200/60 dark:border-white/10 bg-white/80 dark:bg-night-800/70 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400/60">
                            <option value="">All semesters</option>
                        </select>
                    </label>
                    <button id="addSubjectBtn" type="button"
                        class="inline-flex items-center gap-2 rounded-xl border border-slate-200/60 dark:border-white/10 bg-white/70 dark:bg-night-800/70 px-4 py-2 text-sm font-medium text-slate-700 dark:text-slate-100 hover:border-brand-400/60 hover:shadow-glow transition">
                        <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                            <path fill-rule="evenodd"
                                d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"
                                clip-rule="evenodd"></path>
                        </svg>
                        Add subject
                    </button>
                </div>
            </div>

            <div id="results" class="mt-10 grid gap-6 sm:grid-cols-2 xl:grid-cols-3"></div>
        </section>
    </main>

    <div id="subjectModal" class="fixed inset-0 z-50 hidden flex items-center justify-center px-4 py-12 sm:px-6 lg:px-8"
        role="dialog" aria-modal="true" aria-labelledby="subjectModalTitle">
        <div id="subjectModalBackdrop" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm"></div>
        <div
            class="relative w-full max-w-2xl rounded-2xl border border-slate-200/60 dark:border-white/10 bg-white/90 dark:bg-night-900/90 shadow-xl">
            <div
                class="flex items-start justify-between gap-4 border-b border-slate-200/60 dark:border-white/10 px-6 py-5">
                <div>
                    <h2 id="subjectModalTitle" class="text-xl font-semibold text-slate-900 dark:text-slate-100">Add a
                        new
                        subject</h2>
                    <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">Define the course code, title, and
                        semester
                        for this syllabus course.</p>
                </div>
                <button id="subjectModalClose" type="button"
                    class="rounded-lg border border-transparent p-2 text-slate-500 hover:text-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-400/60">
                    <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd"
                            d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                            clip-rule="evenodd"></path>
                    </svg>
                </button>
            </div>
            <form id="subjectForm" class="space-y-5 px-6 py-6">
                <div class="grid gap-4 sm:grid-cols-2">
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-200">
                        Course code
                        <input id="subjectCourseCode" name="course_code" type="text" required
                            class="mt-2 w-full rounded-xl border border-slate-200/60 dark:border-white/10 bg-white/80 dark:bg-night-800/70 px-3 py-2 text-sm text-slate-900 dark:text-slate-100 focus:border-brand-400 focus:outline-none focus:ring-2 focus:ring-brand-300/60"
                            placeholder="e.g. CS301" maxlength="64" />
                    </label>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-200">
                        Semester
                        <select id="subjectSemester" name="semester" required
                            class="mt-2 w-full rounded-xl border border-slate-200/60 dark:border-white/10 bg-white/80 dark:bg-night-800/70 px-3 py-2 text-sm text-slate-900 dark:text-slate-100 focus:border-brand-400 focus:outline-none focus:ring-2 focus:ring-brand-300/60">
                        </select>
                    </label>
                </div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-200">
                    Subject title
                    <input id="subjectTitle" name="title" type="text" required
                        class="mt-2 w-full rounded-xl border border-slate-200/60 dark:border-white/10 bg-white/80 dark:bg-night-800/70 px-3 py-2 text-sm text-slate-900 dark:text-slate-100 focus:border-brand-400 focus:outline-none focus:ring-2 focus:ring-brand-300/60"
                        placeholder="e.g. Data Structures" maxlength="256" />
                </label>
                <p id="subjectModalMessage" class="hidden text-sm text-red-500"></p>
                <div class="flex items-center justify-end gap-3">
                    <button id="subjectModalCancel" type="button"
                        class="rounded-xl border border-slate-200/60 dark:border-white/10 px-4 py-2 text-sm text-slate-600 dark:text-slate-300 hover:border-brand-400/60 transition">Cancel</button>
                    <button id="subjectSubmitBtn" type="submit"
                        class="rounded-xl bg-gradient-to-r from-brand-500 to-indigo-500 px-4 py-2 text-sm font-semibold text-white shadow-neon hover:opacity-95 transition">Save
                        subject</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const params = Collage.parseQuery();
        const collegeId = params.collegeId;
        const collegeName = params.collegeName ? decodeURIComponent(params.collegeName) : '';
        const degreeId = params.degreeId;
        const degreeName = params.degreeName ? decodeURIComponent(params.degreeName) : '';
        const departmentName = params.departmentName ? decodeURIComponent(params.departmentName) : '';
        const batchId = params.batchId;
        const batchRange = params.batchRange ? decodeURIComponent(params.batchRange) : '';

        const results = document.getElementById('results');
        const titleEl = document.getElementById('pageTitle');
        const subtitleEl = document.getElementById('pageSubtitle');
        const breadcrumbsEl = document.getElementById('breadcrumbs');
        const backLink = document.getElementById('backLink');
        const batchDetails = document.getElementById('batchDetails');
        const semesterFilter = document.getElementById('semesterFilter');
        const addSubjectBtn = document.getElementById('addSubjectBtn');
        const subjectModal = document.getElementById('subjectModal');
        const subjectModalBackdrop = document.getElementById('subjectModalBackdrop');
        const subjectModalTitle = document.getElementById('subjectModalTitle');
        const subjectForm = document.getElementById('subjectForm');
        const subjectCourseCodeInput = document.getElementById('subjectCourseCode');
        const subjectSemesterInput = document.getElementById('subjectSemester');
        const subjectTitleInput = document.getElementById('subjectTitle');
        const subjectModalMessage = document.getElementById('subjectModalMessage');
        const subjectModalCancel = document.getElementById('subjectModalCancel');
        const subjectModalClose = document.getElementById('subjectModalClose');
        const subjectSubmitBtn = document.getElementById('subjectSubmitBtn');

        let coursesCache = [];
        let subjectModalMode = 'add';
        let editingCourseId = null;

        if (semesterFilter) {
            for (let i = 1; i <= 12; i += 1) {
                const option = document.createElement('option');
                option.value = String(i);
                option.textContent = `Semester ${i}`;
                semesterFilter.appendChild(option);
            }
        }

        if (subjectSemesterInput) {
            const placeholderOption = document.createElement('option');
            placeholderOption.value = '';
            placeholderOption.textContent = 'Select semester';
            subjectSemesterInput.appendChild(placeholderOption);
            for (let i = 1; i <= 12; i += 1) {
                const option = document.createElement('option');
                option.value = String(i);
                option.textContent = `Semester ${i}`;
                subjectSemesterInput.appendChild(option);
            }
            subjectSemesterInput.value = '';
        }

        if (backLink && collegeId && degreeId) {
            backLink.href = `batches.html?collegeId=${encodeURIComponent(collegeId)}&collegeName=${encodeURIComponent(collegeName || '')}&degreeId=${encodeURIComponent(degreeId || '')}&degreeName=${encodeURIComponent(degreeName || '')}&departmentName=${encodeURIComponent(departmentName || '')}`;
        }

        function makeBreadcrumb(items) {
            if (!Array.isArray(items)) return '';
            return items.map((item, idx) => {
                if (!item) return '';
                if (item.href && idx !== items.length - 1) {
                    return `<a href="${item.href}" class="hover:text-brand-600">${Collage.escapeHtml(item.label || item.text || '')}</a>`;
                }
                return `<span class="text-slate-700 dark:text-slate-200">${Collage.escapeHtml(item.label || item.text || '')}</span>`;
            }).filter(Boolean).join('<span class="text-slate-400 dark:text-slate-500">/</span>');
        }

        function showLoader() {
            results.innerHTML = `
        <div class="col-span-full flex items-center justify-center py-16">
          <div class="h-12 w-12 animate-spin rounded-full border-2 border-brand-400 border-t-transparent"></div>
        </div>`;
        }

        function showError(message) {
            results.innerHTML = `
        <div class="col-span-full rounded-2xl border border-red-500/40 bg-red-50/90 dark:bg-red-500/10 dark:border-red-400/30 p-6 shadow">
          <h2 class="text-lg font-semibold text-red-700 dark:text-red-200">Unable to load subjects</h2>
          <p class="mt-2 text-sm text-red-600/80 dark:text-red-200/80">${Collage.escapeHtml(message || 'Please check the batch reference and try again.')}</p>
        </div>`;
        }

        function showEmpty() {
            results.innerHTML = `
        <div class="col-span-full rounded-2xl border border-slate-200/60 dark:border-white/10 bg-white/70 dark:bg-night-800/70 p-6 shadow">
          <h2 class="text-lg font-semibold">No subjects recorded</h2>
          <p class="mt-2 text-sm text-slate-600 dark:text-slate-300">Use the “Add subject” button to record syllabus courses for this batch.</p>
        </div>`;
        }

        function resetSubjectModal() {
            subjectForm?.reset();
            if (subjectSemesterInput) {
                subjectSemesterInput.value = '';
            }
            subjectModalMessage.textContent = '';
            subjectModalMessage.classList.add('hidden');
            subjectModalMode = 'add';
            editingCourseId = null;
            if (subjectSubmitBtn) {
                subjectSubmitBtn.disabled = false;
                subjectSubmitBtn.textContent = 'Save subject';
            }
        }

        function setSubjectModalLoading(isLoading) {
            if (!subjectSubmitBtn) return;
            subjectSubmitBtn.disabled = isLoading;
            subjectSubmitBtn.textContent = isLoading
                ? 'Saving…'
                : (subjectModalMode === 'edit' ? 'Save changes' : 'Save subject');
        }

        function closeSubjectModal() {
            subjectModal?.classList.add('hidden');
            document.body.classList.remove('overflow-hidden');
            resetSubjectModal();
        }

        function openSubjectModal(mode = 'add', course) {
            if (!batchId) return;
            resetSubjectModal();
            subjectModalMode = mode;

            let defaultSemester = semesterFilter?.value ? Number(semesterFilter.value) : null;

            if (mode === 'edit' && course) {
                editingCourseId = course.id;
                subjectCourseCodeInput.value = course.course_code || '';
                subjectTitleInput.value = course.title || '';
                if (course.semester) {
                    defaultSemester = course.semester;
                }
            }

            if (subjectSemesterInput) {
                const targetValue = defaultSemester ? String(defaultSemester) : '';
                if (targetValue && subjectSemesterInput.querySelector(`option[value="${targetValue}"]`)) {
                    subjectSemesterInput.value = targetValue;
                } else if (subjectSemesterInput.querySelector('option[value="1"]')) {
                    subjectSemesterInput.value = '1';
                } else {
                    subjectSemesterInput.value = '';
                }
            }

            const batchLabel = batchRange || 'this batch';
            subjectModalTitle.textContent = mode === 'edit'
                ? 'Edit subject'
                : `Add a new subject for ${batchLabel}`;
            subjectSubmitBtn.textContent = mode === 'edit' ? 'Save changes' : 'Save subject';

            subjectModal.classList.remove('hidden');
            document.body.classList.add('overflow-hidden');
            setTimeout(() => {
                subjectCourseCodeInput?.focus();
                if (mode === 'edit') {
                    subjectCourseCodeInput?.select();
                }
            }, 100);
        }

        async function handleSubjectSubmit(event) {
            event.preventDefault();
            if (!batchId) {
                subjectModalMessage.textContent = 'Missing batch context. Please navigate from the batches page again.';
                subjectModalMessage.classList.remove('hidden');
                return;
            }

            const rawCode = subjectCourseCodeInput.value.trim();
            const semesterValue = subjectSemesterInput.value;
            const rawTitle = subjectTitleInput.value.trim();
            const semesterNumber = Number.parseInt(semesterValue, 10);

            if (!rawCode) {
                subjectModalMessage.textContent = 'Enter a course code.';
                subjectModalMessage.classList.remove('hidden');
                subjectCourseCodeInput.focus();
                return;
            }
            if (!semesterValue || Number.isNaN(semesterNumber)) {
                subjectModalMessage.textContent = 'Select a valid semester.';
                subjectModalMessage.classList.remove('hidden');
                subjectSemesterInput.focus();
                return;
            }
            if (!rawTitle) {
                subjectModalMessage.textContent = 'Enter a subject title.';
                subjectModalMessage.classList.remove('hidden');
                subjectTitleInput.focus();
                return;
            }

            subjectModalMessage.classList.add('hidden');

            const payload = {
                course_code: rawCode.toUpperCase(),
                semester: semesterNumber,
                title: rawTitle,
            };

            setSubjectModalLoading(true);

            try {
                if (subjectModalMode === 'edit' && editingCourseId) {
                    await Collage.fetchJson(`/api/syllabus/courses/${editingCourseId}`, {
                        method: 'PUT',
                        body: payload,
                        skipAuth: true,
                    });
                } else {
                    await Collage.fetchJson(`/api/batches/${batchId}/courses`, {
                        method: 'POST',
                        body: payload,
                        skipAuth: true,
                    });
                }
                closeSubjectModal();
                await loadSubjects();
            } catch (error) {
                let message = error?.message ?? 'Unable to save subject. Please try again.';
                if (typeof message !== 'string') {
                    try {
                        message = JSON.stringify(message);
                    } catch (_) {
                        message = 'Unable to save subject. Please try again.';
                    }
                }
                if (message === '[object Object]') {
                    message = 'Unexpected response from server. Please try again.';
                }
                subjectModalMessage.textContent = message;
                subjectModalMessage.classList.remove('hidden');
                console.error(error);
            } finally {
                setSubjectModalLoading(false);
            }
        }

        function initSubjectModal() {
            if (!addSubjectBtn) return;
            if (!batchId) {
                addSubjectBtn.disabled = true;
                addSubjectBtn.classList.add('opacity-60', 'cursor-not-allowed');
            }
            addSubjectBtn.addEventListener('click', () => openSubjectModal('add'));
            subjectModalCancel?.addEventListener('click', closeSubjectModal);
            subjectModalClose?.addEventListener('click', closeSubjectModal);
            subjectModalBackdrop?.addEventListener('click', closeSubjectModal);
            subjectForm?.addEventListener('submit', handleSubjectSubmit);
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && !subjectModal.classList.contains('hidden')) {
                    closeSubjectModal();
                }
            });
        }

        function attachSubjectEditHandlers() {
            const editButtons = results.querySelectorAll('[data-course-edit]');
            editButtons.forEach((button) => {
                button.addEventListener('click', (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    const id = button.getAttribute('data-course-edit');
                    const course = coursesCache.find((item) => String(item.id) === String(id));
                    if (course) {
                        openSubjectModal('edit', course);
                    }
                });
            });
        }

        function attachSubjectCardNavigation() {
            const cards = results.querySelectorAll('[data-course-card]');
            cards.forEach((card) => {
                const href = card.getAttribute('data-course-card');
                if (!href) return;
                card.addEventListener('click', (event) => {
                    if (event.target.closest('[data-course-edit]')) {
                        return;
                    }
                    if (event.target.closest('a')) {
                        return;
                    }
                    window.location.href = href;
                });
                card.addEventListener('keydown', (event) => {
                    if ((event.key === 'Enter' || event.key === ' ') && !event.target.closest('[data-course-edit]')) {
                        event.preventDefault();
                        window.location.href = href;
                    }
                });
            });
        }

        async function loadSubjects() {
            if (!batchId) {
                showError('Missing batchId in URL.');
                return;
            }
            showLoader();
            const selectedSemester = semesterFilter?.value ? Number(semesterFilter.value) : null;
            try {
                const query = selectedSemester ? `?semester=${selectedSemester}` : '';
                const data = await Collage.fetchJson(`/api/batches/${batchId}/courses${query}`, { skipAuth: true });
                const list = Array.isArray(data) ? data : [];
                coursesCache = list.map((course) => ({
                    id: course.id,
                    batch_id: course.batch_id,
                    semester: Number(course.semester),
                    course_code: course.course_code || '',
                    title: course.title || '',
                }));
                titleEl.textContent = `Subjects for ${departmentName || 'Department'} · ${batchRange || batchId}`;
                subtitleEl.textContent = `${list.length} subject${list.length === 1 ? '' : 's'} found${selectedSemester ? ` in semester ${selectedSemester}` : ''}.`;
                batchDetails.textContent = `${collegeName || 'College'} • ${degreeName || 'Degree'} • ${departmentName || 'Department'} • ${batchRange || ''}`;
                breadcrumbsEl.innerHTML = makeBreadcrumb([
                    { label: 'Colleges', href: 'clg_info.html' },
                    { label: collegeName || 'College', href: `degrees.html?collegeId=${encodeURIComponent(collegeId || '')}&collegeName=${encodeURIComponent(collegeName || '')}` },
                    { label: degreeName || 'Degree', href: `departments.html?collegeId=${encodeURIComponent(collegeId || '')}&collegeName=${encodeURIComponent(collegeName || '')}&degreeId=${encodeURIComponent(degreeId || '')}&degreeName=${encodeURIComponent(degreeName || '')}` },
                    { label: departmentName || 'Department', href: `batches.html?collegeId=${encodeURIComponent(collegeId || '')}&collegeName=${encodeURIComponent(collegeName || '')}&degreeId=${encodeURIComponent(degreeId || '')}&degreeName=${encodeURIComponent(degreeName || '')}&departmentName=${encodeURIComponent(departmentName || '')}` },
                    { label: batchRange || 'Batch' }
                ]);
                if (!list.length) {
                    showEmpty();
                    return;
                }
                const accentPalette = [
                    'from-brand-400 via-brand-500 to-indigo-500',
                    'from-emerald-400 via-teal-400 to-emerald-600',
                    'from-fuchsia-400 via-pink-500 to-rose-500',
                    'from-cyan-400 via-sky-500 to-blue-500',
                    'from-amber-400 via-orange-500 to-amber-600'
                ];
                results.innerHTML = list.map((course, index) => {
                    const link = `syllabus.html?courseId=${encodeURIComponent(course.id)}&courseCode=${encodeURIComponent(course.course_code || '')}&courseTitle=${encodeURIComponent(course.title || '')}&semester=${encodeURIComponent(course.semester)}&batchRange=${encodeURIComponent(batchRange || '')}&collegeName=${encodeURIComponent(collegeName || '')}&degreeName=${encodeURIComponent(degreeName || '')}&departmentName=${encodeURIComponent(departmentName || '')}`;
                    const accentColor = accentPalette[index % accentPalette.length];
                    return `
            <article class="group relative overflow-hidden rounded-2xl border border-slate-200/60 dark:border-white/10 bg-white/70 dark:bg-night-800/70 p-6 shadow transition hover:border-brand-400/60 hover:shadow-glow focus-within:border-brand-400/60 focus-within:shadow-glow" data-course-card="${link}" tabindex="0">
              <div class="absolute inset-x-4 top-4 h-28 rounded-xl bg-gradient-to-r ${accentColor} opacity-20 blur-2xl"></div>
              <button type="button" data-course-edit="${course.id}" aria-label="Edit subject ${Collage.escapeHtml(course.course_code || 'Course')}"
                class="absolute top-4 right-4 z-20 inline-flex items-center justify-center rounded-full border border-white/20 bg-white/70 dark:bg-night-800/70 p-2 text-slate-500 hover:text-brand-500 hover:border-brand-400/60 transition">
                <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                  <path d="M17.414 2.586a2 2 0 00-2.828 0L6.414 10.758a2 2 0 00-.516.878l-.8 2.798a1 1 0 001.226 1.226l2.798-.8a2 2 0 00.878-.516l8.172-8.172a2 2 0 000-2.828l-.758-.758zm-3.535 1.414L15 5.536 13.536 7 12 5.464l1.879-1.879zM11.293 6.172L3.707 13.758l-.353 1.237 1.237-.353 7.586-7.586L11.293 6.172z" />
                </svg>
              </button>
              <div class="relative flex flex-wrap items-center gap-2 text-xs text-slate-500 dark:text-slate-400">
                <span class="inline-flex items-center gap-2 rounded-full border border-white/20 bg-white/40 px-3 py-1 text-xs text-slate-700 dark:text-slate-200">${Collage.escapeHtml(course.course_code || 'Course')}</span>
                <span class="inline-flex items-center gap-2 rounded-full border border-white/20 bg-white/40 px-3 py-1 text-xs text-slate-700 dark:text-slate-200">Semester ${course.semester}</span>
              </div>
              <h2 class="relative mt-5 text-xl font-semibold text-slate-900 dark:text-white group-hover:text-brand-500">
                <a href="${link}" class="relative inline-flex items-center gap-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-400/60 focus:ring-offset-2 focus:ring-offset-white dark:focus:ring-offset-night-900">
                  ${Collage.escapeHtml(course.title || 'Untitled subject')}
                  <svg class="h-4 w-4 text-brand-500 opacity-0 group-hover:opacity-100 transition" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l5 5a1 1 0 010 1.414l-5 5a1 1 0 01-1.414-1.414L13.586 11H4a1 1 0 110-2h9.586l-3.293-3.293a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                  </svg>
                </a>
              </h2>
              <p class="relative mt-3 text-sm text-slate-600 dark:text-slate-300">Open to review the detailed units and topics for this subject.</p>
              <a class="relative mt-6 inline-flex items-center gap-2 text-sm text-brand-600 dark:text-brand-300" href="${link}">
                View syllabus
                <svg class="h-4 w-4 transition group-hover:translate-x-1" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                  <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l5 5a1 1 0 010 1.414l-5 5a1 1 0 01-1.414-1.414L13.586 11H4a1 1 0 110-2h9.586l-3.293-3.293a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                </svg>
              </a>
            </article>`;
                }).join('');
                attachSubjectEditHandlers();
                attachSubjectCardNavigation();
            } catch (err) {
                console.error(err);
                showError(err.message || 'Unexpected error');
            }
        }

        semesterFilter?.addEventListener('change', loadSubjects);
        document.addEventListener('DOMContentLoaded', () => {
            initSubjectModal();
            loadSubjects();
        });
    </script>
</body>

</html>
