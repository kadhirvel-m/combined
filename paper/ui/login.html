<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In — Pa[p]er X</title>
  <meta name="description" content="Sign in to Pa[p]er X. Matches the homepage theme and components." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { display: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          colors: {
            brand: { 50: '#f0f7ff', 100: '#e0efff', 200: '#b9dbff', 300: '#8ac4ff', 400: '#59a9ff', 500: '#2b8cff', 600: '#116fe6', 700: '#0a57b4', 800: '#0b4890', 900: '#0d3a73' },
            night: { 900: '#0a0c10', 800: '#0f131a', 700: '#141a22', 600: '#1a2230' }
          },
          boxShadow: { glow: '0 0 0 1px rgba(59,130,246,.2), 0 8px 40px rgba(59,130,246,.15)', neon: '0 0 25px rgba(43,140,255,.35), 0 0 60px rgba(43,140,255,.25)' },
          backgroundImage: { 'grid-radial': 'radial-gradient(circle at 20% 10%, rgba(43,140,255,.25), transparent 35%), radial-gradient(circle at 80% 20%, rgba(168,85,247,.2), transparent 35%), radial-gradient(circle at 50% 80%, rgba(16,185,129,.2), transparent 35%)' }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    .glass {
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .12)
    }

    .glass-dark {
      background: rgba(20, 24, 32, .55);
      border-color: rgba(255, 255, 255, .08)
    }
  </style>
</head>

<body
  class="font-display bg-white text-slate-900 dark:bg-night-900 dark:text-slate-200 selection:bg-brand-200 selection:text-slate-900">
  <div aria-hidden="true" class="fixed inset-0 -z-10 bg-grid-radial opacity-70 dark:opacity-50"></div>
  <header
    class="sticky top-0 z-50 backdrop-blur supports-[backdrop-filter]:bg-white/60 dark:supports-[backdrop-filter]:bg-night-900/50 border-b border-black/5 dark:border-white/5">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <div class="flex h-16 items-center justify-between">
        <a href="index.html" class="flex items-center gap-3 group">
          <div
            class="h-9 w-9 rounded-xl bg-gradient-to-br from-brand-400 via-brand-500 to-indigo-500 shadow-neon grid place-items-center text-white font-bold tracking-tight">
            PX</div>
          <div>
            <p class="text-lg font-semibold leading-tight group-hover:text-brand-600">Pa[p]er X</p>
            <p class="text-xs text-slate-500 dark:text-slate-400 -mt-1">Agentic AI for Indian syllabi</p>
          </div>
        </a>
      </div>
    </div>
  </header>

  <main class="relative">
    <section class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8 pt-10 pb-20">
      <div class="grid lg:grid-cols-12 gap-10 items-start">
        <div class="lg:col-span-5">
          <div
            class="inline-flex items-center gap-2 rounded-full border border-white/20 bg-white/60 dark:bg-night-800/60 px-3 py-1 text-xs text-slate-700 dark:text-slate-300 backdrop-blur">
            <span class="h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span>
            Welcome back
          </div>
          <h1 class="mt-4 text-3xl sm:text-4xl font-extrabold leading-tight">Sign in to <span
              class="bg-gradient-to-r from-brand-500 via-indigo-500 to-fuchsia-500 bg-clip-text text-transparent">Pa[p]er
              X</span></h1>
          <p class="mt-3 text-slate-600 dark:text-slate-300">Use your email and password.</p>
        </div>
        <div class="lg:col-span-7">
          <div
            class="relative rounded-2xl glass glass-dark p-6 md:p-8 shadow-neon border border-white/10 bg-white/80 dark:bg-night-800/70">
            <form id="loginForm" class="grid gap-6" novalidate>
              <label class="grid gap-1">
                <span class="text-sm text-slate-700 dark:text-slate-300">Email</span>
                <input required name="email" type="email" autocomplete="email" placeholder="you@college.edu"
                  class="rounded-lg border border-slate-200/60 dark:border-white/10 bg-white/80 dark:bg-night-800/70 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-400/60 w-full" />
              </label>
              <label class="grid gap-1 relative">
                <span class="text-sm text-slate-700 dark:text-slate-300">Password</span>
                <input required name="password" id="pwd" minlength="6" type="password" placeholder="Your password"
                  class="rounded-lg border border-slate-200/60 dark:border-white/10 bg-white/70 dark:bg-night-800/70 px-3 py-2 pr-10 focus:outline-none focus:ring-2 focus:ring-brand-400/60" />
                <button type="button" id="togglePwd" class="absolute right-2 top-9 text-slate-500 hover:text-brand-600"
                  aria-label="Show password">
                  <svg id="eye" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 5c-7 0-11 7-11 7s4 7 11 7 11-7 11-7-4-7-11-7Zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10Z" />
                  </svg>
                </button>
              </label>
              <button type="submit" id="submitBtn"
                class="rounded-xl bg-gradient-to-r from-brand-500 to-indigo-500 px-5 py-2.5 text-white shadow-neon">Sign
                in</button>

              <div class="relative text-center">
                <div class="absolute inset-0 flex items-center" aria-hidden="true">
                  <div class="w-full border-t border-slate-200/60 dark:border-white/10"></div>
                </div>
                <div
                  class="relative inline-block bg-white dark:bg-night-800 px-2 text-xs text-slate-500 dark:text-slate-400">
                  or</div>
              </div>

              <button type="button" id="googleBtn"
                class="inline-flex items-center justify-center gap-2 rounded-xl border border-slate-200/60 dark:border-white/10 px-5 py-2.5 hover:border-brand-400/60">
                <img alt="Google" src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                  class="h-5 w-5" />
                Continue with Google
              </button>
              <div id="status"
                class="hidden rounded-lg bg-white/70 dark:bg-night-800/70 border border-slate-200/60 dark:border-white/10 p-3 font-mono text-[12px] text-slate-700 dark:text-slate-300">
              </div>
              <p class="text-xs text-slate-500 dark:text-slate-400">Don’t have an account? <a
                  class="underline decoration-dotted hover:text-brand-600" href="signup.html">Create one</a></p>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const themeToggle = null; // optional; consistent with other pages if you add
    const apiBase = (window.API_BASE || 'http://localhost:8000').replace(/\/$/, '');
    const toggle = document.getElementById('togglePwd');
    toggle?.addEventListener('click', () => {
      const pwd = document.getElementById('pwd');
      pwd.type = pwd.type === 'password' ? 'text' : 'password';
      toggle.setAttribute('aria-label', pwd.type === 'password' ? 'Show password' : 'Hide password');
    });

    const form = document.getElementById('loginForm');
    const status = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');
    const googleBtn = document.getElementById('googleBtn');
    let supabaseClient = null;

    async function ensureSupabase() {
      if (supabaseClient) return supabaseClient;
      try {
        const cfg = await fetch(`${apiBase}/api/public/supabase`).then(r => r.json());
        if (!cfg?.url || !cfg?.anonKey) throw new Error('Missing Supabase config');
        supabaseClient = window.supabase.createClient(cfg.url, cfg.anonKey);
        return supabaseClient;
      } catch (e) {
        console.error('Supabase init failed', e);
        throw e;
      }
    }

    async function handleHashSession() {
      // Handle OAuth redirect hash (access_token in URL)
      if (!location.hash.includes('access_token')) return;
      const hash = new URLSearchParams(location.hash.slice(1));
      const token = hash.get('access_token');
      if (token) {
        try { localStorage.setItem('px_token', token); } catch { }
        // Clean the hash
        history.replaceState(null, document.title, location.pathname + location.search);
        // Ensure a minimal profile exists, then take user to profile edit
        try {
          await fetch(`${apiBase}/api/profile/me`, { headers: { Authorization: `Bearer ${token}` } });
        } catch { /* ignore */ }
        location.href = 'profile_edit.html';
      }
    }

    handleHashSession();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      status.classList.remove('hidden');
      status.textContent = '';
      if (!form.reportValidity()) return;
      const fd = new FormData(form);
      const payload = { email: fd.get('email'), password: fd.get('password') };
      submitBtn.disabled = true; submitBtn.textContent = 'Signing in…';
      try {
        const res = await fetch(`${apiBase}/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        const out = await res.json().catch(() => ({}));
        if (!res.ok) {
          status.textContent = `❌ ${out?.detail || out?.message || 'Login failed.'}`;
          return;
        }
        if (out.access_token) {
          try { localStorage.setItem('px_token', out.access_token); } catch { }
        }
        status.textContent = '✔ Signed in. Redirecting…';
        setTimeout(() => { window.location.href = 'profile.html'; }, 400);
      } catch (err) {
        status.textContent = '❌ Network error. Please try again.';
      } finally {
        submitBtn.disabled = false; submitBtn.textContent = 'Sign in';
      }
    });

    googleBtn?.addEventListener('click', async () => {
      status.classList.remove('hidden');
      status.textContent = 'Redirecting to Google…';
      try {
        const sb = await ensureSupabase();
        const redirectTo = `${location.origin}${location.pathname}`; // back to login page
        const { data, error } = await sb.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo }
        });
        if (error) throw error;
        // On success, browser will redirect. The handler above will capture the token.
      } catch (err) {
        console.error(err);
        status.textContent = `❌ Google sign-in failed.`;
      }
    });
  </script>
</body>

</html>
