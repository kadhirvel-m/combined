<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop Jobs — PaperX</title>
  <link rel="stylesheet" href="../../assets/css/tailwind.css" />
  <script src="../../config.js"></script>
  <script src="../../auth.js" defer></script>
</head>

<body class="min-h-screen font-sans antialiased text-neutral-900 dark:text-white bg-hero-light dark:bg-hero-dark">
  <header
    class="sticky top-0 z-40 bg-white/70 dark:bg-brand-900/60 backdrop-blur border-b border-black/5 dark:border-white/10">
    <div class="container flex items-center justify-between py-3">
      <h1 class="text-lg font-bold">Jobs Board</h1>
      <div class="text-sm opacity-80">New | In Progress | Ready | Completed</div>
    </div>
  </header>
  <main class="container py-6">
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4" id="list"></div>
    <div id="empty" class="hidden text-sm opacity-70">No jobs.</div>
  </main>
  <script>
    function $(s) { return document.querySelector(s) }
    function getToken() { try { return localStorage.getItem('px_token'); } catch { return null; } }
    function btn(label, handler, variant) { const b = document.createElement('button'); b.textContent = label; b.className = 'px-2 py-1 rounded-md text-[12px] ' + (variant || 'ring-1 ring-black/10 dark:ring-white/15'); b.addEventListener('click', handler); return b; }
    function card(j) {
      const wrap = document.createElement('div'); wrap.className = 'rounded-2xl glass ring-1 ring-black/5 dark:ring-white/10 p-4 space-y-2';
      wrap.innerHTML = `<div class='flex items-start justify-between'><div><div class='font-semibold'>${j.id}</div><div class='text-[12px] opacity-70'>${j.status || ''} • ${j.estimated_pages || '?'} pages × ${(j.settings && j.settings.copies) || 1}</div></div><div class='text-[11px] opacity-70'>${(j.created_at || '').replace('T', ' ').slice(0, 16)}</div></div>`;
      const actions = document.createElement('div'); actions.className = 'flex items-center gap-2';
      const API = (window.API_BASE || '');
      // If job came from a marketplace note, show quick Preview/Download
      if (j.marketplace_note_id) {
        const pv = document.createElement('a'); pv.textContent = 'Preview'; pv.href = `${API}/api/marketplace/notes/${encodeURIComponent(j.marketplace_note_id)}/preview`; pv.target = '_blank'; pv.className = 'px-2 py-1 rounded-md text-[12px] ring-1 ring-black/10 dark:ring-white/15'; actions.appendChild(pv);
        const dl = document.createElement('a'); dl.textContent = 'Download'; dl.href = `${API}/api/marketplace/notes/${encodeURIComponent(j.marketplace_note_id)}/download`; dl.className = 'px-2 py-1 rounded-md text-[12px] ring-1 ring-black/10 dark:ring-white/15'; actions.appendChild(dl);
      }
      if (j.status === 'submitted') actions.appendChild(btn('Accept', () => act('accept'))), actions.appendChild(btn('Reject', () => act('reject'), 'text-red-600 ring-1 ring-red-600/40'));
      if (j.status === 'accepted') actions.appendChild(btn('Mark Printing', () => act('printing')));
      if (j.status === 'printing') actions.appendChild(btn('Mark Ready', () => act('ready')));
      if (j.status === 'ready') { const i = document.createElement('input'); i.placeholder = 'OTP'; i.className = 'px-2 py-1 text-[12px] rounded-md ring-1 ring-black/10 dark:ring-white/15'; actions.appendChild(i); actions.appendChild(btn('Release', () => act('release', i.value), 'bg-brand-500/90 text-white')); }
      wrap.appendChild(actions);
      async function act(kind, otp) {
        const token = (window.getToken && window.getToken()); const hdr = token ? { Authorization: 'Bearer ' + token } : {};
        let ep = kind; if (kind === 'release') ep = 'release';
        const body = kind === 'release' ? JSON.stringify({ otp: String(otp || '') }) : undefined;
        const r = await fetch(`${API}/api/shop/jobs/${encodeURIComponent(j.id)}/${ep}`, { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, hdr), body });
        if (r.ok) load(); else alert('Action failed');
      }
      return wrap;
    }
    async function load() {
      const token = (window.getToken && window.getToken()) || getToken(); const hdr = token ? { Authorization: 'Bearer ' + token } : {};
      const r = await fetch((window.API_BASE || '') + '/api/shop/jobs', { headers: hdr }).catch(() => null);
      const jobs = r && r.ok ? ((await r.json()).jobs || []) : [];
      const wrap = $('#list'); wrap.innerHTML = ''; jobs.forEach(j => wrap.appendChild(card(j))); $('#empty').classList.toggle('hidden', jobs.length > 0);
    }
    document.addEventListener('DOMContentLoaded', load);
  </script>
</body>

</html>
