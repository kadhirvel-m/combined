<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Slide Generator — PaperX</title>
    <meta name="description"
        content="Generate stunning presentation slides with AI. Just provide a title and let Gemini do the rest." />
    <link rel="icon" type="image/x-icon" href="../assets/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,0,0"
        rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/tailwind.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../config.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                container: { center: true, padding: '1rem' },
                extend: {
                    fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
                    colors: {
                        brand: { 900: '#1E1E2F', 700: '#4C2A59', 500: '#9E4B8A' },
                        brandlt: { 50: '#FAF5FB', 100: '#F3E7F2', 200: '#E7D0E4', 300: '#D9B4D3', 400: '#C88DBA', 500: '#9E4B8A', 700: '#4C2A59', 900: '#1E1E2F' },
                        ink: '#1E1E2F', plum: '#4C2A59', orchid: '#9E4B8A',
                    },
                    boxShadow: {
                        glow: '0 8px 30px rgba(158,75,138,0.35)',
                        soft: '0 10px 30px rgba(0,0,0,0.25)',
                    },
                }
            }
        }
    </script>
    <script>
            (() => {
                const stored = localStorage.getItem('px_theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (stored ? stored === 'dark' : prefersDark) document.documentElement.classList.add('dark');
            })();
    </script>

    <style>
        .material-symbols-rounded {
            vertical-align: -6px;
        }

        /* Gradient text */
        .gradient-text {
            display: inline-block;
            background-image: linear-gradient(90deg, #1E1E2F, #4C2A59, #9E4B8A, #4C2A59, #1E1E2F);
            background-size: 200% 200%;
            animation: gshift 4s ease-in-out infinite;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .dark .gradient-text {
            background-image: linear-gradient(90deg, #EFA3DC, #CA6CB3, #FFFFFF, #CA6CB3, #EFA3DC);
        }

        @keyframes gshift {
            0% {
                background-position: 0% 50%
            }

            50% {
                background-position: 100% 50%
            }

            100% {
                background-position: 0% 50%
            }
        }

        /* Dark body */
        .dark body {
            background-image: linear-gradient(to left top, #1e1e2f, #242138, #2b2440, #332649, #3d2850, #3f254a, #402244, #401f3e, #34182d, #26131e, #190b11, #000000);
            background-repeat: no-repeat;
            background-size: cover;
        }

        /* Glass */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
        }

        .dark .glass {
            background: rgba(30, 30, 47, 0.55);
            border-color: rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* Skeleton shimmer */
        .skeleton {
            background: linear-gradient(90deg, rgba(0, 0, 0, 0.06) 25%, rgba(0, 0, 0, 0.1) 50%, rgba(0, 0, 0, 0.06) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 12px;
        }

        .dark .skeleton {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.04) 25%, rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0.04) 75%);
            background-size: 200% 100%;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0
            }

            100% {
                background-position: -200% 0
            }
        }

        /* Slide card */
        .slide-card {
            aspect-ratio: 16/9;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .slide-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 60px rgba(158, 75, 138, 0.2);
        }

        .slide-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Slide number badge */
        .slide-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(158, 75, 138, 0.85);
            color: #fff;
            font-weight: 700;
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 999px;
            backdrop-filter: blur(6px);
            z-index: 2;
        }

        /* Download overlay */
        .slide-dl-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.25s ease;
            z-index: 3;
        }

        .slide-card:hover .slide-dl-overlay {
            opacity: 1;
        }

        /* Spin */
        .spin {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(158, 75, 138, 0.2);
            border-top-color: #9E4B8A;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Progress bar */
        .progress-fill {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #9E4B8A, #CA6CB3);
            transition: width 0.5s ease;
        }

        /* Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            animation: orb-float 12s infinite alternate ease-in-out;
            pointer-events: none;
        }

        @keyframes orb-float {
            0% {
                transform: translate(0, 0) scale(1)
            }

            100% {
                transform: translate(30px, -30px) scale(1.15)
            }
        }

        /* Generating pulse */
        .gen-pulse {
            animation: gpulse 2s infinite ease-in-out;
        }

        @keyframes gpulse {

            0%,
            100% {
                opacity: 0.5;
                transform: scale(0.95)
            }

            50% {
                opacity: 1;
                transform: scale(1)
            }
        }

        /* Input styling */
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1.5px solid rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            font-weight: 500;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .form-input:focus {
            border-color: #9E4B8A;
            box-shadow: 0 0 0 3px rgba(158, 75, 138, 0.15);
        }

        .dark .form-input {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .dark .form-input:focus {
            border-color: #CA6CB3;
            box-shadow: 0 0 0 3px rgba(202, 108, 179, 0.2);
        }

        textarea.form-input {
            resize: vertical;
            min-height: 80px;
        }
    </style>
</head>

<body
    class="min-h-screen font-sans antialiased text-neutral-900 dark:text-white bg-white dark:bg-brand-900 transition-colors">

    <!-- Decorative orbs -->
    <div class="orb w-72 h-72 bg-brand-500/30 -top-20 right-10 fixed"></div>
    <div class="orb w-96 h-96 bg-brand-700/25 top-40 -left-32 fixed" style="animation-delay:4s"></div>

    <!-- ═══ NAVBAR ═══ -->
    <header
        class="sticky top-0 z-40 bg-white/70 dark:bg-brand-900/60 backdrop-blur border-b border-black/5 dark:border-white/10">
        <div class="container flex items-center justify-between py-4 max-w-7xl">
            <a href="../index.html" class="flex items-center gap-3" aria-label="PaperX Home">
                <img src="../assets/img/logo-light.svg" alt="PaperX" class="h-9 w-auto dark:hidden">
                <img src="../assets/img/logo-dark.svg" alt="PaperX" class="h-9 w-auto hidden dark:block">
                <span
                    class="hidden sm:inline-flex items-center rounded-full px-2.5 py-0.5 text-[11px] font-bold bg-gradient-to-r from-brand-500 to-brand-700 text-white">PPT</span>
            </a>
            <div class="flex items-center gap-2">
                <button data-theme-toggle
                    class="inline-flex items-center gap-2 rounded-full px-3 py-2 text-sm ring-1 ring-black/10 dark:ring-white/15 hover:bg-black/5 dark:hover:bg-white/5 transition"
                    aria-label="Toggle theme">
                    <span id="themeIcon" class="material-symbols-rounded text-[20px]">dark_mode</span>
                    <span class="hidden sm:block text-xs font-medium">Theme</span>
                </button>
            </div>
        </div>
    </header>

    <main class="relative">

        <!-- ═══ HERO / INPUT SECTION ═══ -->
        <section class="py-12 md:py-16 border-b border-black/5 dark:border-white/10">
            <div class="container max-w-3xl text-center">
                <div
                    class="inline-flex items-center gap-2 rounded-full px-3 py-1 text-xs font-semibold bg-brand-500/10 text-brand-500 dark:bg-brand-500/20 dark:text-brandlt-300 mb-4">
                    <span class="material-symbols-rounded text-sm">auto_awesome</span>
                    AI-Powered
                </div>
                <h1 class="text-3xl sm:text-4xl md:text-5xl font-black leading-tight mb-3">
                    <span class="gradient-text">Slide Generator</span>
                </h1>
                <p class="text-neutral-500 dark:text-white/50 text-sm md:text-base mb-8 max-w-xl mx-auto">
                    Give a title, get a full presentation. Each slide is individually crafted as an image by Gemini AI.
                </p>

                <!-- Form -->
                <div class="glass rounded-3xl p-6 md:p-8 text-left max-w-2xl mx-auto">
                    <div class="space-y-4">
                        <div>
                            <label class="text-sm font-bold mb-1.5 block flex items-center gap-2">
                                <span class="material-symbols-rounded text-brand-500 text-lg">title</span>
                                Presentation Title <span class="text-red-400">*</span>
                            </label>
                            <input type="text" id="pptTitle" class="form-input"
                                placeholder="e.g. Introduction to Machine Learning" maxlength="200" autofocus>
                        </div>
                        <div>
                            <label class="text-sm font-bold mb-1.5 block flex items-center gap-2">
                                <span class="material-symbols-rounded text-brand-500 text-lg">description</span>
                                Description <span class="text-neutral-400 font-normal">(optional)</span>
                            </label>
                            <textarea id="pptDesc" class="form-input"
                                placeholder="Paste any additional context, notes, or description you want the AI to use..."
                                rows="3"></textarea>
                        </div>
                        <div>
                            <label class="text-sm font-bold mb-1.5 block flex items-center gap-2">
                                <span class="material-symbols-rounded text-brand-500 text-lg">view_carousel</span>
                                Number of Slides
                            </label>
                            <div class="flex items-center gap-3">
                                <input type="range" id="pptCount" min="1" max="12" value="6"
                                    class="flex-1 accent-brand-500 h-2 rounded-full"
                                    oninput="document.getElementById('countLabel').textContent = this.value">
                                <span id="countLabel"
                                    class="font-black text-2xl text-brand-500 w-8 text-center">6</span>
                            </div>
                            <p class="text-[11px] text-neutral-400 mt-1">1–12 slides</p>
                        </div>
                        <button id="generateBtn" onclick="startGeneration()"
                            class="w-full py-3.5 rounded-2xl font-bold text-white text-sm bg-gradient-to-r from-brand-500 via-[#B06AB3] to-[#FF7FD1] shadow-[0_12px_30px_rgba(158,75,138,0.35)] hover:shadow-[0_20px_40px_rgba(158,75,138,0.5)] hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2">
                            <span class="material-symbols-rounded text-lg">auto_awesome</span>
                            Generate Outline
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- ═══ PROGRESS BAR ═══ -->
        <div id="progressSection" class="hidden border-b border-black/5 dark:border-white/10">
            <div class="container max-w-5xl py-4">
                <div class="flex items-center gap-4">
                    <div class="spin flex-shrink-0" id="progressSpinner"></div>
                    <div class="flex-1">
                        <div class="flex items-center justify-between mb-1">
                            <span id="progressText" class="text-sm font-bold">Generating outline...</span>
                            <span id="progressCount" class="text-xs font-mono text-neutral-400">0 / 0</span>
                        </div>
                        <div class="h-2 rounded-full bg-neutral-100 dark:bg-white/10 overflow-hidden">
                            <div id="progressBar" class="progress-fill" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ═══ OUTLINE SECTION with approval ═══ -->
        <div id="outlineSection" class="hidden">
            <div class="container max-w-5xl py-6">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-lg font-bold flex items-center gap-2">
                        <span class="material-symbols-rounded text-brand-500">list_alt</span>
                        Content Outline
                    </h2>
                    <span class="text-xs font-semibold text-amber-500 dark:text-amber-400 flex items-center gap-1"
                        id="outlineStatus">
                        <span class="material-symbols-rounded text-sm">pending</span>
                        Awaiting your approval
                    </span>
                </div>
                <div id="outlineList" class="grid gap-2"></div>
                <!-- Approval buttons -->
                <div id="outlineActions" class="flex flex-col sm:flex-row gap-3 mt-5">
                    <button id="approveOutlineBtn" onclick="approveOutline()"
                        class="flex-1 py-3 rounded-2xl font-bold text-white text-sm bg-gradient-to-r from-brand-500 via-[#B06AB3] to-[#FF7FD1] shadow-[0_12px_30px_rgba(158,75,138,0.35)] hover:shadow-[0_20px_40px_rgba(158,75,138,0.5)] hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2">
                        <span class="material-symbols-rounded text-lg">check_circle</span>
                        Approve & Generate Slides
                    </button>
                    <button id="regenOutlineBtn" onclick="regenerateOutline()"
                        class="flex-1 py-3 rounded-2xl font-bold text-sm ring-1 ring-black/10 dark:ring-white/15 hover:bg-black/5 dark:hover:bg-white/5 transition-all flex items-center justify-center gap-2">
                        <span class="material-symbols-rounded text-lg">refresh</span>
                        Regenerate Outline
                    </button>
                </div>
            </div>
        </div>

        <!-- ═══ SLIDES GALLERY ═══ -->
        <section id="slidesSection" class="hidden py-8 md:py-12">
            <div class="container max-w-6xl">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl md:text-2xl font-black flex items-center gap-2">
                        <span class="material-symbols-rounded text-brand-500">slideshow</span>
                        Your Slides
                    </h2>
                    <button id="downloadAllBtn" onclick="downloadAll()"
                        class="hidden items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold ring-1 ring-black/10 dark:ring-white/15 hover:bg-black/5 dark:hover:bg-white/5 transition">
                        <span class="material-symbols-rounded text-sm">download</span>
                        Download All
                    </button>
                </div>
                <div id="slidesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
            </div>
        </section>

    </main>

    <script>
        const apiBase = (window.API_BASE || window.location.origin).replace(/\/$/, '');
        const token = localStorage.getItem('px_token');
        let generatedSlides = []; // { slide_number, title, image_data }

        // ═══ THEME ═══
        const themeBtn = document.querySelector('[data-theme-toggle]');
        const themeIcon = document.getElementById('themeIcon');
        themeIcon.textContent = document.documentElement.classList.contains('dark') ? 'light_mode' : 'dark_mode';
        themeBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            const d = document.documentElement.classList.contains('dark');
            themeIcon.textContent = d ? 'light_mode' : 'dark_mode';
            localStorage.setItem('px_theme', d ? 'dark' : 'light');
        });

        let currentOutlineSlides = []; // stores outline between approval steps

        // ═══ STEP 1: GENERATE OUTLINE ONLY ═══
        async function startGeneration() {
            const title = document.getElementById('pptTitle').value.trim();
            const desc = document.getElementById('pptDesc').value.trim();
            const count = parseInt(document.getElementById('pptCount').value);

            if (!title) { document.getElementById('pptTitle').focus(); return alert('Please enter a presentation title.'); }

            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            btn.innerHTML = '<div class="spin w-5 h-5 border-2 border-white/30 border-t-white"></div> Generating outline...';

            // Hide previous results
            document.getElementById('slidesSection').classList.add('hidden');
            document.getElementById('slidesGrid').innerHTML = '';
            document.getElementById('downloadAllBtn').classList.add('hidden');
            generatedSlides = [];

            const progressSec = document.getElementById('progressSection');
            progressSec.classList.remove('hidden');
            updateProgress('Generating content outline...', 0, 1);

            try {
                const outlineRes = await apiPost('/api/ppt/generate-outline', { title, description: desc, slide_count: count });
                const slides = outlineRes.slides || [];
                if (!slides.length) throw new Error('AI returned no slides');

                currentOutlineSlides = slides;
                showOutline(slides);

                // Hide progress, show approval buttons
                progressSec.classList.add('hidden');
                document.getElementById('outlineActions').classList.remove('hidden');
                document.getElementById('outlineStatus').innerHTML = '<span class="material-symbols-rounded text-sm">pending</span> Awaiting your approval';
                document.getElementById('outlineStatus').className = 'text-xs font-semibold text-amber-500 dark:text-amber-400 flex items-center gap-1';

                // Scroll to outline
                document.getElementById('outlineSection').scrollIntoView({ behavior: 'smooth', block: 'start' });

            } catch (e) {
                alert('Error: ' + e.message);
                progressSec.classList.add('hidden');
            }

            btn.disabled = false;
            btn.innerHTML = '<span class="material-symbols-rounded text-lg">auto_awesome</span> Generate Outline';
        }

        // ═══ STEP 2: APPROVE OUTLINE → GENERATE SLIDE IMAGES (PARALLEL) ═══
        async function approveOutline() {
            // Read edited values from DOM inputs
            const slides = readEditedOutline();
            if (!slides.length) return;

            currentOutlineSlides = slides; // update with edits

            const title = document.getElementById('pptTitle').value.trim();
            const desc = document.getElementById('pptDesc').value.trim();

            // Update outline status to approved
            document.getElementById('outlineStatus').innerHTML = '<span class="material-symbols-rounded text-sm">check_circle</span> Approved';
            document.getElementById('outlineStatus').className = 'text-xs font-semibold text-emerald-500 dark:text-emerald-400 flex items-center gap-1';
            document.getElementById('outlineActions').classList.add('hidden');
            // Make inputs readonly
            document.querySelectorAll('#outlineList input, #outlineList textarea').forEach(el => { el.readOnly = true; el.classList.add('opacity-60'); });

            // Show progress
            const progressSec = document.getElementById('progressSection');
            progressSec.classList.remove('hidden');
            let completed = 0;
            updateProgress(`Generating all ${slides.length} slides in parallel...`, 0, slides.length);

            // Show skeleton gallery
            showSlideSkeletons(slides);
            document.getElementById('slidesSection').scrollIntoView({ behavior: 'smooth', block: 'start' });

            generatedSlides = new Array(slides.length).fill(null);

            // Generate ALL slides in parallel
            const promises = slides.map((slide, i) => {
                return apiPost('/api/ppt/generate-slide', {
                    ppt_title: title,
                    slide: slide,
                    total_slides: slides.length,
                    ppt_description: desc
                }).then(slideRes => {
                    completed++;
                    updateProgress(`Generated ${completed} of ${slides.length} slides`, completed, slides.length);
                    if (slideRes.image_data) {
                        generatedSlides[i] = {
                            slide_number: slide.slide_number,
                            title: slide.title,
                            image_data: slideRes.image_data
                        };
                        replaceSkeletonWithImage(i, slideRes.image_data, slide);
                    } else {
                        markSlideError(i, 'No image returned');
                    }
                }).catch(slideErr => {
                    completed++;
                    updateProgress(`Generated ${completed} of ${slides.length} slides`, completed, slides.length);
                    console.error(`Slide ${i + 1} error:`, slideErr);
                    markSlideError(i, slideErr.message || 'Generation failed');
                });
            });

            await Promise.all(promises);

            // Done! Filter out nulls
            generatedSlides = generatedSlides.filter(Boolean);
            progressSec.classList.add('hidden');
            if (generatedSlides.length > 0) {
                document.getElementById('downloadAllBtn').classList.remove('hidden');
                document.getElementById('downloadAllBtn').classList.add('inline-flex');
            }
        }

        // ═══ READ EDITED OUTLINE FROM DOM ═══
        function readEditedOutline() {
            const cards = document.querySelectorAll('#outlineList .outline-card');
            const slides = [];
            cards.forEach((card, i) => {
                const titleInput = card.querySelector('.outline-title');
                const bulletInputs = card.querySelectorAll('.outline-bullet');
                const bullets = [];
                bulletInputs.forEach(b => { if (b.value.trim()) bullets.push(b.value.trim()); });
                slides.push({
                    slide_number: i + 1,
                    title: titleInput ? titleInput.value.trim() : `Slide ${i + 1}`,
                    bullets: bullets
                });
            });
            return slides;
        }

        // ═══ REGENERATE OUTLINE ═══
        function regenerateOutline() {
            currentOutlineSlides = [];
            document.getElementById('outlineSection').classList.add('hidden');
            startGeneration();
        }

        // ═══ SHOW OUTLINE (editable) ═══
        function showOutline(slides) {
            const sec = document.getElementById('outlineSection');
            const list = document.getElementById('outlineList');
            sec.classList.remove('hidden');

            list.innerHTML = slides.map((s, i) => `
                <div class="outline-card glass rounded-xl p-4 flex items-start gap-3">
                    <span class="flex-shrink-0 w-8 h-8 rounded-full bg-brand-500/10 dark:bg-brand-500/20 flex items-center justify-center text-xs font-black text-brand-500 mt-1">${s.slide_number}</span>
                    <div class="min-w-0 flex-1 space-y-2">
                        <input type="text" class="outline-title w-full text-sm font-bold bg-transparent border-b-2 border-brand-500/20 focus:border-brand-500 outline-none py-1 dark:text-white" value="${esc(s.title)}" placeholder="Slide title">
                        <div class="space-y-1">
                            ${(s.bullets || []).map((b, bi) => `
                                <div class="flex items-start gap-1.5">
                                    <span class="text-brand-500/40 text-xs mt-1.5 flex-shrink-0">•</span>
                                    <input type="text" class="outline-bullet w-full text-xs bg-transparent border-b border-neutral-200 dark:border-white/10 focus:border-brand-500 outline-none py-1 text-neutral-600 dark:text-white/70" value="${esc(b)}" placeholder="Bullet point">
                                </div>
                            `).join('')}
                        </div>
                        <button onclick="addBullet(this)" class="text-[10px] text-brand-500 hover:text-brand-700 font-semibold flex items-center gap-1 mt-1">
                            <span class="material-symbols-rounded text-xs">add</span> Add bullet
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function addBullet(btn) {
            const container = btn.previousElementSibling;
            const newBullet = document.createElement('div');
            newBullet.className = 'flex items-start gap-1.5';
            newBullet.innerHTML = `
                <span class="text-brand-500/40 text-xs mt-1.5 flex-shrink-0">•</span>
                <input type="text" class="outline-bullet w-full text-xs bg-transparent border-b border-neutral-200 dark:border-white/10 focus:border-brand-500 outline-none py-1 text-neutral-600 dark:text-white/70" placeholder="New bullet point">
            `;
            container.appendChild(newBullet);
            newBullet.querySelector('input').focus();
        }

        // ═══ SKELETON SLIDES ═══
        function showSlideSkeletons(slides) {
            const sec = document.getElementById('slidesSection');
            const grid = document.getElementById('slidesGrid');
            sec.classList.remove('hidden');

            grid.innerHTML = slides.map((s, i) => `
                <div id="slide-card-${i}" class="slide-card glass border border-black/5 dark:border-white/10">
                    <span class="slide-badge">Slide ${s.slide_number}</span>
                    <div class="skeleton w-full h-full flex items-center justify-center" id="slide-skeleton-${i}">
                        <div class="text-center gen-pulse">
                            <div class="spin mx-auto mb-3 border-brand-500/30 border-t-brand-500"></div>
                            <p class="text-xs font-bold text-neutral-400 dark:text-white/30">${esc(s.title)}</p>
                            <p class="text-[10px] text-neutral-300 dark:text-white/20 mt-1">Generating...</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ═══ REPLACE SKELETON WITH IMAGE ═══
        function replaceSkeletonWithImage(index, imageData, slideInfo) {
            const card = document.getElementById(`slide-card-${index}`);
            if (!card) return;

            card.innerHTML = `
                <span class="slide-badge">Slide ${slideInfo.slide_number}</span>
                <img src="data:image/png;base64,${imageData}" alt="Slide ${slideInfo.slide_number}: ${esc(slideInfo.title)}" loading="lazy">
                <div class="slide-dl-overlay">
                    <button onclick="downloadSlide(${index})" class="px-4 py-2 rounded-xl bg-white text-neutral-900 font-bold text-sm shadow-lg flex items-center gap-2 hover:bg-neutral-100 transition">
                        <span class="material-symbols-rounded text-sm">download</span>
                        Download
                    </button>
                </div>
            `;
        }

        // ═══ MARK SLIDE ERROR ═══
        function markSlideError(index, msg) {
            const card = document.getElementById(`slide-card-${index}`);
            if (!card) return;
            const skel = document.getElementById(`slide-skeleton-${index}`);
            if (skel) {
                skel.classList.remove('skeleton');
                skel.innerHTML = `
                    <div class="text-center">
                        <span class="material-symbols-rounded text-red-400 text-3xl mb-2">error</span>
                        <p class="text-xs font-bold text-red-400">${esc(msg)}</p>
                        <p class="text-[10px] text-neutral-400 mt-1">This slide couldn't be generated</p>
                    </div>`;
            }
        }

        // ═══ PROGRESS ═══
        function updateProgress(text, current, total) {
            document.getElementById('progressText').textContent = text;
            document.getElementById('progressCount').textContent = `${current} / ${total}`;
            document.getElementById('progressBar').style.width = `${(current / total) * 100}%`;
        }

        // ═══ DOWNLOAD ═══
        function downloadSlide(index) {
            const slide = generatedSlides[index];
            if (!slide) return;
            const a = document.createElement('a');
            a.href = 'data:image/png;base64,' + slide.image_data;
            a.download = `slide_${slide.slide_number}_${slide.title.replace(/[^a-zA-Z0-9]/g, '_').substring(0, 30)}.png`;
            a.click();
        }

        function downloadAll() {
            generatedSlides.forEach((_, i) => {
                setTimeout(() => downloadSlide(i), i * 300);
            });
        }

        // ═══ UTILS ═══
        async function apiPost(url, body) {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = 'Bearer ' + token;
            const r = await fetch(apiBase + url, { method: 'POST', headers, body: JSON.stringify(body) });
            if (!r.ok) {
                const err = await r.json().catch(() => ({ detail: r.statusText }));
                throw new Error(err.detail || 'Request failed');
            }
            return r.json();
        }

        function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    </script>
</body>

</html>
