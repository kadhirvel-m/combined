<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Control Panel — Usage Limits</title>
  <link rel="icon" type="image/x-icon" href="../../assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="../../config.js"></script>
  <script defer src="./cp-common.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: { 900: '#1E1E2F', 700: '#4C2A59', 500: '#9E4B8A', 300: '#d8a8cb' },
            brandlt: { 900: '#312e81' }
          },
          boxShadow: { glow: '0 10px 30px rgba(158,75,138,.35)' }
        }
      }
    }
  </script>
</head>

<body class="min-h-screen bg-slate-100 text-slate-900 dark:bg-brand-900 dark:text-white font-sans">
  <header
    class="sticky top-0 z-50 bg-white/70 dark:bg-brand-900/60 backdrop-blur supports-[backdrop-filter]:saturate-150 border-b border-black/5 dark:border-white/10">
    <div class="container mx-auto px-4 flex items-center justify-between py-3.5">
      <a href="../../index.html" class="flex items-center gap-3 shrink-0" aria-label="Paper X Home">
        <img src="../../assets/img/logo-light.svg" class="h-9 w-auto dark:hidden" alt="Paper X" />
        <img src="../../assets/img/logo-dark.svg" class="h-9 w-auto hidden dark:block" alt="Paper X" />
      </a>
      <nav class="hidden md:flex items-center gap-6 text-sm text-neutral-700 dark:text-white/85">
        <a href="../../index.html" class="hover:text-brandlt-900 dark:hover:text-white">Home</a>
        <a href="../../wishlist.html"
          class="hover:text-brandlt-900 dark:hover:text-white inline-flex items-center gap-1"><span
            class="material-symbols-rounded text-base">favorite</span>Wishlist</a>
        <a href="../../history.html"
          class="hover:text-brandlt-900 dark:hover:text-white inline-flex items-center gap-1"><span
            class="material-symbols-rounded text-base">history</span>History</a>
        <a href="../../contact.html" class="hover:text-brandlt-900 dark:hover:text-white">Contact</a>
      </nav>
      <div class="hidden md:flex items-center gap-2">
        <button data-theme-toggle
          class="inline-flex items-center gap-2 rounded-full px-3 py-2 text-sm ring-1 ring-black/10 dark:ring-white/15 hover:bg-black/5 dark:hover:bg-white/5"
          aria-label="Toggle theme">
          <span class="material-symbols-rounded">dark_mode</span>
          <span class="hidden lg:block">Theme</span>
        </button>
        <a href="../../login.html"
          class="px-3 py-2 text-sm text-neutral-700 dark:text-white/80 hover:text-brandlt-900 dark:hover:text-white rounded-full">Log
          in</a>
        <a href="../../signup.html"
          class="inline-flex items-center justify-center rounded-full bg-brand-500 text-white text-sm font-semibold px-4 py-2.5 hover:shadow-glow transition">Sign
          up</a>
        <a id="navProfile" href="../../profile.html" title="Profile"
          class="hidden items-center justify-center w-10 h-10 rounded-full overflow-hidden border border-black/10 dark:border-white/10 bg-white/90 dark:bg-brand-900/60">
          <img id="navProfileImg" alt="Profile" class="w-full h-full object-cover hidden" />
          <span id="navProfileInitial" class="text-xs font-semibold">ME</span>
        </a>
        <button id="signOutBtn" type="button" title="Sign out" aria-label="Sign out"
          class="hidden items-center gap-2 rounded-full border border-black/10 dark:border-white/15 px-3 py-1.5 text-sm text-neutral-700 dark:text-white/80 hover:bg-black/5 dark:hover:bg-white/5 transition">
          <span class="material-symbols-rounded text-base">logout</span>
          <span>Sign out</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8 space-y-6">
    <section class="rounded-3xl border border-black/10 dark:border-white/10 bg-white/80 dark:bg-white/5 backdrop-blur p-6">
      <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">Usage Limits Engine</h1>
      <p class="text-sm text-slate-600 dark:text-white/70 mt-2">Define granular caps by scope and user segment.</p>
      <div class="mt-4 flex flex-wrap gap-2 text-sm">
        <a data-cp-tab="plans" href="./plans-manager.html"
          class="rounded-full px-4 py-2 border border-black/10 dark:border-white/15 transition">Plans</a>
        <a data-cp-tab="limits" href="./usage-limits.html"
          class="rounded-full px-4 py-2 border border-black/10 dark:border-white/15 transition">Usage Limits</a>
        <a data-cp-tab="manual" href="./manual-access.html"
          class="rounded-full px-4 py-2 border border-black/10 dark:border-white/15 transition">Manual Access</a>
        <a data-cp-tab="abuse" href="./abuse-blocks.html"
          class="rounded-full px-4 py-2 border border-black/10 dark:border-white/15 transition">Abuse Blocks</a>
      </div>
    </section>

    <section class="max-w-7xl mx-auto grid lg:grid-cols-2 gap-6">
      <article class="rounded-2xl border border-black/10 dark:border-white/10 bg-white dark:bg-white/5 p-5">
        <h2 class="font-semibold mb-3">Create / Edit Rule</h2>
        <p id="status" class="hidden text-xs mb-3"></p>
        <form id="ruleForm" class="space-y-3">
          <input type="hidden" id="ruleId">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <label class="text-xs">Rule Name<input id="rule_name"
                class="mt-1 w-full rounded-xl bg-white dark:bg-brand-900/40 border border-black/10 dark:border-white/10 px-3 py-2 text-sm"
                required></label>
            <label class="text-xs">Scope<select id="scope_type"
                class="mt-1 w-full rounded-xl bg-white dark:bg-brand-900/40 border border-black/10 dark:border-white/10 px-3 py-2 text-sm">
                <option value="global">Global</option>
                <option value="college">College</option>
                <option value="degree">Degree</option>
                <option value="department">Department</option>
                <option value="batch">Batch</option>
                <option value="semester">Semester</option>
              </select></label>
          </div>

          <div id="scopeFields" class="grid md:grid-cols-2 gap-3">
            <label class="text-xs">College<select id="scope_college_id"
                class="mt-1 w-full rounded-xl bg-white dark:bg-brand-900/40 border border-black/10 dark:border-white/10 px-3 py-2 text-sm">
                <option value="">--</option>
              </select></label>
            <label class="text-xs">Degree<select id="scope_degree_id"
                class="mt-1 w-full rounded-xl bg-white dark:bg-brand-900/40 border border-black/10 dark:border-white/10 px-3 py-2 text-sm">
                <option value="">--</option>
              </select></label>
            <label class="text-xs">Department<select id="scope_department_id"
                class="mt-1 w-full rounded-xl bg-white dark:bg-brand-900/40 border border-black/10 dark:border-white/10 px-3 py-2 text-sm">
                <option value="">--</option>
              </select></label>
            <label class="text-xs">Batch<select id="scope_batch_id"
                class="mt-1 w-full rounded-xl bg-white dark:bg-brand-900/40 border border-black/10 dark:border-white/10 px-3 py-2 text-sm">
                <option value="">--</option>
              </select></label>
            <label class="text-xs">Semester<input type="number" id="scope_semester" min="1" max="12"
                class="mt-1 w-full rounded-xl bg-white dark:bg-brand-900/40 border border-black/10 dark:border-white/10 px-3 py-2 text-sm"></label>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <label class="text-xs">Max Topics/Day<input type="number" id="max_topics_per_day" min="0"
                class="mt-1 w-full rounded-xl bg-white dark:bg-brand-900/40 border border-black/10 dark:border-white/10 px-3 py-2 text-sm"></label>
            <label class="text-xs">Max Subjects/Day<input type="number" id="max_subjects_per_day" min="0"
                class="mt-1 w-full rounded-xl bg-white dark:bg-brand-900/40 border border-black/10 dark:border-white/10 px-3 py-2 text-sm"></label>
            <label class="text-xs">Max MCQ/Day<input type="number" id="max_mcq_attempts_per_day" min="0"
                class="mt-1 w-full rounded-xl bg-white dark:bg-brand-900/40 border border-black/10 dark:border-white/10 px-3 py-2 text-sm"></label>
            <label class="text-xs">Max Blink/Day<input type="number" id="max_blink_views_per_day" min="0"
                class="mt-1 w-full rounded-xl bg-white dark:bg-brand-900/40 border border-black/10 dark:border-white/10 px-3 py-2 text-sm"></label>
            <label class="text-xs">Max Searches/Day<input type="number" id="max_searches_per_day" min="0"
                class="mt-1 w-full rounded-xl bg-white dark:bg-brand-900/40 border border-black/10 dark:border-white/10 px-3 py-2 text-sm"></label>
            <label class="text-xs">Max AI Prompts/Day<input type="number" id="max_ai_prompts_per_day" min="0"
                class="mt-1 w-full rounded-xl bg-white dark:bg-brand-900/40 border border-black/10 dark:border-white/10 px-3 py-2 text-sm"></label>
            <label class="text-xs">Session Minutes/Day<input type="number" id="max_session_minutes_per_day" min="0"
                class="mt-1 w-full rounded-xl bg-white dark:bg-brand-900/40 border border-black/10 dark:border-white/10 px-3 py-2 text-sm"></label>
            <label class="text-xs">Trial Duration Days<input type="number" id="trial_duration_days" min="0"
                class="mt-1 w-full rounded-xl bg-white dark:bg-brand-900/40 border border-black/10 dark:border-white/10 px-3 py-2 text-sm"></label>
          </div>

          <div class="flex flex-wrap gap-4 text-xs">
            <label><input type="checkbox" id="apply_to_free_users" checked> Apply limits to all free users</label>
            <label><input type="checkbox" id="active_status" checked> Active</label>
          </div>

          <div class="flex gap-2">
            <button type="submit" class="rounded-xl bg-brand-500 px-4 py-2 text-sm font-semibold text-white">Save Rule</button>
            <button type="button" id="resetBtn"
              class="rounded-xl bg-white dark:bg-white/10 border border-black/10 dark:border-white/10 px-4 py-2 text-sm">Reset</button>
          </div>
        </form>
      </article>

      <article class="rounded-2xl border border-black/10 dark:border-white/10 bg-white dark:bg-white/5 p-5">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-semibold">Current Rules</h2>
          <button id="reloadBtn"
            class="rounded-xl bg-white dark:bg-white/10 border border-black/10 dark:border-white/10 px-3 py-2 text-xs">Reload</button>
        </div>
        <div class="overflow-auto max-h-[72vh]">
          <table class="w-full text-sm">
            <thead class="text-xs text-slate-500 dark:text-white/60 border-b border-black/10 dark:border-white/10">
              <tr>
                <th class="text-left py-2">Rule</th>
                <th class="text-left">Scope</th>
                <th class="text-left">Topics/Day</th>
                <th class="text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="rulesTbody"></tbody>
          </table>
        </div>
      </article>
    </section>
  </main>

  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const statusEl = $('status');
      const tbody = $('rulesTbody');
      const form = $('ruleForm');
      let rules = [];

      function n(v) { return v === '' || v == null ? null : Number(v); }
      function tv(id) { return ($(id).value || '').trim(); }

      function payloadFromForm() {
        return {
          rule_name: tv('rule_name'),
          scope_type: tv('scope_type') || 'global',
          scope_college_id: tv('scope_college_id') || null,
          scope_degree_id: tv('scope_degree_id') || null,
          scope_department_id: tv('scope_department_id') || null,
          scope_batch_id: tv('scope_batch_id') || null,
          scope_semester: n(tv('scope_semester')),
          max_topics_per_day: n(tv('max_topics_per_day')),
          max_subjects_per_day: n(tv('max_subjects_per_day')),
          max_mcq_attempts_per_day: n(tv('max_mcq_attempts_per_day')),
          max_blink_views_per_day: n(tv('max_blink_views_per_day')),
          max_searches_per_day: n(tv('max_searches_per_day')),
          max_ai_prompts_per_day: n(tv('max_ai_prompts_per_day')),
          max_session_minutes_per_day: n(tv('max_session_minutes_per_day')),
          trial_duration_days: n(tv('trial_duration_days')),
          apply_to_free_users: $('apply_to_free_users').checked,
          active_status: $('active_status').checked
        };
      }

      function setForm(row) {
        $('ruleId').value = row?.id || '';
        $('rule_name').value = row?.rule_name || '';
        $('scope_type').value = row?.scope_type || 'global';
        $('scope_college_id').value = row?.scope_college_id || '';
        $('scope_degree_id').value = row?.scope_degree_id || '';
        $('scope_department_id').value = row?.scope_department_id || '';
        $('scope_batch_id').value = row?.scope_batch_id || '';
        $('scope_semester').value = row?.scope_semester ?? '';
        $('max_topics_per_day').value = row?.max_topics_per_day ?? '';
        $('max_subjects_per_day').value = row?.max_subjects_per_day ?? '';
        $('max_mcq_attempts_per_day').value = row?.max_mcq_attempts_per_day ?? '';
        $('max_blink_views_per_day').value = row?.max_blink_views_per_day ?? '';
        $('max_searches_per_day').value = row?.max_searches_per_day ?? '';
        $('max_ai_prompts_per_day').value = row?.max_ai_prompts_per_day ?? '';
        $('max_session_minutes_per_day').value = row?.max_session_minutes_per_day ?? '';
        $('trial_duration_days').value = row?.trial_duration_days ?? '';
        $('apply_to_free_users').checked = row ? !!row.apply_to_free_users : true;
        $('active_status').checked = row ? !!row.active_status : true;
      }

      function fillSelect(id, rows, labelKey = 'name') {
        const el = $(id);
        const cur = el.value;
        el.innerHTML = '<option value="">--</option>';
        (rows || []).forEach(r => {
          const o = document.createElement('option');
          o.value = r.id;
          o.textContent = r[labelKey] || r.id;
          el.appendChild(o);
        });
        el.value = cur;
      }

      async function loadMeta() {
        const metaRes = await fetch(`${CP.API}/api/public/academic-meta`);
        const meta = await metaRes.json().catch(() => ({}));
        fillSelect('scope_college_id', meta.colleges || []);
        fillSelect('scope_degree_id', meta.degrees || []);
        fillSelect('scope_department_id', meta.departments || []);
        try {
          const bRes = await fetch(`${CP.API}/api/batches`);
          const bData = await bRes.json().catch(() => ({}));
          fillSelect('scope_batch_id', bData.batches || [], 'range');
        } catch (_) { }
      }

      function render() {
        if (!rules.length) {
          tbody.innerHTML = '<tr><td colspan="4" class="py-4 text-slate-500 dark:text-white/60">No rules</td></tr>';
          return;
        }
        tbody.innerHTML = rules.map(r => `
          <tr class="border-b border-black/5 dark:border-white/5 hover:bg-black/[0.02] dark:hover:bg-white/[0.04]">
            <td class="py-2">
              <div class="font-medium">${CP.escapeHtml(r.rule_name)}</div>
              <div class="text-xs text-slate-500 dark:text-white/60">${CP.escapeHtml(r.id)}</div>
            </td>
            <td>${CP.escapeHtml(r.scope_type || 'global')}</td>
            <td>${r.max_topics_per_day ?? '-'}</td>
            <td class="text-right">
              <div class="inline-flex gap-1">
                <button data-act="edit" data-id="${r.id}" class="px-2 py-1 rounded bg-black/5 dark:bg-white/10 text-xs">Edit</button>
                <button data-act="toggle" data-id="${r.id}" class="px-2 py-1 rounded bg-black/5 dark:bg-white/10 text-xs">${r.active_status ? 'Disable' : 'Enable'}</button>
                <button data-act="del" data-id="${r.id}" class="px-2 py-1 rounded bg-red-500/20 text-xs">Delete</button>
              </div>
            </td>
          </tr>
        `).join('');
      }

      async function loadRules() {
        const data = await CP.fetchJson('/api/admin/usage-limits');
        rules = data.rules || [];
        render();
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          const id = tv('ruleId');
          const body = payloadFromForm();
          if (id) await CP.fetchJson(`/api/admin/usage-limits/${encodeURIComponent(id)}`, { method: 'PUT', body: JSON.stringify(body) });
          else await CP.fetchJson('/api/admin/usage-limits', { method: 'POST', body: JSON.stringify(body) });
          CP.showStatus(statusEl, 'Rule saved.', 'success');
          setForm(null);
          await loadRules();
        } catch (err) {
          CP.showStatus(statusEl, err.message || 'Save failed', 'error');
        }
      });

      $('reloadBtn').addEventListener('click', () => loadRules().catch((e) => CP.showStatus(statusEl, e.message, 'error')));
      $('resetBtn').addEventListener('click', () => setForm(null));

      tbody.addEventListener('click', async (e) => {
        const btn = e.target.closest('button[data-act]');
        if (!btn) return;
        const id = btn.getAttribute('data-id');
        const act = btn.getAttribute('data-act');
        const row = rules.find((r) => r.id === id);
        if (!row) return;
        try {
          if (act === 'edit') setForm(row);
          else if (act === 'toggle') {
            await CP.fetchJson(`/api/admin/usage-limits/${encodeURIComponent(id)}`, { method: 'PUT', body: JSON.stringify({ active_status: !row.active_status }) });
            await loadRules();
          } else if (act === 'del') {
            if (!confirm('Delete this rule?')) return;
            await CP.fetchJson(`/api/admin/usage-limits/${encodeURIComponent(id)}`, { method: 'DELETE' });
            await loadRules();
          }
        } catch (err) {
          CP.showStatus(statusEl, err.message || 'Action failed', 'error');
        }
      });

      (async function init() {
        CP.initPageChrome('limits');
        try {
          await CP.ensureAdmin();
          await loadMeta();
          await loadRules();
        } catch (err) {
          CP.showStatus(statusEl, err.message || 'Init failed', 'error');
        }
      })();
    })();
  </script>
</body>

</html>
