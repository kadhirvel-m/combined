<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Group Chat — PaperX</title>
    <meta name="description"
        content="Real-time group chat with voice call, screen sharing, and collaborative whiteboard" />
    <link rel="stylesheet" href="../assets/css/tailwind.css" />
    <script src="../config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300;400;600&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --brand-50: #eef4ff;
            --brand-100: #d9e6ff;
            --brand-500: #3f6fff;
            --brand-600: #2f56e6;
            --brand-700: #2846bb;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(0, 0, 0, 0.08);
        }

        .dark {
            --glass-bg: rgba(20, 24, 33, 0.85);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        .icon {
            font-family: 'Material Symbols Outlined';
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .icon-filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: saturate(1.2) blur(12px);
            -webkit-backdrop-filter: saturate(1.2) blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 1rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3f6fff 0%, #628fff 100%);
            color: white;
            border: none;
            box-shadow: 0 8px 24px rgba(63, 111, 255, 0.35);
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(63, 111, 255, 0.45);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: rgba(0, 0, 0, 0.06);
            color: inherit;
            border: 1px solid var(--glass-border);
            transition: all 0.2s ease;
        }

        .dark .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-secondary:hover {
            background: rgba(0, 0, 0, 0.1);
        }

        .dark .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #f87171 100%);
            color: white;
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.35);
        }

        /* Whiteboard canvas */
        #whiteboard {
            touch-action: none;
            cursor: crosshair;
        }

        /* Video containers */
        .video-container {
            position: relative;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 1rem;
            overflow: hidden;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Participant avatars */
        .participant-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            background: linear-gradient(135deg, #3f6fff 0%, #628fff 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(63, 111, 255, 0.3);
        }

        /* Control buttons */
        .control-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }

        .control-btn:hover {
            transform: scale(1.1);
        }

        .control-btn.active {
            background: linear-gradient(135deg, #3f6fff 0%, #628fff 100%);
            color: white;
            box-shadow: 0 6px 18px rgba(63, 111, 255, 0.4);
        }

        .control-btn.inactive {
            background: rgba(0, 0, 0, 0.08);
            color: inherit;
        }

        .dark .control-btn.inactive {
            background: rgba(255, 255, 255, 0.1);
        }

        .control-btn.muted {
            background: linear-gradient(135deg, #ef4444 0%, #f87171 100%);
            color: white;
        }

        /* Toolbar for whiteboard */
        .toolbar-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            transition: all 0.2s ease;
        }

        .toolbar-btn:hover {
            background: rgba(63, 111, 255, 0.1);
            border-color: rgba(63, 111, 255, 0.3);
        }

        .toolbar-btn.active {
            background: var(--brand-500);
            color: white;
            border-color: transparent;
        }

        /* Color picker */
        .color-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s ease;
        }

        .color-dot:hover {
            transform: scale(1.15);
        }

        .color-dot.active {
            border-color: white;
            box-shadow: 0 0 0 2px var(--brand-500);
        }

        /* Pulse animation for connecting */
        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .connecting {
            animation: pulse 1.5s ease-in-out infinite;
        }

        /* Participant list */
        .participant-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem;
            border-radius: 0.5rem;
            transition: background 0.2s ease;
        }

        .participant-item:hover {
            background: rgba(0, 0, 0, 0.04);
        }

        .dark .participant-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        /* Chat messages */
        .chat-bubble {
            max-width: 85%;
            padding: 0.5rem 0.75rem;
            border-radius: 1rem;
            font-size: 14px;
        }

        .chat-mine {
            margin-left: auto;
            background: linear-gradient(135deg, #3f6fff, #628fff);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .chat-theirs {
            background: rgba(0, 0, 0, 0.06);
            border-bottom-left-radius: 4px;
        }

        .dark .chat-theirs {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body
    class="bg-gradient-to-br from-slate-50 to-blue-50 dark:from-[#0a0d12] dark:to-[#0f1419] text-[#0d1117] dark:text-zinc-100 min-h-screen">

    <!-- Header -->
    <header class="sticky top-0 z-50 glass-card border-0 border-b rounded-none">
        <nav class="container mx-auto px-4 flex items-center justify-between py-3">
            <div class="flex items-center gap-3">
                <a href="../index.html" class="flex items-center gap-2 font-semibold">
                    <span
                        class="inline-flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-brand-500 to-brand-600 text-white shadow-lg">
                        <span class="icon text-lg">groups</span>
                    </span>
                    <span class="hidden sm:inline">Group Chat</span>
                </a>
                <span id="roomName" class="hidden sm:inline text-sm opacity-70">— Loading...</span>
            </div>

            <div class="flex items-center gap-3">
                <button id="copyLinkBtn" class="btn-secondary px-3 py-2 rounded-xl text-sm flex items-center gap-2"
                    title="Copy invite link">
                    <span class="icon text-lg">link</span>
                    <span class="hidden sm:inline">Copy Link</span>
                </button>
                <button onclick="Theme.toggle()" class="btn-secondary px-3 py-2 rounded-xl">
                    <span class="icon">dark_mode</span>
                </button>
                <button id="leaveBtn" class="btn-danger px-4 py-2 rounded-xl text-sm flex items-center gap-2">
                    <span class="icon text-lg">call_end</span>
                    <span class="hidden sm:inline">Leave</span>
                </button>
            </div>
        </nav>
    </header>

    <!-- Meeting Ended View -->
    <main id="endedView" class="hidden container mx-auto px-4 py-16">
        <div class="max-w-md mx-auto text-center glass-card p-10">
            <div
                class="inline-flex h-20 w-20 items-center justify-center rounded-full bg-red-100 dark:bg-red-900/30 text-red-500 mb-6">
                <span class="icon text-4xl">call_end</span>
            </div>
            <h1 class="text-3xl font-bold mb-3">Call Ended</h1>
            <p class="text-lg opacity-70 mb-8">This meeting has ended and is no longer active.</p>

            <a href="group_history.html"
                class="btn-primary w-full py-3 rounded-xl font-semibold text-lg flex items-center justify-center gap-2">
                <span class="icon">history</span>
                Go to Call History
            </a>
            <a href="../index.html" class="block mt-4 text-sm opacity-60 hover:opacity-100 transition">
                Return to Home
            </a>
        </div>
    </main>


    <!-- Room View -->
    <main id="roomView" class="hidden container mx-auto px-4 py-4">
        <div class="grid lg:grid-cols-[1fr,380px] gap-4 h-[calc(100vh-140px)]">

            <!-- Left: Video / Screen Share Area -->
            <div class="flex flex-col gap-4">
                <!-- Screen share / main video -->
                <div id="mainVideoArea" class="video-container flex-1 min-h-[300px] flex items-center justify-center">
                    <video id="screenShareVideo" autoplay playsinline muted class="hidden w-full h-full"
                        style="background: #000;"></video>
                    <div id="noScreenShare" class="text-center text-white/70">
                        <span class="icon text-6xl mb-2">screen_share</span>
                        <p>No screen being shared</p>
                    </div>
                </div>

                <!-- Controls bar -->
                <div class="glass-card p-4 flex items-center justify-center gap-4">
                    <button id="micBtn" class="control-btn active" title="Toggle microphone">
                        <span class="icon">mic</span>
                    </button>
                    <button id="screenShareBtn" class="control-btn inactive" title="Share screen">
                        <span class="icon">screen_share</span>
                    </button>
                    <div class="w-px h-8 bg-black/10 dark:bg-white/10 mx-2"></div>
                    <button id="chatToggleBtn" class="control-btn inactive lg:hidden" title="Toggle chat">
                        <span class="icon">chat</span>
                    </button>
                </div>
            </div>

            <!-- Right: Whiteboard + Participants + Chat -->
            <div class="flex flex-col gap-4">

                <!-- Whiteboard -->
                <div class="glass-card p-3 flex-1">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="font-semibold flex items-center gap-2">
                            <span class="icon text-lg">draw</span>
                            Whiteboard
                        </h3>
                        <div class="flex items-center gap-2">
                            <!-- Colors -->
                            <div class="flex gap-1">
                                <button class="color-dot active" data-color="#000000"
                                    style="background:#000000"></button>
                                <button class="color-dot" data-color="#ef4444" style="background:#ef4444"></button>
                                <button class="color-dot" data-color="#3b82f6" style="background:#3b82f6"></button>
                                <button class="color-dot" data-color="#22c55e" style="background:#22c55e"></button>
                                <button class="color-dot" data-color="#f59e0b" style="background:#f59e0b"></button>
                            </div>
                            <div class="w-px h-6 bg-black/10 dark:bg-white/10"></div>
                            <!-- Brush size -->
                            <input type="range" id="brushSize" min="2" max="20" value="4" class="w-16" />
                            <button id="clearCanvasBtn" class="toolbar-btn" title="Clear canvas">
                                <span class="icon text-lg">delete</span>
                            </button>
                        </div>
                    </div>
                    <div class="relative bg-white dark:bg-zinc-800 rounded-lg overflow-hidden"
                        style="aspect-ratio: 4/3;">
                        <canvas id="whiteboard" class="absolute inset-0 w-full h-full"></canvas>
                    </div>
                </div>

                <!-- Participants -->
                <div class="glass-card p-3">
                    <h3 class="font-semibold flex items-center gap-2 mb-2">
                        <span class="icon text-lg">group</span>
                        Participants
                        <span id="participantCount"
                            class="text-xs bg-brand-500 text-white px-2 py-0.5 rounded-full">0</span>
                    </h3>
                    <div id="participantsList" class="space-y-1 max-h-32 overflow-y-auto">
                        <!-- Participants will be added here -->
                    </div>
                </div>

                <!-- Chat -->
                <div class="glass-card p-3 flex flex-col" style="height: 200px;">
                    <h3 class="font-semibold flex items-center gap-2 mb-2">
                        <span class="icon text-lg">chat_bubble</span>
                        Chat
                    </h3>
                    <div id="chatMessages" class="flex-1 overflow-y-auto space-y-2 mb-2">
                        <!-- Chat messages -->
                    </div>
                    <form id="chatForm" class="flex gap-2">
                        <input type="text" id="chatInput" placeholder="Type a message..."
                            class="flex-1 px-3 py-2 rounded-lg border border-black/10 dark:border-white/10 bg-white/70 dark:bg-zinc-900/50 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" />
                        <button type="submit" class="btn-primary px-4 py-2 rounded-lg">
                            <span class="icon">send</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast notifications -->
    <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 hidden">
        <div class="glass-card px-6 py-3 flex items-center gap-3 shadow-xl">
            <span id="toastIcon" class="icon text-brand-500">check_circle</span>
            <span id="toastText"></span>
        </div>
    </div>

    <script>
        // =========================================================================
        // Configuration
        // =========================================================================
        const API = (window.API_BASE || 'http://127.0.0.1:8000').replace(/\/$/, '');
        const WS_BASE = API.replace(/^http/, 'ws');
        const token = localStorage.getItem('px_token');

        // =========================================================================
        // State
        // =========================================================================
        let roomId = null;
        let userId = null;
        let userName = 'Anonymous';
        let isHost = false;
        let ws = null;
        let localStream = null;
        let screenStream = null;
        let peerConnections = {};  // userId -> RTCPeerConnection
        let isMuted = false;
        let isScreenSharing = false;

        // Whiteboard state
        let canvas, ctx;
        let isDrawing = false;
        let currentColor = '#000000';
        let brushSize = 4;
        let lastX = 0, lastY = 0;

        // =========================================================================
        // DOM Elements
        // =========================================================================
        const el = id => document.getElementById(id);
        const roomView = el('roomView');
        const endedView = el('endedView');
        const roomNameEl = el('roomName');
        const copyLinkBtn = el('copyLinkBtn');
        const leaveBtn = el('leaveBtn');
        const micBtn = el('micBtn');
        const screenShareBtn = el('screenShareBtn');
        const screenShareVideo = el('screenShareVideo');
        const noScreenShare = el('noScreenShare');
        const participantsList = el('participantsList');
        const participantCount = el('participantCount');
        const chatMessages = el('chatMessages');
        const chatForm = el('chatForm');
        const chatInput = el('chatInput');
        const clearCanvasBtn = el('clearCanvasBtn');
        const brushSizeInput = el('brushSize');

        // =========================================================================
        // Toast
        // =========================================================================
        function showToast(message, icon = 'check_circle', duration = 3000) {
            const toast = el('toast');
            el('toastText').textContent = message;
            el('toastIcon').textContent = icon;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), duration);
        }

        // =========================================================================
        // Room Management
        // =========================================================================
        async function joinRoom() {
            if (!roomId) {
                showToast('No room ID specified', 'error');
                return;
            }

            // CHECK STATUS FIRST
            try {
                const checkRes = await fetch(`${API}/api/group-chat/${roomId}`, {
                    headers: token ? { 'Authorization': `Bearer ${token}` } : {}
                });

                if (checkRes.status === 400 || checkRes.status === 404) {
                    const err = await checkRes.json();
                    if (err.detail && (err.detail.includes("ended") || err.detail.includes("not found"))) {
                        roomView.classList.add('hidden');
                        endedView.classList.remove('hidden');
                        return;
                    }
                }
            } catch (e) {
                console.log("Error checking room status", e);
            }

            // Try to get user profile
            if (token) {
                try {
                    const res = await fetch(`${API}/api/profile`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const profile = await res.json();
                        userId = profile.user_id;
                        userName = profile.name || 'Anonymous';
                    }
                } catch (_) { }
            }

            if (!userId) {
                userId = 'user-' + Math.random().toString(36).substr(2, 6);
            }

            // Switch to room view
            endedView.classList.add('hidden');
            roomView.classList.remove('hidden');

            // Connect WebSocket
            connectWebSocket();

            // Initialize whiteboard
            initWhiteboard();

            // Get microphone access
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            } catch (err) {
                console.warn('Could not get microphone:', err);
                showToast('Microphone access denied', 'warning');
            }
        }

        function cleanupRoom() {
            if (ws) {
                ws.close();
                ws = null;
            }

            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }

            if (screenStream) {
                screenStream.getTracks().forEach(t => t.stop());
                screenStream = null;
            }

            Object.values(peerConnections).forEach(pc => pc.close());
            peerConnections = {};

            // Reset state
            roomId = null;
            isHost = false;
            isScreenSharing = false;
        }

        function leaveRoom() {
            cleanupRoom();
            window.location.href = 'create_meet.html';
        }

        // Handle Ended Event via WS
        function handleRoomEnded() {
            cleanupRoom();
            endedView.classList.remove('hidden');
            roomView.classList.add('hidden');
        }

        // =========================================================================
        // WebSocket Connection
        // =========================================================================
        function connectWebSocket() {
            ws = new WebSocket(`${WS_BASE}/ws/group-chat/${roomId}`);

            ws.onopen = () => {
                console.log('[WS] Connected');
                // Send join message
                ws.send(JSON.stringify({
                    type: 'join',
                    data: { user_id: userId, name: userName }
                }));
            };

            ws.onmessage = async (event) => {
                const msg = JSON.parse(event.data);
                await handleSignalingMessage(msg);
            };

            ws.onclose = () => {
                console.log('[WS] Disconnected');
                // showToast('Disconnected from room', 'wifi_off');
            };

            ws.onerror = (err) => {
                console.error('[WS] Error:', err);
                showToast('Connection error', 'error');
            };
        }

        async function handleSignalingMessage(msg) {
            const { type, data, from_user_id } = msg;

            switch (type) {
                case 'room-info':
                    // Room info received after joining
                    roomNameEl.textContent = `— ${data.name}`;
                    isHost = data.is_host;
                    userId = data.your_user_id;

                    // Render existing participants
                    updateParticipants(data.participants);

                    // Replay whiteboard history
                    if (data.whiteboard_history) {
                        data.whiteboard_history.forEach(stroke => drawFromRemote(stroke));
                    }

                    // Show screen share if active
                    if (data.screen_share_active) {
                        noScreenShare.innerHTML = `<span class="icon text-6xl mb-2">screen_share</span><p>${data.screen_sharer_id === userId ? 'You are' : 'Someone is'} sharing screen</p>`;
                    }

                    // Create peer connections with existing participants
                    // onnegotiationneeded will automatically send offers
                    for (const p of data.participants) {
                        if (p.user_id !== userId) {
                            await createPeerConnection(p.user_id, false);
                        }
                    }
                    break;

                case 'room-ended':
                    showToast('The host has ended the meeting.', 'call_end');
                    setTimeout(() => {
                        handleRoomEnded();
                    }, 2000);
                    break;

                case 'user-joined':
                    showToast(`${data.name} joined`, 'person_add');
                    addParticipant(data);

                    // Create peer connection with new participant
                    // Screen share track is added automatically in createPeerConnection
                    // onnegotiationneeded will handle sending the offer
                    if (data.user_id !== userId) {
                        await createPeerConnection(data.user_id, false);
                    }
                    break;

                case 'user-left':
                    showToast(`${data.name} left`, 'person_remove');
                    removeParticipant(data.user_id);
                    if (peerConnections[data.user_id]) {
                        peerConnections[data.user_id].close();
                        delete peerConnections[data.user_id];
                    }
                    break;

                case 'offer':
                    await handleOffer(from_user_id, data);
                    break;

                case 'answer':
                    await handleAnswer(from_user_id, data);
                    break;

                case 'ice-candidate':
                    await handleIceCandidate(from_user_id, data);
                    break;

                case 'whiteboard-draw':
                    drawFromRemote(data);
                    break;

                case 'whiteboard-clear':
                    clearCanvas(false);
                    break;

                case 'screen-share-started':
                    noScreenShare.innerHTML = `<span class="icon text-6xl mb-2 connecting">screen_share</span><p>${data.sharer_name} is sharing screen</p>`;
                    break;

                case 'screen-share-stopped':
                    noScreenShare.innerHTML = `<span class="icon text-6xl mb-2">screen_share</span><p>No screen being shared</p>`;
                    screenShareVideo.classList.add('hidden');
                    noScreenShare.classList.remove('hidden');
                    break;

                case 'chat-message':
                    addChatMessage(data);
                    break;
            }
        }

        // =========================================================================
        // WebRTC Peer Connections
        // =========================================================================
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun3.l.google.com:19302' },
                { urls: 'stun:stun4.l.google.com:19302' },
                // Free TURN servers for NAT traversal
                {
                    urls: 'turn:openrelay.metered.ca:80',
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                },
                {
                    urls: 'turn:openrelay.metered.ca:443',
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                }
            ],
            iceCandidatePoolSize: 10
        };

        // Track making offer state per peer
        let makingOffer = {};  // peerId -> boolean
        let ignoreOffer = {};  // peerId -> boolean

        async function createPeerConnection(peerId, isInitiator) {
            if (peerConnections[peerId]) return peerConnections[peerId];

            const pc = new RTCPeerConnection(rtcConfig);
            peerConnections[peerId] = pc;
            makingOffer[peerId] = false;
            ignoreOffer[peerId] = false;

            // Determine who is "polite" - use lexicographic comparison of user IDs
            // The "polite" peer will defer when there's a conflict
            const polite = userId > peerId;

            // Add local audio track
            if (localStream) {
                localStream.getTracks().forEach(track => {
                    pc.addTrack(track, localStream);
                });
            }

            // Add screen share track if currently sharing
            if (isScreenSharing && screenStream) {
                screenStream.getTracks().forEach(track => {
                    pc.addTrack(track, screenStream);
                });
            }

            pc.onicecandidate = ({ candidate }) => {
                if (candidate) {
                    ws.send(JSON.stringify({
                        type: 'ice-candidate',
                        data: candidate,
                        target_user_id: peerId
                    }));
                }
            };

            pc.ontrack = (event) => {
                // We only handle screen share tracks here
                // Audio is handled automatically by the browser mixing
                if (event.streams[0]) {
                    // Check if it's a video track (screen share)
                    if (event.track.kind === 'video') {
                        screenShareVideo.srcObject = event.streams[0];
                        screenShareVideo.classList.remove('hidden');
                        noScreenShare.classList.add('hidden');
                    }
                }
            };

            pc.onnegotiationneeded = async () => {
                try {
                    makingOffer[peerId] = true;
                    await pc.setLocalDescription();
                    ws.send(JSON.stringify({
                        type: 'offer',
                        data: pc.localDescription,
                        target_user_id: peerId
                    }));
                } catch (err) {
                    console.error(err);
                } finally {
                    makingOffer[peerId] = false;
                }
            };

            // Handle glare (simultaneous offers)
            pc.oniceconnectionstatechange = () => {
                if (pc.iceConnectionState === 'failed') {
                    pc.restartIce();
                }
            };

            return pc;
        }

        async function handleOffer(peerId, offer) {
            const pc = await createPeerConnection(peerId, false);
            const polite = userId > peerId;

            // Rollback if we have a collision and we're polite
            const offerCollision = makingOffer[peerId] || pc.signalingState !== 'stable';
            if (offerCollision && !polite) {
                ignoreOffer[peerId] = true;
                return;
            }

            if (offerCollision) {
                // If we're polite, we rollback our local description if needed
                // But since we using the 'perfect negotiation' pattern with addTrack triggering negotiationneeded, 
                // we technically might need to rollback. 
                // Simplification: we proceed
            }

            await pc.setRemoteDescription(offer);
            await pc.setLocalDescription();
            ws.send(JSON.stringify({
                type: 'answer',
                data: pc.localDescription,
                target_user_id: peerId
            }));
        }

        async function handleAnswer(peerId, answer) {
            const pc = peerConnections[peerId];
            if (!pc) return;
            await pc.setRemoteDescription(answer);
        }

        async function handleIceCandidate(peerId, candidate) {
            const pc = peerConnections[peerId];
            if (!pc) return;
            try {
                await pc.addIceCandidate(candidate);
            } catch (err) {
                if (!ignoreOffer[peerId]) {
                    console.warn(err);
                }
            }
        }


        // =========================================================================
        // Media Controls
        // =========================================================================
        micBtn.onclick = () => {
            if (!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks()[0].enabled = !isMuted;

            if (isMuted) {
                micBtn.classList.remove('active');
                micBtn.classList.add('muted');
                micBtn.innerHTML = '<span class="icon">mic_off</span>';
            } else {
                micBtn.classList.add('active');
                micBtn.classList.remove('muted');
                micBtn.innerHTML = '<span class="icon">mic</span>';
            }
        };

        screenShareBtn.onclick = async () => {
            if (isScreenSharing) {
                // Stop sharing
                stopScreenShare();
            } else {
                // Start sharing
                try {
                    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });

                    screenStream.getVideoTracks()[0].onended = stopScreenShare;

                    // Add track to all peer connections
                    const track = screenStream.getVideoTracks()[0];
                    Object.values(peerConnections).forEach(pc => {
                        pc.addTrack(track, screenStream);
                    });

                    isScreenSharing = true;
                    screenShareBtn.classList.add('active');
                    screenShareBtn.classList.remove('inactive');

                    // Broadcast start
                    ws.send(JSON.stringify({
                        type: 'screen-share-started',
                        data: { sharer_name: userName }
                    }));

                    // Show local preview
                    // screenShareVideo.srcObject = screenStream;
                    // screenShareVideo.classList.remove('hidden');
                    // noScreenShare.classList.add('hidden');

                } catch (err) {
                    console.error('Screen share error:', err);
                }
            }
        };

        function stopScreenShare() {
            if (!isScreenSharing) return;

            if (screenStream) {
                screenStream.getTracks().forEach(t => t.stop());
                screenStream = null;
            }

            // Remove tracks from peers (negotiation needed will trigger)
            // Implementation note: removing tracks is tricky in WebRTC, 
            // usually better to just stop the track or replace it.
            // For simplicity here, we just broadcast stop.

            isScreenSharing = false;
            screenShareBtn.classList.remove('active');
            screenShareBtn.classList.add('inactive');

            ws.send(JSON.stringify({
                type: 'screen-share-stopped',
                data: {}
            }));
        }


        // =========================================================================
        // Whiteboard
        // =========================================================================
        function initWhiteboard() {
            canvas = el('whiteboard');
            ctx = canvas.getContext('2d');

            // Set resolution
            const resize = () => {
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
            };
            resize();
            window.addEventListener('resize', resize);

            // Drawing events
            const startDraw = (e) => {
                isDrawing = true;
                [lastX, lastY] = getPos(e);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                const [x, y] = getPos(e);

                // Draw locally
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(x, y);
                ctx.strokeStyle = currentColor;
                ctx.lineWidth = brushSize;
                ctx.lineCap = 'round';
                ctx.stroke();

                // Send to others
                if (ws) {
                    ws.send(JSON.stringify({
                        type: 'whiteboard-draw',
                        data: {
                            x0: lastX / canvas.width,
                            y0: lastY / canvas.height,
                            x1: x / canvas.width,
                            y1: y / canvas.height,
                            color: currentColor,
                            width: brushSize
                        }
                    }));
                }

                [lastX, lastY] = [x, y];
            };

            const endDraw = () => isDrawing = false;

            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', endDraw);
            canvas.addEventListener('mouseout', endDraw);

            // Touch support
            canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e.touches[0]); });
            canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e.touches[0]); });
            canvas.addEventListener('touchend', endDraw);

            // Controls
            document.querySelectorAll('.color-dot').forEach(btn => {
                btn.onclick = () => {
                    document.querySelector('.color-dot.active').classList.remove('active');
                    btn.classList.add('active');
                    currentColor = btn.dataset.color;
                };
            });

            brushSizeInput.oninput = (e) => brushSize = e.target.value;

            clearCanvasBtn.onclick = () => {
                clearCanvas(true);
            };
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            return [
                e.clientX - rect.left,
                e.clientY - rect.top
            ];
        }

        function drawFromRemote(data) {
            if (!ctx) return;
            const x0 = data.x0 * canvas.width;
            const y0 = data.y0 * canvas.height;
            const x1 = data.x1 * canvas.width;
            const y1 = data.y1 * canvas.height;

            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1);
            ctx.strokeStyle = data.color;
            ctx.lineWidth = data.width;
            ctx.lineCap = 'round';
            ctx.stroke();
        }

        function clearCanvas(broadcast) {
            if (!ctx) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (broadcast && ws) {
                ws.send(JSON.stringify({ type: 'whiteboard-clear' }));
            }
        }


        // =========================================================================
        // Chat & Participants
        // =========================================================================
        function updateParticipants(list) {
            participantsList.innerHTML = '';
            participantCount.textContent = list.length;

            list.forEach(p => {
                const div = document.createElement('div');
                div.className = 'participant-item';
                div.innerHTML = `
                    <div class="participant-avatar">${p.name[0].toUpperCase()}</div>
                    <div class="flex-1 overflow-hidden">
                        <div class="truncate font-medium text-sm flex items-center gap-1">
                            ${p.name}
                            ${p.is_host ? '<span class="icon text-brand-500 text-sm" title="Host">star</span>' : ''}
                            ${p.user_id === userId ? '<span class="opacity-50">(You)</span>' : ''}
                        </div>
                    </div>
                `;
                participantsList.appendChild(div);
            });
        }

        function addParticipant(p) {
            // Re-fetch list from server or just append? 
            // Simplest is to just append if not exists
            // But we don't have full list in variable, so maybe request room info again?
            // Or just UI append:
            const div = document.createElement('div');
            div.className = 'participant-item';
            div.id = `p-${p.user_id}`;
            div.innerHTML = `
                <div class="participant-avatar">${p.name[0].toUpperCase()}</div>
                <div class="flex-1 overflow-hidden">
                    <div class="truncate font-medium text-sm flex items-center gap-1">
                        ${p.name}
                        ${p.is_host ? '<span class="icon text-brand-500 text-sm" title="Host">star</span>' : ''}
                    </div>
                </div>
            `;
            participantsList.appendChild(div);
            participantCount.textContent = parseInt(participantCount.textContent) + 1;
        }

        function removeParticipant(uid) {
            const el = document.getElementById(`p-${uid}`);
            if (el) el.remove();
            participantCount.textContent = Math.max(0, parseInt(participantCount.textContent) - 1);
        }

        function addChatMessage(data) {
            const div = document.createElement('div');
            const isMine = data.user_id === userId;
            div.className = `chat-bubble ${isMine ? 'chat-mine' : 'chat-theirs'}`;
            div.innerHTML = `
                <div class="text-xs opacity-70 mb-0.5 flex justify-between gap-4">
                    <span>${data.name}</span>
                    <span>${new Date(data.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                </div>
                <div>${data.message}</div>
            `;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        chatForm.onsubmit = (e) => {
            e.preventDefault();
            const msg = chatInput.value.trim();
            if (!msg || !ws) return;

            ws.send(JSON.stringify({
                type: 'chat-message',
                data: { message: msg }
            }));
            chatInput.value = '';
        };

        // =========================================================================
        // Init
        // =========================================================================

        // Check URL params
        const params = new URLSearchParams(window.location.search);
        const roomParam = params.get('room');

        // Theme init
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }

        // Setup UI
        copyLinkBtn.onclick = () => {
            const link = window.location.href;
            navigator.clipboard.writeText(link);
            showToast('Link copied to clipboard');
        };

        leaveBtn.onclick = leaveRoom;

        if (roomParam) {
            roomId = roomParam;
            joinRoom();
        } else {
            window.location.replace('create_meet.html');
        }

    </script>
