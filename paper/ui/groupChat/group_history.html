<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Call History — PaperX</title>
    <link rel="stylesheet" href="../assets/css/tailwind.css" />
    <script src="../config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300;400;600&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --brand-50: #eef4ff;
            --brand-100: #d9e6ff;
            --brand-500: #3f6fff;
            --brand-600: #2f56e6;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(0, 0, 0, 0.08);
        }

        .dark {
            --glass-bg: rgba(20, 24, 33, 0.85);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        .icon {
            font-family: 'Material Symbols Outlined';
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: saturate(1.2) blur(12px);
            -webkit-backdrop-filter: saturate(1.2) blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 1rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3f6fff 0%, #628fff 100%);
            color: white;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(63, 111, 255, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #f87171 100%);
            color: white;
            transition: all 0.2s ease;
        }

        .btn-danger:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }
    </style>
</head>

<body
    class="bg-gradient-to-br from-slate-50 to-blue-50 dark:from-[#0a0d12] dark:to-[#0f1419] text-[#0d1117] dark:text-zinc-100 min-h-screen">

    <!-- Header -->
    <header class="sticky top-0 z-50 glass-card border-0 border-b rounded-none mb-8">
        <nav class="container mx-auto px-4 flex items-center justify-between py-3">
            <div class="flex items-center gap-3">
                <a href="../../index.html" class="flex items-center gap-2 font-semibold hover:opacity-80 transition">
                    <span
                        class="inline-flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-brand-500 to-brand-600 text-white shadow-lg">
                        <span class="icon text-lg">groups</span>
                    </span>
                    <span class="hidden sm:inline">PaperX Call History</span>
                </a>
            </div>

            <div class="flex items-center gap-3">
                <a href="create_meet.html"
                    class="btn-primary px-4 py-2 rounded-xl text-sm font-medium flex items-center gap-2">
                    <span class="icon text-lg">add_call</span>
                    New Call
                </a>
                <button onclick="Theme.toggle()"
                    class="p-2 rounded-xl hover:bg-black/5 dark:hover:bg-white/5 transition">
                    <span class="icon">dark_mode</span>
                </button>
            </div>
        </nav>
    </header>

    <main class="container mx-auto px-4 max-w-5xl pb-12">

        <!-- Active Calls Section -->
        <section class="mb-10">
            <h2 class="text-2xl font-bold mb-4 flex items-center gap-2">
                <span class="icon text-green-500">sensors</span>
                Active Calls
            </h2>
            <p class="text-black/60 dark:text-white/60 mb-6">Calls you created that are currently running.</p>

            <div id="activeCallsList" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
                <!-- Loading State -->
                <div class="col-span-full py-8 text-center opacity-50">
                    Loading active calls...
                </div>
            </div>
        </section>

        <hr class="border-black/10 dark:border-white/10 mb-10" />

        <!-- History Section -->
        <section>
            <h2 class="text-2xl font-bold mb-4 flex items-center gap-2">
                <span class="icon text-brand-500">history</span>
                Recent History
            </h2>
            <p class="text-black/60 dark:text-white/60 mb-6">Past calls you hosted or attended.</p>

            <div class="glass-card overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-black/10 dark:border-white/10 bg-black/5 dark:bg-white/5">
                                <th class="p-4 font-semibold text-sm">Room Name</th>
                                <th class="p-4 font-semibold text-sm">Date</th>
                                <th class="p-4 font-semibold text-sm">Host</th>
                                <th class="p-4 font-semibold text-sm">Status</th>
                                <th class="p-4 font-semibold text-sm text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody">
                            <tr>
                                <td colspan="5" class="p-8 text-center opacity-50">Loading history...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <!-- Toasts -->
    <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 hidden">
        <div class="glass-card px-6 py-3 flex items-center gap-3 shadow-xl">
            <span id="toastIcon" class="icon text-brand-500">check_circle</span>
            <span id="toastText"></span>
        </div>
    </div>

    <script>
        const API = (window.API_BASE || 'http://127.0.0.1:8000').replace(/\/$/, '');
        const token = localStorage.getItem('px_token');

        // Helpers
        const el = id => document.getElementById(id);
        const showToast = (msg, icon = 'check_circle') => {
            const t = el('toast');
            el('toastText').innerText = msg;
            el('toastIcon').innerText = icon;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3000);
        };

        function formatDate(isoStr) {
            if (!isoStr) return 'N/A';
            return new Date(isoStr).toLocaleString();
        }

        // Fetch Data
        async function fetchHistory() {
            if (!token) {
                window.location.href = '../auth/login.html';
                return;
            }

            try {
                const res = await fetch(`${API}/api/group-chat/history`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) throw new Error("Failed to load history");

                const data = await res.json();
                renderActiveCalls(data.active_created);
                renderHistory(data.history);

            } catch (e) {
                console.error(e);
                el('activeCallsList').innerHTML = `<div class="col-span-full text-center text-red-500">Error loading data.</div>`;
                el('historyTableBody').innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-500">Error loading history.</td></tr>`;
            }
        }

        function renderActiveCalls(calls) {
            const container = el('activeCallsList');
            if (!calls || calls.length === 0) {
                container.innerHTML = `<div class="col-span-full py-8 text-center opacity-60 bg-black/5 dark:bg-white/5 rounded-xl border border-dashed border-black/10 dark:border-white/10">
                    No active calls found.
                </div>`;
                return;
            }

            container.innerHTML = calls.map(call => `
                <div class="glass-card p-5 relative group hover:border-brand-500/50 transition">
                    <div class="flex justify-between items-start mb-3">
                        <div class="font-bold text-lg truncate pr-2">${call.room_name}</div>
                        <span class="inline-flex items-center px-2 py-1 rounded text-xs font-medium bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400">
                             <span class="w-1.5 h-1.5 rounded-full bg-green-500 mr-1.5 animate-pulse"></span>
                             Active
                        </span>
                    </div>
                    
                    <div class="text-sm opacity-70 mb-5">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="icon text-base">calendar_today</span>
                            ${formatDate(call.created_at)}
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="icon text-base">fingerprint</span>
                            ID: ${call.id}
                        </div>
                    </div>

                    <div class="flex gap-2">
                        <a href="group_chat.html?room=${call.id}" class="btn-primary flex-1 py-2 rounded-lg text-center text-sm font-medium">
                            Join Details
                        </a>
                        <button onclick="endCall('${call.id}')" class="btn-danger px-3 py-2 rounded-lg" title="End Call">
                            <span class="icon">call_end</span>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function renderHistory(calls) {
            const tbody = el('historyTableBody');
            if (!calls || calls.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center opacity-50">No call history found.</td></tr>`;
                return;
            }

            tbody.innerHTML = calls.map(call => {
                const isEnded = call.status === 'ended';
                const statusClass = isEnded
                    ? 'bg-black/10 dark:bg-white/10 text-black/60 dark:text-white/60'
                    : 'bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-400';

                return `
                <tr class="border-b border-black/5 dark:border-white/5 hover:bg-black/5 dark:hover:bg-white/5 transition">
                    <td class="p-4 font-medium">${call.room_name}</td>
                    <td class="p-4 text-sm opacity-75">${formatDate(call.created_at)}</td>
                    <td class="p-4 text-sm opacity-75 truncate max-w-[150px]">${call.host_user_id || 'Unknown'}</td>
                    <td class="p-4">
                        <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium ${statusClass}">
                            ${call.status}
                        </span>
                    </td>
                    <td class="p-4 text-right">
                         ${!isEnded ? `<a href="group_chat.html?room=${call.id}" class="text-brand-500 hover:underline text-sm font-medium">Join</a>` : '<span class="opacity-30 text-sm">-</span>'}
                    </td>
                </tr>
                `;
            }).join('');
        }

        async function endCall(roomId) {
            if (!confirm("Are you sure you want to end this call? This will disconnect all participants.")) return;

            try {
                const res = await fetch(`${API}/api/group-chat/end`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ room_id: roomId })
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || "Failed to end call");
                }

                showToast("Call ended successfully");
                fetchHistory(); // Refresh

            } catch (e) {
                console.error(e);
                showToast(e.message, 'error');
            }
        }

        // Initial Load
        document.addEventListener('DOMContentLoaded', fetchHistory);

        // Theme Support (reusing from config.js logic ideally, but minimal here)
        window.Theme = {
            toggle: () => {
                const isDark = document.documentElement.classList.toggle('dark');
                localStorage.setItem('px_theme', isDark ? 'dark' : 'light');
            }
        };
        if (localStorage.getItem('px_theme') === 'dark' || (!('px_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }

    </script>

    <!-- Marker overlay (browser-only) -->
    <script src="../assets/js/marker_overlay.js"></script>
</body>

</html>
