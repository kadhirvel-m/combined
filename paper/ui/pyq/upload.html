<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PYQ Upload - Paper X</title>
  <link rel="icon" type="image/x-icon" href="../assets/img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/tailwind.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../config.js"></script>
  <script src="pyq-common.js"></script>
  <link rel="stylesheet" href="pyq.css" />
</head>
<body class="min-h-screen bg-[radial-gradient(1100px_650px_at_50%_-10%,rgba(158,75,138,0.2),transparent_60%),linear-gradient(180deg,#ffffff_0%,#fbf8fc_50%,#f7f2f9_100%)] text-[#1E1E2F]">
  <header class="sticky top-0 z-20 border-b border-black/10 bg-white/70 backdrop-blur-xl">
    <div class="container mx-auto flex flex-wrap items-center justify-between gap-3 px-4 py-4">
      <a href="index.html" class="text-lg font-extrabold">PYQ Upload Center</a>
      <nav class="flex flex-wrap gap-2 text-sm">
        <a href="index.html" class="rounded-full border border-black/10 px-4 py-2">Dashboard</a>
        <a href="upload.html" class="rounded-full bg-[#9E4B8A] px-4 py-2 font-semibold text-white">Upload</a>
        <a href="view.html" class="rounded-full border border-black/10 px-4 py-2">View</a>
        <a href="manage.html" class="rounded-full border border-black/10 px-4 py-2">Manage</a>
        <a href="reports.html" class="rounded-full border border-black/10 px-4 py-2">Reports</a>
      </nav>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8">
    <section class="glass-card rounded-3xl border border-white/70 p-6 shadow-[0_28px_70px_-28px_rgba(30,30,47,0.45)]">
      <h1 class="text-2xl font-extrabold">Add New PYQ Record</h1>
      <p class="mt-1 text-sm text-black/60">Uploads are stored in Google Cloud Storage and indexed in your DB table.</p>

      <form id="uploadForm" class="mt-5 grid gap-5 lg:grid-cols-2">
        <div class="space-y-3 rounded-2xl border border-black/10 bg-white/70 p-4">
          <h2 class="text-sm font-bold uppercase tracking-wide text-black/60">Academic Mapping</h2>
          <div>
            <label class="mb-1 block text-xs font-semibold text-black/50">College</label>
            <select id="collegeSel" required class="w-full rounded-xl border border-black/15 bg-white px-3 py-2 text-sm"></select>
          </div>
          <div>
            <label class="mb-1 block text-xs font-semibold text-black/50">Degree</label>
            <select id="degreeSel" required class="w-full rounded-xl border border-black/15 bg-white px-3 py-2 text-sm"></select>
          </div>
          <div>
            <label class="mb-1 block text-xs font-semibold text-black/50">Department</label>
            <select id="departmentSel" required class="w-full rounded-xl border border-black/15 bg-white px-3 py-2 text-sm"></select>
          </div>
        </div>

        <div class="space-y-3 rounded-2xl border border-black/10 bg-white/70 p-4">
          <h2 class="text-sm font-bold uppercase tracking-wide text-black/60">Paper Details</h2>
          <div class="grid gap-3 sm:grid-cols-2">
            <input id="title" required placeholder="Title" class="rounded-xl border border-black/15 px-3 py-2 text-sm" />
            <input id="subject" required placeholder="Subject" class="rounded-xl border border-black/15 px-3 py-2 text-sm" />
            <input id="examYear" type="number" min="1950" max="2100" placeholder="Exam Year" class="rounded-xl border border-black/15 px-3 py-2 text-sm" />
            <input id="semester" placeholder="Semester" class="rounded-xl border border-black/15 px-3 py-2 text-sm" />
            <input id="examType" placeholder="Exam Type" class="rounded-xl border border-black/15 px-3 py-2 text-sm" />
            <input id="uploadedBy" placeholder="Uploaded By" class="rounded-xl border border-black/15 px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="mb-1 block text-xs font-semibold text-black/50">File (stored in Google bucket)</label>
            <input id="fileInput" type="file" class="w-full rounded-xl border border-black/15 bg-white px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="mb-1 block text-xs font-semibold text-black/50">Optional External File URL</label>
            <input id="fileUrl" placeholder="https://..." class="w-full rounded-xl border border-black/15 px-3 py-2 text-sm" />
          </div>
          <textarea id="notes" placeholder="Notes" class="min-h-[90px] w-full rounded-xl border border-black/15 px-3 py-2 text-sm"></textarea>
        </div>

        <div class="lg:col-span-2 flex flex-wrap gap-3">
          <button type="submit" class="rounded-xl bg-[#9E4B8A] px-5 py-2.5 text-sm font-semibold text-white">Upload / Save</button>
          <button type="button" id="resetBtn" class="rounded-xl border border-black/15 bg-white px-5 py-2.5 text-sm font-semibold">Reset</button>
          <span id="status" class="self-center text-sm text-black/65"></span>
        </div>
      </form>
    </section>
  </main>

  <script>
    (async function () {
      const form = PYQ.qs('uploadForm');
      const statusEl = PYQ.qs('status');
      const fileInput = PYQ.qs('fileInput');
      PYQ.qs('examYear').value = String(new Date().getFullYear());

      let selectedCtx = { college: null, degree: null, department: null };
      await PYQ.wireAcademicCascade({
        collegeSelect: PYQ.qs('collegeSel'),
        degreeSelect: PYQ.qs('degreeSel'),
        departmentSelect: PYQ.qs('departmentSel'),
        onChange: function (ctx) { selectedCtx = ctx; }
      });

      function setStatus(msg, ok) {
        statusEl.textContent = msg;
        statusEl.className = 'self-center text-sm ' + (ok ? 'text-emerald-700' : 'text-rose-700');
      }

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        if (!selectedCtx.college || !selectedCtx.degree || !selectedCtx.department) {
          setStatus('Select college, degree, and department.', false);
          return;
        }

        const file = fileInput.files && fileInput.files[0] ? fileInput.files[0] : null;
        try {
          if (file) {
            const fd = new FormData();
            fd.append('file', file);
            fd.append('title', PYQ.qs('title').value.trim());
            fd.append('subject', PYQ.qs('subject').value.trim());
            fd.append('exam_year', PYQ.qs('examYear').value.trim());
            fd.append('semester', PYQ.qs('semester').value.trim());
            fd.append('exam_type', PYQ.qs('examType').value.trim());
            fd.append('college_id', selectedCtx.college.id || '');
            fd.append('college_name', selectedCtx.college.name || '');
            fd.append('degree_id', selectedCtx.degree.id || '');
            fd.append('degree_name', selectedCtx.degree.name || '');
            fd.append('department_id', selectedCtx.department.id || '');
            fd.append('department_name', selectedCtx.department.name || '');
            fd.append('notes', PYQ.qs('notes').value.trim());
            fd.append('uploaded_by', PYQ.qs('uploadedBy').value.trim());

            const res = await fetch(PYQ.getApiBase() + '/api/pyq/upload', { method: 'POST', body: fd });
            if (!res.ok) {
              const e = await res.json().catch(() => ({}));
              throw new Error(e.detail || 'Upload failed');
            }
            setStatus('Uploaded to Google bucket and saved in DB.', true);
          } else {
            const payload = {
              title: PYQ.qs('title').value.trim(),
              subject: PYQ.qs('subject').value.trim(),
              exam_year: Number(PYQ.qs('examYear').value),
              semester: PYQ.qs('semester').value.trim(),
              exam_type: PYQ.qs('examType').value.trim(),
              college_id: selectedCtx.college.id,
              college_name: selectedCtx.college.name,
              degree_id: selectedCtx.degree.id,
              degree_name: selectedCtx.degree.name,
              department_id: selectedCtx.department.id,
              department_name: selectedCtx.department.name,
              notes: PYQ.qs('notes').value.trim(),
              uploaded_by: PYQ.qs('uploadedBy').value.trim(),
              file_url: PYQ.qs('fileUrl').value.trim(),
              file_name: '',
              status: 'active'
            };
            const out = await PYQ.saveRecord(payload);
            setStatus('Saved metadata using ' + (out.source === 'api' ? 'API' : 'local fallback') + '.', true);
          }
          form.reset();
          PYQ.qs('examYear').value = String(new Date().getFullYear());
        } catch (err) {
          setStatus(err.message || 'Unable to save record.', false);
        }
      });

      PYQ.qs('resetBtn').addEventListener('click', function () {
        form.reset();
        PYQ.qs('examYear').value = String(new Date().getFullYear());
        setStatus('', true);
      });
    })();
  </script>
</body>
</html>
