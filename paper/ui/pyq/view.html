<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PYQ View - Paper X</title>
  <link rel="icon" type="image/x-icon" href="../assets/img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/tailwind.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../config.js"></script>
  <script src="pyq-common.js"></script>
  <link rel="stylesheet" href="pyq.css" />
</head>
<body class="min-h-screen bg-[radial-gradient(1100px_650px_at_50%_-10%,rgba(158,75,138,0.2),transparent_60%),linear-gradient(180deg,#ffffff_0%,#fbf8fc_50%,#f7f2f9_100%)] text-[#1E1E2F]">
  <header class="sticky top-0 z-20 border-b border-black/10 bg-white/70 backdrop-blur-xl">
    <div class="container mx-auto flex flex-wrap items-center justify-between gap-3 px-4 py-4">
      <a href="index.html" class="text-lg font-extrabold">PYQ Library</a>
      <nav class="flex flex-wrap gap-2 text-sm">
        <a href="index.html" class="rounded-full border border-black/10 px-4 py-2">Dashboard</a>
        <a href="upload.html" class="rounded-full border border-black/10 px-4 py-2">Upload</a>
        <a href="view.html" class="rounded-full bg-[#9E4B8A] px-4 py-2 font-semibold text-white">View</a>
        <a href="manage.html" class="rounded-full border border-black/10 px-4 py-2">Manage</a>
        <a href="reports.html" class="rounded-full border border-black/10 px-4 py-2">Reports</a>
      </nav>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8 space-y-4">
    <section class="glass-card rounded-3xl border border-white/70 p-6 shadow-[0_28px_70px_-28px_rgba(30,30,47,0.45)]">
      <h1 class="text-2xl font-extrabold">Browse Previous Year Papers</h1>
      <p class="mt-1 text-sm text-black/60">Filter by college, degree, department and free text.</p>
      <div class="mt-4 grid gap-3 md:grid-cols-4">
        <select id="collegeSel" class="rounded-xl border border-black/15 bg-white px-3 py-2 text-sm"></select>
        <select id="degreeSel" class="rounded-xl border border-black/15 bg-white px-3 py-2 text-sm"></select>
        <select id="departmentSel" class="rounded-xl border border-black/15 bg-white px-3 py-2 text-sm"></select>
        <input id="query" placeholder="Search title/subject/exam" class="rounded-xl border border-black/15 bg-white px-3 py-2 text-sm" />
      </div>
      <div class="mt-3 flex items-center gap-2">
        <button id="applyBtn" class="rounded-xl bg-[#9E4B8A] px-4 py-2 text-sm font-semibold text-white">Apply</button>
        <span id="status" class="text-sm text-black/65"></span>
      </div>
    </section>

    <section id="cards" class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3"></section>
  </main>

  <script>
    (async function () {
      const cards = PYQ.qs('cards');
      const status = PYQ.qs('status');
      const selected = { college_id: '', degree_id: '', department_id: '', query: '' };

      await PYQ.wireAcademicCascade({
        collegeSelect: PYQ.qs('collegeSel'),
        degreeSelect: PYQ.qs('degreeSel'),
        departmentSelect: PYQ.qs('departmentSel'),
        onChange: function (ctx) {
          selected.college_id = ctx.college ? ctx.college.id : '';
          selected.degree_id = ctx.degree ? ctx.degree.id : '';
          selected.department_id = ctx.department ? ctx.department.id : '';
        }
      });

      async function render() {
        selected.query = PYQ.qs('query').value.trim();
        const res = await PYQ.listRecords(selected);
        const rows = res.rows || [];
        status.textContent = rows.length + ' records • ' + (res.source === 'api' ? 'API source' : 'local fallback');

        cards.innerHTML = '';
        if (!rows.length) {
          cards.innerHTML = '<article class="rounded-2xl border border-dashed border-black/20 bg-white/60 p-5 text-sm text-black/60">No records matched your filters.</article>';
          return;
        }

        rows.forEach((item) => {
          const article = document.createElement('article');
          article.className = 'glass-card rounded-2xl border border-white/70 p-4';
          const filePart = item.file_url
            ? '<a class="text-[#9E4B8A] underline" href="' + encodeURI(item.file_url) + '" target="_blank" rel="noopener">Open file</a>'
            : '<span class="text-black/50">No file URL</span>';
          article.innerHTML =
            '<div class="flex items-start justify-between gap-2"><h3 class="font-bold">' + escapeHtml(item.title || 'Untitled') + '</h3><span class="rounded-full bg-black/5 px-2 py-1 text-[11px]">' + escapeHtml(item.exam_type || 'General') + '</span></div>' +
            '<p class="mt-1 text-sm text-black/70">' + escapeHtml(item.subject || '-') + '</p>' +
            '<p class="mt-1 text-xs text-black/60">Year: ' + escapeHtml(item.exam_year || '-') + ' | Sem: ' + escapeHtml(item.semester || '-') + '</p>' +
            '<p class="mt-2 text-xs text-black/55">' + escapeHtml((item.college_name || '-') + ' / ' + (item.degree_name || '-') + ' / ' + (item.department_name || '-')) + '</p>' +
            '<div class="mt-3 text-sm">' + filePart + '</div>';
          cards.appendChild(article);
        });
      }

      PYQ.qs('applyBtn').addEventListener('click', render);
      PYQ.qs('query').addEventListener('keydown', function (event) { if (event.key === 'Enter') render(); });
      render();
    })();
  </script>
</body>
</html>
