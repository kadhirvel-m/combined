<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PYQ Manage - Paper X</title>
  <link rel="icon" type="image/x-icon" href="../assets/img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/tailwind.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../config.js"></script>
  <script src="pyq-common.js"></script>
  <link rel="stylesheet" href="pyq.css" />
</head>
<body class="min-h-screen bg-[radial-gradient(1100px_650px_at_50%_-10%,rgba(158,75,138,0.2),transparent_60%),linear-gradient(180deg,#ffffff_0%,#fbf8fc_50%,#f7f2f9_100%)] text-[#1E1E2F]">
  <header class="sticky top-0 z-20 border-b border-black/10 bg-white/70 backdrop-blur-xl">
    <div class="container mx-auto flex flex-wrap items-center justify-between gap-3 px-4 py-4">
      <a href="index.html" class="text-lg font-extrabold">PYQ Management</a>
      <nav class="flex flex-wrap gap-2 text-sm">
        <a href="index.html" class="rounded-full border border-black/10 px-4 py-2">Dashboard</a>
        <a href="upload.html" class="rounded-full border border-black/10 px-4 py-2">Upload</a>
        <a href="view.html" class="rounded-full border border-black/10 px-4 py-2">View</a>
        <a href="manage.html" class="rounded-full bg-[#9E4B8A] px-4 py-2 font-semibold text-white">Manage</a>
        <a href="reports.html" class="rounded-full border border-black/10 px-4 py-2">Reports</a>
      </nav>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8 space-y-4">
    <section class="glass-card rounded-3xl border border-white/70 p-6">
      <h1 class="text-2xl font-extrabold">Manage Uploaded Papers</h1>
      <div class="mt-4 grid gap-3 md:grid-cols-3">
        <select id="collegeSel" class="rounded-xl border border-black/15 bg-white px-3 py-2 text-sm"></select>
        <select id="degreeSel" class="rounded-xl border border-black/15 bg-white px-3 py-2 text-sm"></select>
        <select id="departmentSel" class="rounded-xl border border-black/15 bg-white px-3 py-2 text-sm"></select>
      </div>
      <p id="status" class="mt-3 text-sm text-black/65"></p>
    </section>

    <section class="glass-card rounded-3xl border border-white/70 p-4">
      <div class="custom-scrollbar overflow-auto">
        <table class="min-w-full text-sm">
          <thead>
            <tr class="border-b border-black/10 text-left text-xs uppercase tracking-wide text-black/55">
              <th class="px-3 py-2">Title</th>
              <th class="px-3 py-2">Subject</th>
              <th class="px-3 py-2">Year</th>
              <th class="px-3 py-2">Status</th>
              <th class="px-3 py-2">Actions</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    (async function () {
      const statusEl = PYQ.qs('status');
      const rowsEl = PYQ.qs('rows');

      function setStatus(msg, ok) {
        statusEl.textContent = msg;
        statusEl.className = 'mt-3 text-sm ' + (ok ? 'text-emerald-700' : 'text-rose-700');
      }

      async function render() {
        const out = await PYQ.listRecords({
          college_id: PYQ.qs('collegeSel').value,
          degree_id: PYQ.qs('degreeSel').value,
          department_id: PYQ.qs('departmentSel').value
        });
        const rows = out.rows || [];
        setStatus(rows.length + ' records • ' + (out.source === 'api' ? 'API source' : 'local fallback'), true);

        rowsEl.innerHTML = '';
        if (!rows.length) {
          rowsEl.innerHTML = '<tr><td colspan="5" class="px-3 py-4 text-black/60">No records in selected scope.</td></tr>';
          return;
        }

        rows.forEach((row) => {
          const tr = document.createElement('tr');
          tr.className = 'border-b border-black/5';
          tr.innerHTML =
            '<td class="px-3 py-2"><p class="font-semibold">' + escapeHtml(row.title || '-') + '</p><p class="text-xs text-black/55">' + escapeHtml((row.college_name || '-') + ' / ' + (row.department_name || '-')) + '</p></td>' +
            '<td class="px-3 py-2">' + escapeHtml(row.subject || '-') + '</td>' +
            '<td class="px-3 py-2">' + escapeHtml(row.exam_year || '-') + '</td>' +
            '<td class="px-3 py-2"><select data-role="status" data-id="' + row.id + '" class="rounded-lg border border-black/15 bg-white px-2 py-1 text-xs"><option value="active"' + (row.status === 'active' ? ' selected' : '') + '>active</option><option value="archived"' + (row.status === 'archived' ? ' selected' : '') + '>archived</option><option value="blocked"' + (row.status === 'blocked' ? ' selected' : '') + '>blocked</option></select></td>' +
            '<td class="px-3 py-2"><div class="flex gap-2"><button data-role="save" data-id="' + row.id + '" class="rounded-lg border border-black/15 bg-white px-3 py-1 text-xs font-semibold">Save</button><button data-role="delete" data-id="' + row.id + '" class="rounded-lg border border-rose-300 bg-rose-50 px-3 py-1 text-xs font-semibold text-rose-700">Delete</button></div></td>';
          rowsEl.appendChild(tr);
        });
      }

      rowsEl.addEventListener('click', async function (event) {
        const btn = event.target.closest('button');
        if (!btn) return;
        const id = btn.getAttribute('data-id');
        const role = btn.getAttribute('data-role');

        try {
          if (role === 'delete') {
            if (!confirm('Delete this record?')) return;
            await PYQ.deleteRecord(id);
            setStatus('Record deleted.', true);
            await render();
            return;
          }

          if (role === 'save') {
            const sel = rowsEl.querySelector('select[data-id="' + id + '"]');
            await PYQ.updateRecord(id, { status: sel ? sel.value : 'active' });
            setStatus('Record updated.', true);
            await render();
          }
        } catch (error) {
          setStatus(error.message || 'Action failed.', false);
        }
      });

      await PYQ.wireAcademicCascade({ collegeSelect: PYQ.qs('collegeSel'), degreeSelect: PYQ.qs('degreeSel'), departmentSelect: PYQ.qs('departmentSel'), onChange: render });
      render();
    })();
  </script>
</body>
</html>
