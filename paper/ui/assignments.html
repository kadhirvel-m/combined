<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Assignments — Paper X</title>
    <link rel="icon" type="image/x-icon" href="assets/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/tailwind.css" />
    <script src="config.js"></script>
    <style>
        :root {
            --brand: #9E4B8A;
            --brand-dark: #1E1E2F;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(180deg, #fff 0%, #FBF8FC 45%, #F7F2F9 100%);
            min-height: 100vh;
        }

        .dark body {
            background: linear-gradient(180deg, #1E1E2F 0%, #201934 35%, #141321 100%);
        }

        .material-symbols-rounded {
            vertical-align: -6px;
            font-variation-settings: 'FILL' 0, 'wght' 500;
        }

        .card {
            background: rgba(255, 255, 255, .85);
            backdrop-filter: blur(8px);
            border-radius: 1rem;
            border: 1px solid rgba(0, 0, 0, .08);
            padding: 1.25rem;
        }

        .dark .card {
            background: rgba(30, 30, 47, .6);
            border-color: rgba(255, 255, 255, .1);
        }

        .skeleton {
            background: linear-gradient(90deg, rgba(0, 0, 0, .06) 25%, rgba(0, 0, 0, .1) 50%, rgba(0, 0, 0, .06) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: .5rem;
        }

        .dark .skeleton {
            background: linear-gradient(90deg, rgba(255, 255, 255, .05) 25%, rgba(255, 255, 255, .1) 50%, rgba(255, 255, 255, .05) 75%);
            background-size: 200% 100%;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: .25rem;
            padding: .25rem .625rem;
            border-radius: 9999px;
            font-size: .6875rem;
            font-weight: 600;
        }

        .badge-pending {
            background: #FEF3C7;
            color: #B45309;
        }

        .badge-submitted {
            background: #DBEAFE;
            color: #1D4ED8;
        }

        .badge-graded {
            background: #D1FAE5;
            color: #047857;
        }

        .badge-overdue {
            background: #FEE2E2;
            color: #DC2626;
        }

        .dark .badge-pending {
            background: rgba(245, 158, 11, .2);
            color: #FCD34D;
        }

        .dark .badge-submitted {
            background: rgba(59, 130, 246, .2);
            color: #93C5FD;
        }

        .dark .badge-graded {
            background: rgba(16, 185, 129, .2);
            color: #6EE7B7;
        }

        .dark .badge-overdue {
            background: rgba(239, 68, 68, .2);
            color: #FCA5A5;
        }

        .filter-btn {
            padding: .5rem 1rem;
            border-radius: 9999px;
            font-size: .875rem;
            font-weight: 500;
            border: 1px solid rgba(0, 0, 0, .1);
            transition: all .15s;
        }

        .dark .filter-btn {
            border-color: rgba(255, 255, 255, .15);
            color: #fff;
        }

        .filter-btn.active {
            background: var(--brand);
            color: #fff;
            border-color: var(--brand);
        }

        .filter-btn:not(.active):hover {
            background: rgba(0, 0, 0, .05);
        }

        .dark .filter-btn:not(.active):hover {
            background: rgba(255, 255, 255, .08);
        }

        .btn-primary {
            background: var(--brand);
            color: #fff;
            padding: .75rem 1.25rem;
            border-radius: .75rem;
            font-weight: 600;
            font-size: .875rem;
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            transition: all .2s;
        }

        .btn-primary:hover {
            box-shadow: 0 8px 24px rgba(158, 75, 138, .35);
            transform: translateY(-1px);
        }
    </style>
    <script>if (localStorage.getItem('px_theme') === 'dark' || (!localStorage.getItem('px_theme') && matchMedia('(prefers-color-scheme:dark)').matches)) document.documentElement.classList.add('dark');</script>
</head>

<body class="text-neutral-900 dark:text-white">
    <header
        class="sticky top-0 z-40 bg-white/80 dark:bg-[#1E1E2F]/80 backdrop-blur border-b border-black/5 dark:border-white/10">
        <div class="max-w-6xl mx-auto px-4 flex items-center justify-between py-3">
            <div class="flex items-center gap-3">
                <a href="index.html"><img src="assets/img/logo-light.svg" class="h-8 dark:hidden" alt=""><img
                        src="assets/img/logo-dark.svg" class="h-8 hidden dark:block" alt=""></a>
                <h1 class="text-lg font-semibold hidden sm:block">My Assignments</h1>
            </div>
            <div class="flex items-center gap-3">
                <a href="profile.html"
                    class="text-sm text-neutral-500 hover:text-neutral-900 dark:hover:text-white flex items-center gap-1"><span
                        class="material-symbols-rounded text-lg">person</span><span
                        class="hidden sm:inline">Profile</span></a>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6">
        <!-- Stats -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6" id="stats">
            <div class="card flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-blue-500/10 flex items-center justify-center"><span
                        class="material-symbols-rounded text-blue-500">assignment</span></div>
                <div>
                    <p class="text-xl font-bold" id="sTotal">-</p>
                    <p class="text-xs text-neutral-500">Total</p>
                </div>
            </div>
            <div class="card flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-amber-500/10 flex items-center justify-center"><span
                        class="material-symbols-rounded text-amber-500">pending</span></div>
                <div>
                    <p class="text-xl font-bold" id="sPending">-</p>
                    <p class="text-xs text-neutral-500">Pending</p>
                </div>
            </div>
            <div class="card flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-emerald-500/10 flex items-center justify-center"><span
                        class="material-symbols-rounded text-emerald-500">check_circle</span></div>
                <div>
                    <p class="text-xl font-bold" id="sSubmitted">-</p>
                    <p class="text-xs text-neutral-500">Submitted</p>
                </div>
            </div>
            <div class="card flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-purple-500/10 flex items-center justify-center"><span
                        class="material-symbols-rounded text-purple-500">grade</span></div>
                <div>
                    <p class="text-xl font-bold" id="sGraded">-</p>
                    <p class="text-xs text-neutral-500">Graded</p>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="flex flex-wrap gap-2 mb-5" id="filters">
            <button class="filter-btn active" data-f="all">All</button>
            <button class="filter-btn" data-f="pending">Pending</button>
            <button class="filter-btn" data-f="submitted">Submitted</button>
            <button class="filter-btn" data-f="graded">Graded</button>
            <button class="filter-btn" data-f="overdue">Overdue</button>
        </div>

        <!-- List -->
        <div id="list" class="space-y-3">
            <!-- Skeleton loaders -->
            <div class="card">
                <div class="skeleton h-5 w-3/4 mb-3"></div>
                <div class="skeleton h-4 w-1/2 mb-2"></div>
                <div class="skeleton h-4 w-1/3"></div>
            </div>
            <div class="card">
                <div class="skeleton h-5 w-2/3 mb-3"></div>
                <div class="skeleton h-4 w-1/2 mb-2"></div>
                <div class="skeleton h-4 w-1/4"></div>
            </div>
        </div>

        <!-- Empty -->
        <div id="empty" class="hidden text-center py-16">
            <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-purple-500/10 flex items-center justify-center"><span
                    class="material-symbols-rounded text-3xl text-purple-500">assignment</span></div>
            <h3 class="text-lg font-semibold mb-1">No assignments</h3>
            <p class="text-sm text-neutral-500">You don't have any assignments yet</p>
        </div>
    </main>

    <script>
        const API = window.API_BASE || location.origin;
        const token = localStorage.getItem('px_token');
        if (!token) { location.href = 'login.html'; }

        let data = [], filter = 'all';

        const status = a => {
            if (a.is_graded) return 'graded';
            if (a.is_submitted) return 'submitted';
            if (new Date(a.due_date) < new Date()) return 'overdue';
            return 'pending';
        };

        const fmtDate = d => d ? new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '-';

        const dueText = (d, sub) => {
            if (sub) return '<span class="text-emerald-600 dark:text-emerald-400">Submitted</span>';
            const diff = Math.ceil((new Date(d) - Date.now()) / 864e5);
            if (diff < 0) return `<span class="text-red-500">Overdue</span>`;
            if (diff === 0) return '<span class="text-amber-500">Due today</span>';
            if (diff === 1) return '<span class="text-amber-500">Tomorrow</span>';
            if (diff <= 3) return `<span class="text-amber-500">${diff}d left</span>`;
            return fmtDate(d);
        };

        const badge = s => ({
            pending: '<span class="badge badge-pending"><span class="material-symbols-rounded text-xs">schedule</span>Pending</span>',
            submitted: '<span class="badge badge-submitted"><span class="material-symbols-rounded text-xs">check</span>Submitted</span>',
            graded: '<span class="badge badge-graded"><span class="material-symbols-rounded text-xs">grade</span>Graded</span>',
            overdue: '<span class="badge badge-overdue"><span class="material-symbols-rounded text-xs">warning</span>Overdue</span>'
        }[s] || '');

        function render() {
            const list = document.getElementById('list'), empty = document.getElementById('empty');
            let items = filter === 'all' ? data : data.filter(a => status(a) === filter);

            document.getElementById('sTotal').textContent = data.length;
            document.getElementById('sPending').textContent = data.filter(a => status(a) === 'pending').length;
            document.getElementById('sSubmitted').textContent = data.filter(a => status(a) === 'submitted').length;
            document.getElementById('sGraded').textContent = data.filter(a => status(a) === 'graded').length;

            if (!items.length) { list.innerHTML = ''; empty.classList.remove('hidden'); return; }
            empty.classList.add('hidden');

            list.innerHTML = items.map(a => {
                const s = status(a);
                const action = s === 'graded'
                    ? `<a href="assignment_result.html?id=${a.id}" class="btn-primary"><span class="material-symbols-rounded text-base">visibility</span>View Result</a>`
                    : s === 'overdue' && !a.is_submitted
                        ? '<span class="text-sm text-red-500">Closed</span>'
                        : `<a href="assignment_submit.html?id=${a.id}" class="btn-primary"><span class="material-symbols-rounded text-base">${a.is_submitted ? 'edit' : 'upload_file'}</span>${a.is_submitted ? 'Edit' : 'Submit'}</a>`;

                return `<div class="card flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-1">${badge(s)}<span class="text-xs">${dueText(a.due_date, a.is_submitted)}</span></div>
                        <h3 class="font-semibold truncate">${a.title}</h3>
                        <p class="text-sm text-neutral-500 truncate">${a.description || 'No description'}</p>
                        <div class="flex items-center gap-4 mt-2 text-xs text-neutral-400"><span class="flex items-center gap-1"><span class="material-symbols-rounded text-sm">grade</span>${a.max_marks || 100} pts</span></div>
                    </div>
                    <div class="flex-shrink-0">${action}</div>
                </div>`;
            }).join('');
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                filter = btn.dataset.f;
                render();
            };
        });

        (async () => {
            try {
                const res = await fetch(`${API}/api/student/assignments`, { headers: { Authorization: 'Bearer ' + token } });
                if (!res.ok) throw new Error();
                const json = await res.json();
                data = json.assignments || json || [];
                render();
            } catch (e) {
                document.getElementById('list').innerHTML = '<p class="text-center text-red-500 py-8">Failed to load</p>';
            }
        })();
    </script>
</body>

</html>
