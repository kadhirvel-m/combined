<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Academics — Pa[p]er X</title>
    <meta name="description" content="Your profile and syllabus overview." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="config.js"></script>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,-50..200" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { display: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#f0f7ff', 100: '#e0efff', 200: '#b9dbff', 300: '#8ac4ff', 400: '#59a9ff', 500: '#2b8cff', 600: '#116fe6', 700: '#0a57b4', 800: '#0b4890', 900: '#0d3a73' },
                        night: { 900: '#0a0c10', 800: '#0f131a', 700: '#141a22', 600: '#1a2230' }
                    },
                    boxShadow: { glow: '0 0 0 1px rgba(59,130,246,.2), 0 8px 40px rgba(59,130,246,.15)', neon: '0 0 25px rgba(43,140,255,.35), 0 0 60px rgba(43,140,255,.25)' },
                    backgroundImage: { 'grid-radial': 'radial-gradient(circle at 20% 10%, rgba(43,140,255,.25), transparent 35%), radial-gradient(circle at 80% 20%, rgba(168,85,247,.2), transparent 35%), radial-gradient(circle at 50% 80%, rgba(16,185,129,.2), transparent 35%)', 'glass': 'linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.04))' },
                    keyframes: { shimmer: { '0%': { backgroundPosition: '-200% 0' }, '100%': { backgroundPosition: '200% 0' } } },
                    animation: { shimmer: 'shimmer 2.5s linear infinite' }
                }
            }
        }
    </script>
    <style>
        .glass {
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .12)
        }

        .glass-dark {
            background: rgba(20, 24, 32, .55);
            border-color: rgba(255, 255, 255, .08)
        }
    </style>
</head>

<body
    class="font-display bg-white text-slate-900 dark:bg-night-900 dark:text-slate-200 selection:bg-brand-200 selection:text-slate-900">
    <div aria-hidden="true" class="fixed inset-0 -z-10 bg-grid-radial opacity-70 dark:opacity-50"></div>
    <header
        class="sticky top-0 z-50 backdrop-blur supports-[backdrop-filter]:bg-white/60 dark:supports-[backdrop-filter]:bg-night-900/50 border-b border-black/5 dark:border-white/5">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
            <div class="flex h-16 items-center justify-between">
                <a href="index.html" class="flex items-center gap-3 group">
                    <div
                        class="h-9 w-9 rounded-xl bg-gradient-to-br from-brand-400 via-brand-500 to-indigo-500 shadow-neon grid place-items-center text-white font-bold tracking-tight">
                        PX</div>
                    <div>
                        <p class="text-lg font-semibold leading-tight group-hover:text-brand-600">Pa[p]er X</p>
                        <p class="text-xs text-slate-500 dark:text-slate-400 -mt-1">Agentic AI for Indian syllabi</p>
                    </div>
                </a>
                <div class="flex items-center gap-3">
                    <a id="navProfile" href="profile.html" title="Profile"
                        class="hidden items-center justify-center w-9 h-9 rounded-full overflow-hidden border border-slate-200/60 dark:border-white/10 bg-white/70 dark:bg-night-800/60">
                        <img id="navProfileImg" alt="Profile" class="w-full h-full object-cover hidden" />
                        <span id="navProfileInitial" class="text-xs font-semibold">Me</span>
                    </a>
                    <button id="navSignOut" title="Sign out" aria-label="Sign out"
                        class="hidden inline-flex items-center gap-2 rounded-lg border border-slate-200/60 dark:border-white/10 px-3 py-1.5 hover:border-brand-400/60 text-sm">
                        <span class="material-symbols-rounded text-[20px]">logout</span>
                        <span>Sign Out</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="relative">
        <section class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 pt-10 pb-20">
            <div class="grid gap-8">
                <!-- Profile header card -->
                <div
                    class="rounded-2xl glass glass-dark p-6 shadow-neon border border-white/10 bg-white/80 dark:bg-night-800/70">
                    <div id="profileHeader" class="grid md:grid-cols-3 gap-6 items-start">
                        <div class="flex items-center gap-4">
                            <div id="avatarWrap" class="relative">
                                <div class="h-14 w-14 rounded-xl bg-gradient-to-br from-brand-400 via-brand-500 to-indigo-500 text-white grid place-items-center font-bold text-xl shadow-neon overflow-hidden"
                                    id="avatar">U</div>
                                <img id="avatarImg" alt="Profile"
                                    class="hidden absolute inset-0 h-full w-full object-cover" />
                            </div>
                            <div>
                                <p class="text-xl font-semibold" id="name">—</p>
                                <p class="text-sm text-slate-600 dark:text-slate-300" id="email">—</p>
                            </div>
                        </div>
                        <div class="grid gap-1 text-sm">
                            <div><span class="text-slate-500">College:</span> <span id="college">—</span></div>
                            <div><span class="text-slate-500">Department:</span> <span id="department">—</span></div>
                            <div><span class="text-slate-500">Batch:</span> <span id="batch">—</span></div>
                        </div>
                        <div class="grid gap-2 text-sm">
                            <div><span class="text-slate-500">Semester:</span> <span id="semester">—</span></div>
                            <div><span class="text-slate-500">Reg. No:</span> <span id="regno">—</span></div>
                            <div><span class="text-slate-500">Phone:</span> <span id="phone">—</span></div>
                            <div class="pt-1">
                                <a href="profile_edit.html"
                                    class="inline-flex items-center gap-2 rounded-lg border border-slate-200/60 dark:border-white/10 px-3 py-1.5 hover:border-brand-400/60 text-xs">
                                    <span class="material-symbols-rounded text-[18px]">edit</span>
                                    Edit Profile
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Syllabus -->
                <div class="grid gap-4">
                    <h2 class="text-lg font-semibold">Syllabus</h2>
                    <div id="syllabus" class="grid gap-4"></div>
                    <div id="syllabusEmpty" class="hidden text-sm text-slate-500">No syllabus found for your
                        batch/semester yet.
                    </div>
                </div>
            </div>
        </section>
    </main>

    <template id="courseCardTpl">
        <div class="rounded-xl border border-slate-200/60 dark:border-white/10 bg-white/80 dark:bg-night-800/70">
            <div class="px-5 py-4 border-b border-slate-200/60 dark:border-white/10 flex items-center justify-between cursor-pointer hover:bg-white/70 dark:hover:bg-night-700/40 transition-colors rounded-t-xl group"
                data-course-toggle aria-expanded="false">
                <div class="flex items-center gap-3 font-semibold">
                    <span
                        class="material-symbols-rounded text-slate-500 group-hover:text-brand-600 transition-transform duration-200 -rotate-90"
                        data-course-caret>expand_more</span>
                    <span data-cc class="text-brand-600"></span>
                    <span class="opacity-50">—</span>
                    <span data-title></span>
                </div>
                <div class="flex items-center gap-3">
                    <div class="hidden md:block w-40 h-2 rounded bg-slate-200/70 dark:bg-white/10 overflow-hidden"
                        aria-label="Course progress">
                        <div class="h-full bg-brand-500 transition-all" style="width:0%" data-course-progress-bar></div>
                    </div>
                    <span class="text-xs rounded-full border border-slate-200/60 dark:border-white/10 px-2 py-0.5">
                        <span data-course-progress-text>0/0</span>
                    </span>
                    <span class="text-xs rounded-full border border-slate-200/60 dark:border-white/10 px-2 py-0.5">Sem
                        <span data-sem></span></span>
                </div>
            </div>
            <div class="p-5 grid gap-4" data-units></div>
        </div>
    </template>

    <template id="unitItemTpl">
        <div class="rounded-lg border border-slate-200/60 dark:border-white/10">
            <button type="button"
                class="w-full text-left px-4 py-3 flex items-center justify-between hover:bg-white/60 dark:hover:bg-night-700/40 transition-colors"
                data-unit-toggle aria-expanded="false">
                <div class="font-medium flex items-center gap-2" data-unit-title></div>
                <span class="material-symbols-rounded text-slate-500 transition-transform duration-200 -rotate-90"
                    data-unit-caret>expand_more</span>
            </button>
            <div class="px-4 pb-4">
                <div class="flex items-center gap-3 mb-2">
                    <div class="w-36 h-2 rounded bg-slate-200/70 dark:bg-white/10 overflow-hidden"
                        aria-label="Unit progress">
                        <div class="h-full bg-emerald-500 transition-all" style="width:0%" data-unit-progress-bar></div>
                    </div>
                    <span class="text-xs text-slate-600 dark:text-slate-300" data-unit-progress-text>0/0</span>
                </div>
                <ul class="space-y-0.5 text-sm leading-tight" data-topics></ul>
            </div>
        </div>
    </template>

    <script>
        const apiBase = (window.API_BASE || 'http://localhost:8000').replace(/\/$/, '');
        const completedTopicIds = new Set();

        function getToken() {
            try { return localStorage.getItem('px_token'); } catch { return null; }
        }
        function authHeaders() {
            const token = getToken();
            return token ? { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' };
        }
        function setText(id, value) { const el = document.getElementById(id); if (el) el.textContent = value ?? '—'; }

        async function fetchJsonRetry(url, options = {}, retries = 2, delay = 400) {
            for (let i = 0; i <= retries; i++) {
                try {
                    const res = await fetch(url, options);
                    if (res.status === 401) return { unauthorized: true };
                    if (res.ok) {
                        return { data: await res.json(), status: res.status };
                    }
                    // Retry on 5xx only
                    if (res.status >= 500 && res.status < 600 && i < retries) {
                        await new Promise(r => setTimeout(r, delay * (i + 1)));
                        continue;
                    }
                    // Non-retryable
                    return { error: true, status: res.status };
                } catch (e) {
                    if (i < retries) {
                        await new Promise(r => setTimeout(r, delay * (i + 1)));
                        continue;
                    }
                    return { error: true };
                }
            }
        }

        async function fetchMe() {
            const token = getToken();
            if (!token) { window.location.href = 'login.html'; return; }
            try {
                // Fetch profile and progress with simple retry/backoff
                const [meOut, progOut] = await Promise.all([
                    fetchJsonRetry(`${apiBase}/api/me`, { headers: { 'Authorization': `Bearer ${token}` } }),
                    fetchJsonRetry(`${apiBase}/api/progress/topics`, { headers: { 'Authorization': `Bearer ${token}` } }),
                ]);
                if (meOut?.unauthorized) { window.location.href = 'login.html'; return; }
                if (!meOut || meOut.error || !meOut.data) { throw new Error('Failed to load profile'); }
                const data = meOut.data;
                const prog = (!progOut || progOut.error) ? { completed_topic_ids: [] } : (progOut.data || { completed_topic_ids: [] });
                completedTopicIds.clear();
                for (const id of (prog.completed_topic_ids || [])) { completedTopicIds.add(id); }
                renderProfile(data);
                if (data?.profile) {
                    window.__PX_PROFILE_SNAPSHOT = data.profile;
                    if (typeof window.__PX_NAV_APPLY === 'function') {
                        window.__PX_NAV_APPLY(data.profile);
                    }
                }
            } catch (e) {
                // soft redirect
                window.location.href = 'login.html';
            }
        }

        function initials(name) {
            if (!name) return 'U';
            const parts = String(name).trim().split(/\s+/).slice(0, 2);
            return parts.map(p => p[0]?.toUpperCase()).join('') || 'U';
        }

        function renderProfile(data) {
            const p = data?.profile || {};
            const avatar = document.getElementById('avatar');
            const avatarImg = document.getElementById('avatarImg');
            avatar.textContent = initials(p.name);
            if (p.profile_image_url) {
                avatarImg.src = p.profile_image_url;
                avatarImg.classList.remove('hidden');
            } else {
                avatarImg.classList.add('hidden');
            }
            setText('name', p.name);
            setText('email', p.email);
            setText('semester', p.semester);
            setText('regno', p.regno);
            setText('phone', p.phone);
            setText('college', p.college?.name || '—');
            setText('department', p.department?.name || '—');
            setText('batch', p.batch ? `${p.batch.from}–${p.batch.to}` : '—');

            const syllabusWrap = document.getElementById('syllabus');
            syllabusWrap.innerHTML = '';
            const list = data?.syllabus || [];
            if (!list.length) {
                document.getElementById('syllabusEmpty').classList.remove('hidden');
                return;
            }
            document.getElementById('syllabusEmpty').classList.add('hidden');

            const cTpl = document.getElementById('courseCardTpl');
            const uTpl = document.getElementById('unitItemTpl');
            list.forEach(c => {
                const cNode = cTpl.content.cloneNode(true);
                cNode.querySelector('[data-cc]').textContent = c.course_code;
                cNode.querySelector('[data-title]').textContent = c.title;
                cNode.querySelector('[data-sem]').textContent = c.semester;
                const unitsWrap = cNode.querySelector('[data-units]');
                const courseHeader = cNode.querySelector('[data-course-toggle]');
                const courseCaret = cNode.querySelector('[data-course-caret]');
                const courseProgBar = cNode.querySelector('[data-course-progress-bar]');
                const courseProgText = cNode.querySelector('[data-course-progress-text]');
                unitsWrap.classList.add('hidden');
                courseHeader.setAttribute('aria-expanded', 'false');
                courseHeader.addEventListener('click', () => {
                    const collapsed = unitsWrap.classList.toggle('hidden');
                    const expanded = !collapsed;
                    courseHeader.setAttribute('aria-expanded', expanded ? 'true' : 'false');
                    courseCaret.classList.toggle('-rotate-90', !expanded ? true : false);
                    courseCaret.classList.toggle('rotate-0', expanded ? true : false);
                });

                const courseCounts = { done: 0, total: 0 };
                (c.units || []).forEach(u => {
                    const uNode = uTpl.content.cloneNode(true);
                    const unitTitleEl = uNode.querySelector('[data-unit-title]');
                    const topicsUl = uNode.querySelector('[data-topics]');
                    const unitToggle = uNode.querySelector('[data-unit-toggle]');
                    const unitCaret = uNode.querySelector('[data-unit-caret]');
                    const unitProgBar = uNode.querySelector('[data-unit-progress-bar]');
                    const unitProgText = uNode.querySelector('[data-unit-progress-text]');
                    unitTitleEl.textContent = u.unit_title;
                    topicsUl.classList.add('hidden');
                    unitToggle.setAttribute('aria-expanded', 'false');
                    unitToggle.addEventListener('click', () => {
                        const collapsed = topicsUl.classList.toggle('hidden');
                        const expanded = !collapsed;
                        unitToggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
                        unitCaret.classList.toggle('-rotate-90', !expanded ? true : false);
                        unitCaret.classList.toggle('rotate-0', expanded ? true : false);
                    });
                    const unitCounts = { done: 0, total: 0 };
                    (u.topics || []).forEach(t => {
                        const li = document.createElement('li');
                        li.className = 'flex items-center gap-2 py-0.5 px-2 rounded hover:bg-white/60 dark:hover:bg-night-700/40 transition-colors text-sm leading-tight';

                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'p-1 rounded hover:bg-emerald-50 dark:hover:bg-emerald-900/20 focus:outline-none focus:ring-2 focus:ring-emerald-400/50';
                        btn.dataset.topicId = t.id;
                        const icon = document.createElement('span');
                        icon.className = 'material-symbols-rounded text-[20px]';
                        const isCheckedInit = completedTopicIds.has(t.id);
                        icon.textContent = isCheckedInit ? 'check_circle' : 'radio_button_unchecked';
                        icon.style.color = isCheckedInit ? '#10b981' : 'currentColor';
                        btn.appendChild(icon);
                        li.appendChild(btn);

                        const a = document.createElement('a');
                        a.href = 'notes_generator.html?topic=' + encodeURIComponent(t.topic);
                        a.textContent = t.topic;
                        a.className = 'text-brand-600 hover:underline';
                        li.appendChild(a);

                        unitCounts.total += 1;
                        if (isCheckedInit) unitCounts.done += 1;

                        btn.addEventListener('click', async () => {
                            const isChecked = !completedTopicIds.has(t.id);
                            try {
                                await fetch(`${apiBase}/api/progress/toggle`, {
                                    method: 'POST',
                                    headers: authHeaders(),
                                    body: JSON.stringify({ topic_id: t.id, completed: isChecked })
                                });
                                if (isChecked) { completedTopicIds.add(t.id); } else { completedTopicIds.delete(t.id); }
                                unitCounts.done += isChecked ? 1 : -1;
                                courseCounts.done += isChecked ? 1 : -1;
                                updateUnitProgress(unitCounts, unitProgBar, unitProgText);
                                updateCourseProgress(courseCounts, courseProgBar, courseProgText);
                                icon.textContent = isChecked ? 'check_circle' : 'radio_button_unchecked';
                                icon.style.color = isChecked ? '#10b981' : 'currentColor';
                                updateUnitCompletedStyle(unitCounts, unitTitleEl);
                            } catch { }
                        });
                        topicsUl.appendChild(li);
                    });
                    courseCounts.total += unitCounts.total;
                    courseCounts.done += unitCounts.done;
                    updateUnitProgress(unitCounts, unitProgBar, unitProgText);
                    updateUnitCompletedStyle(unitCounts, unitTitleEl);
                    unitsWrap.appendChild(uNode);
                });
                updateCourseProgress(courseCounts, courseProgBar, courseProgText);
                syllabusWrap.appendChild(cNode);
            });
        }

        function pct(done, total) {
            return total ? Math.round((done / total) * 100) : 0;
        }
        function updateUnitProgress(counts, barEl, textEl) {
            const p = pct(counts.done, counts.total);
            if (barEl) barEl.style.width = p + '%';
            if (textEl) textEl.textContent = `${counts.done}/${counts.total}`;
        }
        function updateCourseProgress(counts, barEl, textEl) {
            const p = pct(counts.done, counts.total);
            if (barEl) barEl.style.width = p + '%';
            if (textEl) textEl.textContent = `${counts.done}/${counts.total}`;
        }

        function updateUnitCompletedStyle(counts, titleEl) {
            if (!titleEl) return;
            const complete = counts.total > 0 && counts.done >= counts.total;
            titleEl.classList.toggle('line-through', complete);
            titleEl.classList.toggle('decoration-2', complete);
            titleEl.classList.toggle('decoration-slate-400', complete);
            titleEl.classList.toggle('dark:decoration-slate-500', complete);
            titleEl.classList.toggle('text-slate-400', complete);
            titleEl.classList.toggle('dark:text-slate-500', complete);
        }

        (function initNavAuth() {
            const t = getToken();
            const navProfile = document.getElementById('navProfile');
            const navProfileImg = document.getElementById('navProfileImg');
            const navProfileInitial = document.getElementById('navProfileInitial');
            const navSignOut = document.getElementById('navSignOut');
            if (!t) return;
            document.querySelectorAll('a[href="login.html"], a[href="signup.html"]').forEach(a => {
                a.classList.add('hidden');
                a.style.display = 'none';
            });
            if (navProfile) navProfile.classList.remove('hidden');
            if (navSignOut) {
                navSignOut.classList.remove('hidden');
                navSignOut.onclick = () => { try { localStorage.removeItem('px_token'); } catch { } window.location.href = 'login.html'; };
            }
            const applyNavProfile = (profile) => {
                if (!profile) return;
                let initials = 'ME';
                if (profile.name) {
                    initials = profile.name
                        .split(' ')
                        .filter(Boolean)
                        .map(part => part[0]?.toUpperCase())
                        .slice(0, 2)
                        .join('') || 'ME';
                }
                if (navProfileInitial) {
                    navProfileInitial.textContent = initials;
                    navProfileInitial.classList.remove('hidden');
                }
                if (profile.profile_image_url && navProfileImg) {
                    navProfileImg.src = profile.profile_image_url;
                    navProfileImg.classList.remove('hidden');
                    if (navProfileInitial) navProfileInitial.classList.add('hidden');
                } else if (navProfileImg) {
                    navProfileImg.classList.add('hidden');
                }
            };

            window.__PX_NAV_APPLY = applyNavProfile;

            const useProfile = (profile) => {
                if (profile) applyNavProfile(profile);
            };

            if (window.__PX_PROFILE_SNAPSHOT) {
                applyNavProfile(window.__PX_PROFILE_SNAPSHOT);
            } else {
                const pending = window.__PX_NAV_PROFILE_PROMISE;
                if (pending && typeof pending.then === 'function') {
                    pending.then(useProfile).catch(() => { });
                } else {
                    const apiBaseLocal = (window.API_BASE || 'http://localhost:8000').replace(/\/$/, '');
                    window.__PX_NAV_PROFILE_PROMISE = fetch(`${apiBaseLocal}/api/me`, { headers: { Authorization: `Bearer ${t}` } })
                        .then(r => r.ok ? r.json() : null)
                        .then(d => {
                            const profile = d?.profile || null;
                            if (profile) {
                                window.__PX_PROFILE_SNAPSHOT = profile;
                                applyNavProfile(profile);
                            }
                            return profile;
                        })
                        .catch(() => null);
                }
            }
        })();

        fetchMe();
    </script>
</body>

</html>
