<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Feedback Analytics — Paper X</title>
    <link rel="icon" type="image/x-icon" href="../assets/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/tailwind.css" />
    <script src="../config.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                container: { center: true, padding: '1rem' },
                extend: {
                    fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
                    colors: {
                        brand: { 900: '#1E1E2F', 700: '#4C2A59', 500: '#9E4B8A' },
                        brandlt: { 50: '#FAF5FB', 100: '#F3E7F2', 200: '#E7D0E4' }
                    },
                    boxShadow: { glow: '0 8px 30px rgba(158,75,138,0.28)' },
                    backgroundImage: {
                        'hero-dark': 'radial-gradient(900px 520px at 50% -15%, rgba(158,75,138,0.35), transparent 65%), linear-gradient(180deg,#1E1E2F 0%,#201934 55%,#141321 100%)',
                        'hero-light': 'radial-gradient(1000px 560px at 50% -18%, rgba(158,75,138,0.18), transparent 62%), linear-gradient(180deg,#FFFFFF 0%,#FBF8FC 55%,#F7F2F9 100%)',
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-rounded {
            vertical-align: -6px;
        }

        .filled {
            font-variation-settings: 'FILL' 1;
        }

        .glass-panel {
            background: linear-gradient(180deg, rgba(255, 255, 255, .82), rgba(255, 255, 255, .66));
            backdrop-filter: blur(28px);
            box-shadow: 0 12px 42px -10px rgba(30, 30, 47, .18);
        }

        .dark .glass-panel {
            background: linear-gradient(180deg, rgba(30, 30, 47, .78), rgba(30, 30, 47, .58));
            box-shadow: 0 22px 60px -12px rgba(0, 0, 0, .55);
        }

        .bar {
            transition: width 0.4s ease;
        }

        .skeleton {
            background: linear-gradient(90deg, rgba(0, 0, 0, .04), rgba(0, 0, 0, .08), rgba(0, 0, 0, .04));
            background-size: 300% 100%;
            animation: shimmer 2.3s linear infinite;
        }

        .dark .skeleton {
            background: linear-gradient(90deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .12), rgba(255, 255, 255, .06));
        }

        @keyframes shimmer {
            0% {
                background-position: 0 0
            }

            100% {
                background-position: -300% 0
            }
        }
    </style>
    <script>
            (() => {
                const s = localStorage.getItem('px_theme');
                const prefers = matchMedia('(prefers-color-scheme: dark)').matches;
                if (s ? s === 'dark' : prefers) document.documentElement.classList.add('dark');
            })();
    </script>
</head>

<body class="min-h-screen font-sans antialiased text-neutral-900 dark:text-white bg-hero-light dark:bg-hero-dark">

    <!-- Navbar -->
    <header
        class="sticky top-0 z-50 bg-white/70 dark:bg-brand-900/60 backdrop-blur border-b border-black/5 dark:border-white/10">
        <div class="container flex items-center justify-between py-3.5">
            <a href="../teacher_profile.html" class="flex items-center gap-3 shrink-0">
                <img src="../assets/img/logo-light.svg" class="h-9 w-auto dark:hidden" alt="Paper X" />
                <img src="../assets/img/logo-dark.svg" class="h-9 w-auto hidden dark:block" alt="Paper X" />
            </a>
            <div class="flex items-center gap-2">
                <button data-theme-toggle
                    class="inline-flex items-center gap-2 rounded-full px-3 py-2 text-sm ring-1 ring-black/10 dark:ring-white/15 hover:bg-black/5 dark:hover:bg-white/5">
                    <span class="material-symbols-rounded">dark_mode</span>
                </button>
                <a id="responsesLink" href="#"
                    class="inline-flex items-center gap-2 rounded-full ring-1 ring-black/10 dark:ring-white/15 text-sm font-medium px-4 py-2.5 hover:bg-black/5 dark:hover:bg-white/5 transition">
                    <span class="material-symbols-rounded text-base">visibility</span>
                    View Responses
                </a>
            </div>
        </div>
    </header>

    <main class="container py-8">
        <!-- Loading -->
        <div id="loadingState">
            <div class="skeleton h-20 rounded-2xl mb-4"></div>
            <div class="grid md:grid-cols-2 gap-4">
                <div class="skeleton h-48 rounded-2xl"></div>
                <div class="skeleton h-48 rounded-2xl"></div>
            </div>
        </div>

        <!-- Content -->
        <div id="content" class="hidden">
            <!-- Header -->
            <div class="glass-panel rounded-2xl p-6 mb-6">
                <h1 class="text-2xl font-bold mb-2">
                    <span class="material-symbols-rounded text-2xl mr-2 text-brand-500">bar_chart</span>
                    Analytics
                </h1>
                <p id="formTitle" class="text-neutral-600 dark:text-white/60">Loading...</p>
                <p class="text-sm mt-2">
                    <span id="totalResponses" class="font-bold text-brand-600 dark:text-brand-400">0</span> total
                    responses
                </p>
            </div>

            <!-- Analytics Grid -->
            <div id="analyticsContainer" class="grid md:grid-cols-2 gap-4"></div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden glass-panel rounded-2xl p-10 text-center">
                <span class="material-symbols-rounded text-4xl text-neutral-400 mb-4 block">analytics</span>
                <h2 class="text-lg font-semibold mb-2">No Data Yet</h2>
                <p class="text-neutral-600 dark:text-white/60">Analytics will appear once you receive responses.</p>
            </div>
        </div>
    </main>

    <script>
        document.querySelectorAll('[data-theme-toggle]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                localStorage.setItem('px_theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
            });
        });

        const API = window.API_BASE || location.origin;
        const token = localStorage.getItem('teacherToken') || localStorage.getItem('px_auth_token');
        if (!token) location.href = 'teacher_login.html';

        const params = new URLSearchParams(location.search);
        const formId = params.get('id');
        if (!formId) location.href = 'teacher_feedback_list.html';

        const $ = id => document.getElementById(id);
        const colors = ['#9E4B8A', '#4C2A59', '#E879F9', '#A855F7', '#7C3AED', '#6366F1', '#3B82F6', '#0EA5E9'];

        async function load() {
            try {
                const res = await fetch(`${API}/api/feedback/forms/${formId}/analytics`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) throw new Error('Failed to load');
                const data = await res.json();
                render(data);
            } catch (e) {
                console.error(e);
                $('loadingState').innerHTML = `
                    <div class="glass-panel rounded-2xl p-10 text-center">
                        <span class="material-symbols-rounded text-4xl text-red-500 mb-3 block">error</span>
                        <h3 class="font-semibold mb-2">Failed to load analytics</h3>
                        <p class="text-neutral-600 dark:text-white/60">${e.message}</p>
                    </div>
                `;
            }
        }

        function renderRatingChart(q) {
            const avg = q.average || 0;
            const max = q.question_type === 'rating' ? 5 : 10;
            const pct = (avg / max) * 100;

            let distHtml = '';
            if (q.distribution) {
                const entries = Object.entries(q.distribution);
                const maxCount = Math.max(...entries.map(([, v]) => v), 1);
                distHtml = `
                    <div class="mt-4 space-y-2">
                        ${entries.map(([val, count]) => `
                            <div class="flex items-center gap-2 text-xs">
                                <span class="w-4 text-right">${val}</span>
                                <div class="flex-1 h-6 bg-black/5 dark:bg-white/5 rounded overflow-hidden">
                                    <div class="bar h-full bg-brand-500 rounded" style="width: ${(count / maxCount) * 100}%"></div>
                                </div>
                                <span class="w-8 text-neutral-500 dark:text-white/50">${count}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            return `
                <div class="text-center mb-4">
                    <span class="text-4xl font-bold text-brand-600 dark:text-brand-400">${avg.toFixed(1)}</span>
                    <span class="text-neutral-500 dark:text-white/50">/ ${max}</span>
                </div>
                <div class="h-3 bg-black/5 dark:bg-white/5 rounded-full overflow-hidden">
                    <div class="bar h-full bg-gradient-to-r from-brand-500 to-brand-700 rounded-full" style="width: ${pct}%"></div>
                </div>
                ${distHtml}
            `;
        }

        function renderChoiceChart(q) {
            const opts = q.options || [];
            const dist = q.distribution || {};
            const total = Object.values(dist).reduce((a, b) => a + b, 0) || 1;

            return `
                <div class="space-y-3">
                    ${opts.map((opt, i) => {
                const count = dist[String(i)] || 0;
                const pct = (count / total) * 100;
                return `
                            <div>
                                <div class="flex justify-between text-sm mb-1">
                                    <span class="truncate">${opt}</span>
                                    <span class="text-neutral-500 dark:text-white/50">${count} (${pct.toFixed(0)}%)</span>
                                </div>
                                <div class="h-6 bg-black/5 dark:bg-white/5 rounded overflow-hidden">
                                    <div class="bar h-full rounded" style="width: ${pct}%; background: ${colors[i % colors.length]}"></div>
                                </div>
                            </div>
                        `;
            }).join('')}
                </div>
            `;
        }

        function renderTextResponses(q) {
            const responses = q.responses || [];
            if (!responses.length) return '<p class="text-neutral-500 dark:text-white/50 text-sm">No text responses</p>';

            return `
                <div class="max-h-64 overflow-y-auto space-y-2">
                    ${responses.slice(0, 10).map(r => `
                        <div class="p-3 rounded-lg bg-black/5 dark:bg-white/5 text-sm">${r}</div>
                    `).join('')}
                    ${responses.length > 10 ? `<p class="text-xs text-neutral-500 dark:text-white/50 text-center">+${responses.length - 10} more</p>` : ''}
                </div>
            `;
        }

        function render(data) {
            $('loadingState').classList.add('hidden');
            $('content').classList.remove('hidden');

            $('formTitle').textContent = 'Form Analytics';
            $('totalResponses').textContent = data.total_responses || 0;
            $('responsesLink').href = `teacher_feedback_responses.html?id=${formId}`;

            if (!data.total_responses || !data.questions?.length) {
                $('emptyState').classList.remove('hidden');
                return;
            }

            const container = $('analyticsContainer');
            container.innerHTML = data.questions.map(q => {
                let chartHtml = '';

                if (['rating', 'scale'].includes(q.question_type)) {
                    chartHtml = renderRatingChart(q);
                } else if (['mcq_single', 'mcq_multiple', 'yes_no', 'dropdown'].includes(q.question_type)) {
                    chartHtml = renderChoiceChart(q);
                } else {
                    chartHtml = renderTextResponses(q);
                }

                return `
                    <div class="glass-panel rounded-2xl p-5">
                        <h3 class="font-semibold text-sm mb-4">${q.question_text}</h3>
                        ${chartHtml}
                    </div>
                `;
            }).join('');
        }

        load();
    </script>
</body>

</html>
