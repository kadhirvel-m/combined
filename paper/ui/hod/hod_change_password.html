<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paper X — HOD Change Password</title>
  <link rel="icon" type="image/x-icon" href="../assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,0,0" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tailwind.css" />

  <script>
    (() => {
      const stored = localStorage.getItem('px_theme');
      const prefers = window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches;
      const dark = stored ? stored === 'dark' : !!prefers;
      if (dark) document.documentElement.classList.add('dark');
    })();
  </script>
  <script src="../config.js"></script>
  <script src="../auth.js" defer></script>
  <script src="./hod.js" defer></script>

  <style>
    .material-symbols-rounded { vertical-align: -5px; }
    html.dark body { background: radial-gradient(circle at 25% 15%, rgba(76,42,89,.75) 0%, rgba(30,30,47,0) 55%), linear-gradient(135deg, #1E1E2F 0%, #221B38 40%, #141321 100%); }
    body { background: linear-gradient(180deg,#FFFFFF 0%,#FBF8FC 50%,#F7F2F9 100%); }
    .glass { background: linear-gradient(135deg, rgba(255,255,255,.76), rgba(255,255,255,.56)); backdrop-filter: saturate(1.35) blur(14px); }
    .dark .glass { background: linear-gradient(135deg, rgba(40, 28, 55, .75), rgba(30, 24, 47, .65)); }
  </style>
</head>

<body class="min-h-screen font-sans antialiased text-neutral-900 dark:text-white">
  <header class="sticky top-0 z-40 backdrop-blur bg-white/70 dark:bg-brand-900/70 border-b border-black/5 dark:border-white/10">
    <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-16">
      <a href="./hod_dashboard.html" class="flex items-center gap-2 font-bold tracking-tight text-lg">
        <img src="../assets/img/logo-light.svg" class="h-8 w-auto dark:hidden" alt="Paper X" />
        <img src="../assets/img/logo-dark.svg" class="h-8 w-auto hidden dark:block" alt="Paper X" />
        <span class="hidden sm:inline text-neutral-600 dark:text-white/70 font-semibold">HOD Portal</span>
      </a>
      <div class="flex items-center gap-2">
        <a href="./hod_dashboard.html" class="hidden sm:inline-flex items-center gap-2 rounded-full px-4 py-2 text-sm font-medium bg-white/70 dark:bg-white/10 ring-1 ring-black/10 dark:ring-white/15 hover:bg-white dark:hover:bg-white/20 transition">
          <span class="material-symbols-rounded text-[18px]">arrow_back</span>Back to Dashboard
        </a>
        <button data-theme-toggle class="inline-flex items-center justify-center h-10 w-10 rounded-full bg-white/70 dark:bg-white/10 ring-1 ring-black/10 dark:ring-white/15 hover:bg-white dark:hover:bg-white/20 transition material-symbols-rounded" title="Toggle theme">dark_mode</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-10 space-y-8">
    <section class="flex flex-col lg:flex-row lg:items-end gap-6">
      <div class="flex-1 space-y-2">
        <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight">Change Password</h1>
        <p class="text-sm md:text-base text-neutral-600 dark:text-white/60 max-w-2xl">Update your HOD account password securely.</p>
      </div>
      <div id="hodNav" class="flex flex-wrap gap-2"></div>
    </section>

    <section class="max-w-2xl glass rounded-3xl p-6 ring-1 ring-black/10 dark:ring-white/10">
      <form id="changePasswordForm" class="space-y-5">
        <div>
          <label for="currentPassword" class="block text-sm font-semibold mb-2">Current Password</label>
          <input
            id="currentPassword"
            name="currentPassword"
            type="password"
            autocomplete="current-password"
            required
            class="w-full rounded-2xl bg-white/80 dark:bg-white/10 ring-1 ring-black/10 dark:ring-white/15 px-4 py-3 text-sm focus:outline-none focus:ring-brand-500"
            placeholder="Enter current password"
          />
        </div>

        <div>
          <label for="newPassword" class="block text-sm font-semibold mb-2">New Password</label>
          <input
            id="newPassword"
            name="newPassword"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
            class="w-full rounded-2xl bg-white/80 dark:bg-white/10 ring-1 ring-black/10 dark:ring-white/15 px-4 py-3 text-sm focus:outline-none focus:ring-brand-500"
            placeholder="Enter new password"
          />
          <p class="mt-2 text-xs text-neutral-500 dark:text-white/50">Use at least 8 characters.</p>
        </div>

        <div>
          <label for="confirmNewPassword" class="block text-sm font-semibold mb-2">Confirm New Password</label>
          <input
            id="confirmNewPassword"
            name="confirmNewPassword"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
            class="w-full rounded-2xl bg-white/80 dark:bg-white/10 ring-1 ring-black/10 dark:ring-white/15 px-4 py-3 text-sm focus:outline-none focus:ring-brand-500"
            placeholder="Re-enter new password"
          />
        </div>

        <div id="formMsg" class="hidden rounded-xl px-3 py-2 text-sm"></div>

        <button
          id="submitBtn"
          type="submit"
          class="inline-flex items-center gap-2 rounded-full px-5 py-2.5 text-sm font-semibold bg-brand-500 text-white hover:bg-brand-600 disabled:opacity-60 disabled:cursor-not-allowed"
        >
          <span class="material-symbols-rounded text-[18px]">save</span>
          <span id="submitLabel">Update Password</span>
        </button>
      </form>
    </section>
  </main>

  <script>
    (function(){
      const $ = (s, r = document) => r.querySelector(s);
      const msgEl = document.getElementById('formMsg');
      const submitBtn = document.getElementById('submitBtn');
      const submitLabel = document.getElementById('submitLabel');

      function showMsg(text, tone){
        msgEl.textContent = text || '';
        msgEl.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'dark:bg-red-500/20', 'dark:text-red-200', 'bg-emerald-100', 'text-emerald-700', 'dark:bg-emerald-500/20', 'dark:text-emerald-200');
        if (tone === 'success') {
          msgEl.classList.add('bg-emerald-100', 'text-emerald-700', 'dark:bg-emerald-500/20', 'dark:text-emerald-200');
        } else {
          msgEl.classList.add('bg-red-100', 'text-red-700', 'dark:bg-red-500/20', 'dark:text-red-200');
        }
      }

      function setSubmitting(isSubmitting){
        submitBtn.disabled = !!isSubmitting;
        submitLabel.textContent = isSubmitting ? 'Updating...' : 'Update Password';
      }

      async function init(){
        HOD.bindThemeToggle();
        HOD.mountNav('password');
        await HOD.requireHod();
      }

      document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        msgEl.classList.add('hidden');

        const currentPassword = ($('#currentPassword').value || '');
        const newPassword = ($('#newPassword').value || '');
        const confirmNewPassword = ($('#confirmNewPassword').value || '');

        if (!currentPassword) {
          showMsg('Current password is required.', 'error');
          return;
        }
        if (newPassword.length < 8) {
          showMsg('New password must be at least 8 characters.', 'error');
          return;
        }
        if (newPassword !== confirmNewPassword) {
          showMsg('New password and confirm password do not match.', 'error');
          return;
        }

        setSubmitting(true);
        try {
          const token = HOD.getToken();
          await HOD.fetchJSON(HOD.API_BASE + '/api/hod/change-password', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: 'Bearer ' + token,
            },
            body: JSON.stringify({
              current_password: currentPassword,
              new_password: newPassword,
              confirm_new_password: confirmNewPassword,
            }),
          });

          showMsg('Password changed successfully.', 'success');
          document.getElementById('changePasswordForm').reset();
        } catch (err) {
          showMsg((err && err.message) ? err.message : 'Failed to change password.', 'error');
        } finally {
          setSubmitting(false);
        }
      });

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, { once: true });
      else init();
    })();
  </script>
</body>
</html>
