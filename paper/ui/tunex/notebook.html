<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Notebook | Tunex</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        // Theme initialization - runs before page render
        (function () {
            const stored = localStorage.getItem('tunex-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = stored === 'dark' || (!stored && prefersDark);
            if (isDark) document.documentElement.classList.add('dark');
        })();

        // Theme toggle object
        const Theme = {
            toggle() {
                const html = document.documentElement;
                html.classList.toggle('dark');
                localStorage.setItem('tunex-theme', html.classList.contains('dark') ? 'dark' : 'light');
            },
            isDark() {
                return document.documentElement.classList.contains('dark');
            }
        };

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#FCE7F8',
                            100: '#F8CFF0',
                            200: '#F19FE1',
                            300: '#E96FD3',
                            400: '#C05AAF',
                            500: '#9E4B8A',
                            600: '#7A3A6B',
                            700: '#4C2A59',
                            800: '#3A1F44',
                            900: '#1E1E2F'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'Consolas', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Properties */
        :root {
            --bg-primary: #FAFAFA;
            --bg-secondary: #FFFFFF;
            --bg-tertiary: #F4F4F5;
            --bg-code: #F8FAFC;
            --text-primary: #18181B;
            --text-secondary: #52525B;
            --text-muted: #A1A1AA;
            --border-color: #E4E4E7;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        }

        .dark {
            --bg-primary: #0F0F14;
            --bg-secondary: #1A1A24;
            --bg-tertiary: #252532;
            --bg-code: #12121A;
            --text-primary: #FAFAFA;
            --text-secondary: #A1A1AA;
            --text-muted: #71717A;
            --border-color: #27272A;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -4px rgba(0, 0, 0, 0.4);
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.2s, color 0.2s;
        }

        /* Textarea styling */
        textarea {
            tab-size: 4;
            -moz-tab-size: 4;
        }

        textarea:focus {
            outline: none;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #9E4B8A40;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #9E4B8A;
        }

        /* Cell styling */
        .notebook-cell {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
        }

        .notebook-cell:hover {
            box-shadow: var(--shadow-md);
        }

        .notebook-cell.active {
            border-color: #9E4B8A;
            box-shadow: 0 0 0 3px rgba(158, 75, 138, 0.15);
        }

        .code-area {
            background: var(--bg-code);
            color: var(--text-primary);
        }

        .output-area {
            background: var(--bg-tertiary);
            border-top: 1px solid var(--border-color);
        }

        /* Floating action button */
        .fab {
            background: linear-gradient(135deg, #9E4B8A 0%, #4C2A59 100%);
            box-shadow: 0 4px 14px 0 rgba(158, 75, 138, 0.4);
        }

        .fab:hover {
            box-shadow: 0 6px 20px rgba(158, 75, 138, 0.5);
            transform: translateY(-2px);
        }

        /* Header */
        .header-bar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        /* Buttons */
        .btn-icon {
            color: var(--text-secondary);
            transition: all 0.15s ease;
        }

        .btn-icon:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }

        .btn-primary {
            background: linear-gradient(135deg, #9E4B8A 0%, #7A3A6B 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(158, 75, 138, 0.3);
        }

        .btn-primary:hover {
            box-shadow: 0 4px 12px rgba(158, 75, 138, 0.4);
        }

        .btn-ghost {
            color: var(--text-secondary);
        }

        .btn-ghost:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }

        /* Pill badge */
        .pill {
            background: var(--bg-tertiary);
            color: var(--text-muted);
        }

        /* Execution counter */
        .exec-counter {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-muted);
            font-size: 11px;
            min-width: 36px;
        }

        /* Run button in cell */
        .run-btn {
            background: #9E4B8A;
            color: white;
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.15s ease;
        }

        .notebook-cell:hover .run-btn,
        .notebook-cell.active .run-btn {
            opacity: 1;
            transform: scale(1);
        }

        .run-btn:hover {
            background: #7A3A6B;
        }

        /* Animation */
        @keyframes pulse-border {

            0%,
            100% {
                border-color: #9E4B8A;
            }

            50% {
                border-color: #C05AAF;
            }
        }

        .running {
            animation: pulse-border 1s ease infinite;
        }
    </style>
</head>

<body class="font-sans antialiased min-h-screen" x-data="notebookApp()">

    <!-- Fixed Header -->
    <header class="header-bar sticky top-0 z-50">
        <div class="max-w-4xl mx-auto h-14 px-4 flex items-center justify-between">
            <!-- Left: Back + Title -->
            <div class="flex items-center gap-3">
                <a href="index.html" class="btn-icon p-2 rounded-lg">
                    <i class="ri-arrow-left-s-line text-xl"></i>
                </a>
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-lg fab flex items-center justify-center">
                        <i class="ri-terminal-box-fill text-white text-sm"></i>
                    </div>
                    <div>
                        <h1 class="text-sm font-semibold leading-tight">Python Notebook</h1>
                        <p class="text-xs" style="color: var(--text-muted)">Tunex IDE</p>
                    </div>
                </div>
            </div>

            <!-- Right: Actions -->
            <div class="flex items-center gap-1">
                <button @click="runAllCells()"
                    class="btn-ghost px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5">
                    <i class="ri-play-list-2-fill"></i>
                    <span class="hidden sm:inline">Run All</span>
                </button>
                <button @click="clearAllOutputs()"
                    class="btn-ghost px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5">
                    <i class="ri-eraser-fill"></i>
                    <span class="hidden sm:inline">Clear</span>
                </button>
                <div class="w-px h-5 mx-1" style="background: var(--border-color)"></div>
                <button @click="Theme.toggle()" class="btn-icon p-2 rounded-lg">
                    <i class="ri-sun-line dark:hidden text-lg"></i>
                    <i class="ri-moon-fill hidden dark:inline text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8">

        <!-- Cells Container -->
        <div class="space-y-4">
            <template x-for="(cell, index) in cells" :key="cell.id">
                <div class="notebook-cell rounded-xl overflow-hidden"
                    :class="{'active': activeCellIndex === index, 'running': cell.isRunning}"
                    @click="activeCellIndex = index">

                    <!-- Cell Header -->
                    <div class="flex items-center justify-between px-4 py-2"
                        style="background: var(--bg-tertiary); border-bottom: 1px solid var(--border-color)">
                        <div class="flex items-center gap-3">
                            <span class="exec-counter" x-text="'[' + (cell.executionCount || '*') + ']'"></span>
                            <span
                                class="pill px-2 py-0.5 rounded-full text-[10px] font-medium uppercase tracking-wide">Python</span>
                        </div>
                        <div class="flex items-center gap-1">
                            <!-- Run Button -->
                            <button @click.stop="runCell(index)" :disabled="cell.isRunning"
                                class="run-btn w-7 h-7 rounded-lg flex items-center justify-center disabled:opacity-50">
                                <i class="ri-play-fill text-sm" x-show="!cell.isRunning"></i>
                                <i class="ri-loader-4-line animate-spin text-sm" x-show="cell.isRunning"></i>
                            </button>
                            <!-- Add Below -->
                            <button @click.stop="addCellBelow(index)"
                                class="btn-icon w-7 h-7 rounded-lg flex items-center justify-center opacity-0 group-hover:opacity-100"
                                :class="{'opacity-100': activeCellIndex === index}">
                                <i class="ri-add-line text-sm"></i>
                            </button>
                            <!-- Delete -->
                            <button @click.stop="removeCell(index)" x-show="cells.length > 1"
                                class="btn-icon w-7 h-7 rounded-lg flex items-center justify-center hover:!text-red-500 opacity-0"
                                :class="{'opacity-100': activeCellIndex === index}">
                                <i class="ri-delete-bin-6-line text-sm"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Code Input -->
                    <div class="code-area">
                        <textarea x-model="cell.code" @focus="activeCellIndex = index"
                            @keydown.ctrl.enter.prevent="runCell(index)"
                            @keydown.shift.enter.prevent="runCell(index); addCellBelow(index)"
                            @keydown.tab.prevent="insertTab($event, index)"
                            class="w-full bg-transparent font-mono text-sm p-4 resize-none leading-relaxed"
                            style="color: var(--text-primary)" placeholder="# Enter Python code..."
                            :style="'min-height: 100px; height: ' + Math.max(100, (cell.code.split('\n').length * 22 + 40)) + 'px'"></textarea>
                    </div>

                    <!-- Output Area -->
                    <div x-show="cell.output || cell.error" class="output-area">
                        <div class="px-4 py-3 font-mono text-sm">
                            <pre x-show="cell.output" class="whitespace-pre-wrap" style="color: var(--text-primary)"
                                x-text="cell.output"></pre>
                            <pre x-show="cell.error" class="whitespace-pre-wrap text-red-500" x-text="cell.error"></pre>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Add Cell Button -->
        <div class="flex justify-center mt-8">
            <button @click="addCell()"
                class="btn-primary px-6 py-2.5 rounded-xl font-medium text-sm flex items-center gap-2 transition-all">
                <i class="ri-add-line"></i>
                Add Cell
            </button>
        </div>

        <!-- Keyboard Hints -->
        <div class="mt-10 flex flex-wrap justify-center gap-4 text-xs" style="color: var(--text-muted)">
            <div class="flex items-center gap-1.5">
                <kbd class="px-1.5 py-0.5 rounded" style="background: var(--bg-tertiary)">Ctrl</kbd>
                <span>+</span>
                <kbd class="px-1.5 py-0.5 rounded" style="background: var(--bg-tertiary)">Enter</kbd>
                <span>Run cell</span>
            </div>
            <div class="flex items-center gap-1.5">
                <kbd class="px-1.5 py-0.5 rounded" style="background: var(--bg-tertiary)">Shift</kbd>
                <span>+</span>
                <kbd class="px-1.5 py-0.5 rounded" style="background: var(--bg-tertiary)">Enter</kbd>
                <span>Run + Add below</span>
            </div>
        </div>

    </main>

    <script>
        const API_BASE = 'http://127.0.0.1:8000';

        function notebookApp() {
            return {
                cells: [
                    {
                        id: Date.now(),
                        code: '',
                        output: '',
                        error: '',
                        isRunning: false,
                        executionCount: null
                    }
                ],
                executionCounter: 1,
                activeCellIndex: 0,

                addCell() {
                    this.cells.push({
                        id: Date.now() + Math.random(),
                        code: '',
                        output: '',
                        error: '',
                        isRunning: false,
                        executionCount: null
                    });
                    this.$nextTick(() => {
                        this.activeCellIndex = this.cells.length - 1;
                    });
                },

                addCellBelow(index) {
                    this.cells.splice(index + 1, 0, {
                        id: Date.now() + Math.random(),
                        code: '',
                        output: '',
                        error: '',
                        isRunning: false,
                        executionCount: null
                    });
                    this.$nextTick(() => {
                        this.activeCellIndex = index + 1;
                    });
                },

                removeCell(index) {
                    if (this.cells.length > 1) {
                        this.cells.splice(index, 1);
                        if (this.activeCellIndex >= this.cells.length) {
                            this.activeCellIndex = this.cells.length - 1;
                        }
                    }
                },

                clearAllOutputs() {
                    this.cells.forEach(cell => {
                        cell.output = '';
                        cell.error = '';
                        cell.executionCount = null;
                    });
                    this.executionCounter = 1;
                },

                async runAllCells() {
                    for (let i = 0; i < this.cells.length; i++) {
                        await this.runCell(i);
                    }
                },

                async runCell(index) {
                    const cell = this.cells[index];
                    cell.isRunning = true;
                    cell.output = '';
                    cell.error = '';

                    let codeToRun = "import sys\nimport os\n\n";

                    if (index > 0) {
                        codeToRun += "_orig_stdout = sys.stdout\n";
                        codeToRun += "sys.stdout = open(os.devnull, 'w')\n\n";

                        for (let i = 0; i < index; i++) {
                            codeToRun += this.cells[i].code + "\n\n";
                        }

                        codeToRun += "sys.stdout = _orig_stdout\n\n";
                    }

                    codeToRun += this.cells[index].code;

                    try {
                        const res = await fetch(`${API_BASE}/api/tunex/compiler/run`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ code: codeToRun })
                        });
                        const data = await res.json();

                        cell.output = data.output;
                        cell.error = data.error;
                        cell.executionCount = this.executionCounter++;

                    } catch (e) {
                        console.error(e);
                        cell.error = "Connection failed. Is the server running?";
                    } finally {
                        cell.isRunning = false;
                    }
                },

                insertTab(e, index) {
                    const textarea = e.target;
                    const start = textarea.selectionStart;
                    const end = textarea.selectionEnd;

                    this.cells[index].code = this.cells[index].code.substring(0, start) +
                        "    " + this.cells[index].code.substring(end);

                    this.$nextTick(() => {
                        textarea.selectionStart = textarea.selectionEnd = start + 4;
                    });
                }
            }
        }
    </script>
</body>

</html>
