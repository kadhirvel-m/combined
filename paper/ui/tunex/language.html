<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Levels | Tunex</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="../../assets/js/theme.js"></script>
    <!-- ... (styles/tailwind config same as before) ... -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gatex: {
                            bg: '#13131F',
                            card: '#1E1E2F',
                            cardHover: '#27293d',
                            primary: '#9E4B8A',
                            secondary: '#4C2A59',
                            accent: '#FF7F50',
                            success: '#00F090',
                            info: '#3B82F6'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .glass-header {
            background: rgba(19, 19, 31, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body class="bg-gatex-bg text-gray-100 font-sans antialiased" x-data="languageApp()">

    <!-- Header -->
    <header class="h-16 flex items-center justify-between px-6 sticky top-0 z-30 glass-header">
        <div class="flex items-center gap-4">
            <a href="index.html" class="p-2 rounded-lg text-gray-400 hover:text-white hover:bg-white/10">
                <i class="ri-arrow-left-line text-xl"></i>
            </a>
            <h1 class="text-lg font-bold" x-text="language ? language.name + ' - Levels' : 'Loading...'"></h1>
        </div>
        <div class="flex items-center gap-4">
            <button @click="Theme.toggle()" class="p-2 text-gray-400 hover:text-white transition">
                <i class="ri-moon-line dark:hidden"></i>
                <i class="ri-sun-line hidden dark:block"></i>
            </button>
        </div>
    </header>

    <main class="p-6 max-w-5xl mx-auto">

        <!-- Header & Add Button -->
        <div class="flex justify-between items-end mb-8">
            <div>
                <div class="flex items-center gap-3 mb-2">
                    <img :src="language?.logo_url" x-show="language?.logo_url" class="w-8 h-8 object-contain">
                    <h2 class="text-3xl font-bold" x-text="language?.name"></h2>
                </div>
                <p class="text-gray-400 text-sm max-w-2xl" x-text="language?.description"></p>
            </div>
            <button @click="openAddModal()"
                class="bg-gatex-primary hover:bg-gatex-secondary text-white px-4 py-2 rounded-xl flex items-center gap-2 transition shadow-lg shadow-gatex-primary/20">
                <i class="ri-add-line"></i> Add Level
            </button>
        </div>

        <!-- Levels List -->
        <div class="space-y-4">
            <template x-for="(level, index) in levels" :key="level.id">
                <div
                    class="bg-gatex-card border border-white/5 rounded-xl p-5 hover:border-gatex-primary/50 transition group flex items-center justify-between">
                    <a :href="'level.html?id=' + level.id + '&langName=' + (language?.name || '')"
                        class="flex-grow flex items-center justify-between mr-4">
                        <div class="flex items-center gap-4">
                            <span
                                class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center text-sm font-mono text-gray-400"
                                x-text="index + 1"></span>
                            <div>
                                <h3 class="font-bold text-lg group-hover:text-gatex-primary transition"
                                    x-text="level.title"></h3>
                                <p class="text-xs text-gray-500 mt-1">Order Index: <span
                                        x-text="level.order_index"></span></p>
                            </div>
                        </div>
                    </a>
                    <div class="flex items-center gap-3">
                        <a :href="'level.html?id=' + level.id + '&langName=' + (language?.name || '')"
                            class="text-xs bg-white/5 px-2 py-1 rounded text-gray-400 group-hover:bg-gatex-primary/10 group-hover:text-gatex-primary transition cursor-pointer">Manage
                            Sections</a>
                        <!-- Edit Button -->
                        <button @click="openEditModal(level)"
                            class="p-2 bg-white/5 hover:bg-white/10 rounded-lg text-gray-400 hover:text-white transition z-20">
                            <i class="ri-pencil-line"></i>
                        </button>
                        <i class="ri-arrow-right-s-line text-xl text-gray-600 group-hover:text-white transition"></i>
                    </div>
                </div>
            </template>
        </div>

        <!-- Empty State -->
        <div x-show="levels.length === 0 && !loading"
            class="text-center py-20 bg-gatex-card/50 rounded-2xl border border-white/5 border-dashed">
            <i class="ri-bar-chart-groupped-line text-4xl mb-3 block opacity-30"></i>
            <p class="text-gray-500">No levels yet. Add Beginner, Intermediate, etc.</p>
        </div>

        <!-- Add/Edit Modal -->
        <div x-show="showModal" class="fixed inset-0 z-50 flex items-center justify-center px-4" style="display: none;">
            <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" @click="closeModal()"></div>
            <div class="bg-gatex-card border border-white/10 rounded-2xl p-6 w-full max-w-md relative z-10 shadow-2xl">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold" x-text="isEdit ? 'Edit Level' : 'Add Level'"></h3>
                    <button x-show="isEdit" @click="deleteLevel()"
                        class="text-red-500 hover:text-red-400 text-sm flex items-center gap-1">
                        <i class="ri-delete-bin-line"></i> Delete
                    </button>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1">Title</label>
                        <input type="text" x-model="form.title"
                            class="w-full bg-gatex-bg border border-white/10 rounded-lg px-4 py-2 focus:border-gatex-primary outline-none transition"
                            placeholder="e.g., Beginner">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1">Order Index</label>
                        <input type="number" x-model="form.order_index"
                            class="w-full bg-gatex-bg border border-white/10 rounded-lg px-4 py-2 focus:border-gatex-primary outline-none transition">
                    </div>
                </div>

                <div class="flex justify-end gap-3 mt-6">
                    <button @click="closeModal()" class="px-4 py-2 rounded-lg hover:bg-white/5 text-sm">Cancel</button>
                    <button @click="submitForm()"
                        class="bg-gatex-primary hover:bg-gatex-secondary text-white px-4 py-2 rounded-lg text-sm font-medium transition"
                        x-text="isEdit ? 'Update' : 'Create'"></button>
                </div>
            </div>
        </div>

    </main>

    <script>
        const API_BASE = 'http://127.0.0.1:8000';

        function languageApp() {
            return {
                langId: null,
                language: null,
                levels: [],
                loading: true,
                showModal: false,
                isEdit: false,
                form: { id: null, title: '', order_index: 0 },

                init() {
                    const params = new URLSearchParams(window.location.search);
                    this.langId = params.get('id');
                    if (!this.langId) {
                        alert("No language ID provided");
                        window.location.href = 'index.html';
                        return;
                    }
                    this.fetchData();
                },

                async fetchData() {
                    this.loading = true;
                    try {
                        const [langRes, levelRes] = await Promise.all([
                            fetch(`${API_BASE}/api/lcoding/languages/${this.langId}`),
                            fetch(`${API_BASE}/api/lcoding/languages/${this.langId}/levels`)
                        ]);

                        if (langRes.ok) this.language = await langRes.json();
                        if (levelRes.ok) this.levels = await levelRes.json();

                        if (this.levels.length > 0 && !this.isEdit) {
                            const maxOrder = Math.max(...this.levels.map(l => l.order_index));
                            this.form.order_index = maxOrder + 10;
                        }

                    } catch (e) {
                        console.error("Failed to fetch data", e);
                    } finally {
                        this.loading = false;
                    }
                },

                openAddModal() {
                    this.isEdit = false;
                    this.form = { id: null, title: '', order_index: 0 };
                    // Recalculate max order
                    if (this.levels.length > 0) {
                        const maxOrder = Math.max(...this.levels.map(l => l.order_index));
                        this.form.order_index = maxOrder + 10;
                    }
                    this.showModal = true;
                },

                openEditModal(level) {
                    this.isEdit = true;
                    this.form = { id: level.id, title: level.title, order_index: level.order_index };
                    this.showModal = true;
                },

                closeModal() {
                    this.showModal = false;
                },

                async submitForm() {
                    if (!this.form.title) return alert("Title is required");

                    try {
                        let url = `${API_BASE}/api/lcoding/languages/${this.langId}/levels`;
                        let method = 'POST';

                        if (this.isEdit) {
                            url = `${API_BASE}/api/lcoding/levels/${this.form.id}`;
                            method = 'PUT';
                        }

                        const res = await fetch(url, {
                            method: method,
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                title: this.form.title,
                                order_index: this.form.order_index
                            })
                        });

                        if (res.ok) {
                            this.closeModal();
                            this.fetchData();
                        } else {
                            alert("Failed to " + (this.isEdit ? "update" : "create") + " level");
                        }
                    } catch (e) {
                        console.error("Error submitting form", e);
                        alert("Error occurred");
                    }
                },

                async deleteLevel() {
                    if (!confirm("Are you sure you want to delete this level? All associated sections and topics will be deleted.")) return;

                    try {
                        const res = await fetch(`${API_BASE}/api/lcoding/levels/${this.form.id}`, {
                            method: 'DELETE'
                        });

                        if (res.ok) {
                            this.closeModal();
                            this.fetchData();
                        } else {
                            alert("Failed to delete level");
                        }
                    } catch (e) {
                        console.error("Error deleting level", e);
                        alert("Error deleting level");
                    }
                }
            }
        }
    </script>
</body>

</html>
