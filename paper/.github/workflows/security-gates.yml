name: Security Gates

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  python-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and security tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit cyclonedx-bom

      - name: Generate SBOM (CycloneDX)
        run: |
          cyclonedx-py requirements requirements.txt --output-format json --output-file sbom.json

      - name: Run dependency vulnerability gate
        run: |
          pip-audit --requirement requirements.txt --strict --format json --output pip-audit.json

      - name: Syntax sanity compile
        run: |
          python -m compileall main.py packages

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-artifacts
          path: |
            sbom.json
            pip-audit.json
